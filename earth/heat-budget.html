<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지구의 열수지 인터랙티브 학습 자료 · KJE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 대기 대순환·엘니뇨 자료와 같은 틀: 위(또는 왼쪽) 그림 무대 + 단계별 설명 + 아래 넘김 막대 */
:root{
  --bg:#e6ecf1; --ink:#0f2236; --muted:#566779; --line:#c8d3dc; --panel:#f5f8fa;
  --warm:#d9412f; --cold:#2f7fc1; --ok:#1f8a5b; --hi:#f6c46a;
  --sky1:#86c8ee; --sky2:#d6eefa; --skyInk:#0d2945; --halo:#eef7fc;
  --btn:#0f2236; --btnInk:#f2f6f9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07121d; --ink:#e3ecf4; --muted:#8ea3b6; --line:#1d3349; --panel:#0d1c2c;
    --warm:#ef5a44; --cold:#4d9be0; --ok:#3cc488;
    --sky1:#0c2848; --sky2:#265687; --skyInk:#e8f2fb; --halo:#0b2440;
    --btn:#e3ecf4; --btnInk:#07121d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07121d; --ink:#e3ecf4; --muted:#8ea3b6; --line:#1d3349; --panel:#0d1c2c;
  --warm:#ef5a44; --cold:#4d9be0; --ok:#3cc488;
  --sky1:#0c2848; --sky2:#265687; --skyInk:#e8f2fb; --halo:#0b2440;
  --btn:#e3ecf4; --btnInk:#07121d; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.65 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  overflow:hidden; -webkit-tap-highlight-color:transparent; word-break:keep-all;
}
button{font:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#app{
  height:100%; max-width:1680px; margin:0 auto; display:flex; flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
header{flex:none;display:flex;align-items:center;gap:10px;min-height:54px}
.brand{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:23px;line-height:1;white-space:nowrap}
.brand small{font-family:"IBM Plex Sans KR",sans-serif;font-weight:500;font-size:14px;color:var(--muted);margin-left:6px}
#kicker{flex:1;min-width:0;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line);padding-left:14px}
.ibtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
#stageWrap{flex:none;width:100%}
#stage{
  position:relative;width:100%;margin:0 auto;aspect-ratio:1000/560;
  max-width:min(100%,calc(52vh * 1.7857)); max-width:min(100%,calc(52dvh * 1.7857));
  border-radius:18px;overflow:hidden;background:#0b2440;cursor:pointer;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
#stage.inter{cursor:default}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#cap{flex:1;min-height:0;min-width:0;overflow:auto;padding:2px 4px 18px;cursor:pointer;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column}
#cap.inter{cursor:auto}
#cap>.inner{margin:0}
nav{flex:none;display:flex;align-items:center;gap:14px;height:70px}
.nbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);color:var(--btnInk);display:grid;place-items:center;cursor:pointer}
.nbtn svg{width:22px;height:22px}
.nbtn:disabled{opacity:.28;cursor:default}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--warm);transition:width .4s ease}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#pips{display:flex;gap:6px}
#pips i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s}
#pips i.on{background:var(--warm)}
@media (min-aspect-ratio:5/4) and (min-width:640px){
  main{flex-direction:row;align-items:center;gap:30px}
  #stageWrap{flex:1.75 1 0;min-width:0}
  #stage{max-width:min(100%,calc((100vh - 140px) * 1.7857));max-width:min(100%,calc((100dvh - 140px) * 1.7857))}
  #cap{flex:1 1 0;min-width:320px;max-width:560px;max-height:100%;align-self:stretch}
  #cap>.inner{margin:auto 0}
}
@media (max-height:560px){ header{min-height:44px} nav{height:58px} .nbtn{width:44px;height:44px} }
#badge{position:absolute;right:12px;top:12px;padding:5px 14px;border-radius:999px;font-weight:700;font-size:clamp(12px,1.5vw,16px);color:#fff;background:#1f6a96;opacity:0;transition:opacity .3s;pointer-events:none}
#badge.on{opacity:1}
#hint{display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .3s;white-space:nowrap}
#hint.on{opacity:1}
#hint b{width:7px;height:7px;border-radius:50%;background:var(--warm);animation:tap 1.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.25);opacity:1}}
.scene{opacity:0;transition:opacity .45s ease;pointer-events:none}
.scene.on{opacity:1}
.lyr{opacity:0;transition:opacity .55s ease}
.lyr.vis{opacity:1}
.arw{transition:opacity .45s ease}
.tw{fill:#fff;font-weight:600;paint-order:stroke;stroke:rgba(4,18,34,.8);stroke-width:5px;stroke-linejoin:round}
.ts{fill:var(--skyInk);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round}
.tq{fill:#14283c;font-weight:600}
.tp{fill:#fff;font-weight:700}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.flow{stroke-dasharray:7 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.ray{stroke-dasharray:14 18;animation:ray 1.3s linear infinite}
@keyframes ray{to{stroke-dashoffset:-32}}
#cap h2{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(24px,2.3vw,34px);line-height:1.25;margin:0 0 12px;text-wrap:balance}
#cap p{margin:0 0 10px}
.intro{font-size:clamp(16px,1.2vw,19px)}
.st{display:none;padding:2px 0 2px 14px;border-left:3px solid transparent;color:var(--muted);font-size:clamp(16px,1.2vw,19px)}
.st.on{display:block;animation:stIn .4s ease both}
.st.now{color:var(--ink);border-left-color:var(--warm)}
@keyframes stIn{from{opacity:0}to{opacity:1}}
#cap b{font-weight:700}
.cover h1{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(58px,7vw,104px);line-height:.95;margin:0}
.cover .en{font-size:clamp(17px,1.5vw,22px);color:var(--muted);margin:10px 0 18px;letter-spacing:.02em}
.cover .lead{font-size:clamp(18px,1.5vw,22px);font-weight:600;line-height:1.5;margin-bottom:14px}
.cover .org{color:var(--muted)}
.by{font-weight:700;letter-spacing:.04em;color:var(--muted);margin:-4px 0 10px!important}
.go{margin:8px 0 14px;padding:14px 28px;border-radius:999px;border:0;background:var(--warm);color:#fff;font-weight:700;font-size:17px;cursor:pointer;min-height:48px}
.small{font-size:14px;color:var(--muted)}
/* lab */
.sl{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-top:12px}
.sl span{font-variant-numeric:tabular-nums;color:var(--warm)}
input[type=range]{width:100%;height:36px;accent-color:var(--warm);cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-4px}
.seg{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:96px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer}
.seg button.sel{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.ro{display:grid;grid-template-columns:auto 1fr;margin:14px 0 10px;font-size:15px;border-top:1px solid var(--line)}
.ro span{padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ro span:nth-child(odd){color:var(--muted);padding-right:16px;white-space:nowrap}
.note{font-size:15px;padding:10px 12px;border-radius:12px;background:var(--panel);border-left:4px solid var(--hi)}
/* table */
.cmp{width:100%;border-collapse:collapse;font-size:14px;line-height:1.45;margin-top:4px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{font-size:15px;border-bottom:2px solid var(--ink)}
.cmp tbody th{font-weight:700;white-space:nowrap}
.cmp tbody tr{opacity:0;transition:opacity .45s}
.cmp tbody tr.on{opacity:1}
.cmp .eq{font-weight:700;color:var(--warm)}
.cmp3 tbody tr{opacity:1}
.cmp3{font-size:13px;margin-top:6px}
.cmp3 td{transition:opacity .4s}
.cmp3 td.off{opacity:.12}
.cmp3 b{color:var(--warm)}
/* quiz */
.qh{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:4px}
.q{font-size:clamp(16px,1.2vw,19px);font-weight:600}
.bogi{border:1.5px solid var(--ink);border-radius:3px;padding:8px 14px 4px;margin:8px 0 12px;font-size:15px}
.bogi .bt{text-align:center;font-weight:700;margin-bottom:4px}
.bogi p{margin:0 0 6px!important}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;padding:11px 14px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opts.row .opt{flex:1 1 92px;text-align:center;padding:10px 6px;white-space:nowrap}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.wrong{border-color:var(--warm);background:color-mix(in srgb,var(--warm) 12%,var(--panel))}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border-left:4px solid var(--ok)}
.fb.x{border-left-color:var(--warm)}
.qnav{display:flex;gap:8px;margin-top:14px}
.qnav button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer;padding:0 12px}
.qnav button.pri{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.qnav button:disabled{opacity:.35;cursor:default}
.score{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:clamp(40px,5vw,64px);line-height:1;margin:6px 0 14px}
.rlist{list-style:none;padding:0;margin:0 0 14px}
.rlist li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.rlist .mk{font-weight:700;width:1.4em}
.rlist .o{color:var(--ok)} .rlist .x{color:var(--warm)}
@media (prefers-reduced-motion:reduce){
  .scene,.lyr,.arw{transition-duration:.2s}
  .st.on{animation:none}
  #hint b,.flow,.ray{animation:none}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">지구의 열수지<small>Earth's Energy Budget</small></div>
    <div id="kicker" aria-live="polite"></div>
    <button class="ibtn" id="fs" type="button" aria-label="전체 화면">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>
  <main>
    <div id="stageWrap">
      <div id="stage">
        <svg id="scene" viewBox="0 0 1000 560" role="img" aria-label="지구의 열수지 설명 그림"></svg>
        <div id="badge"></div>
      </div>
    </div>
    <section id="cap" aria-live="polite"><div class="inner"></div></section>
  </main>
  <nav>
    <button class="nbtn" id="prev" type="button" aria-label="이전">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="prog">
      <div class="bar"><i id="barI"></i></div>
      <div class="meta"><span id="cnt"></span><span id="hint"><b></b><span></span></span><span id="pips"></span></div>
    </div>
    <button class="nbtn" id="next" type="button" aria-label="다음">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</div>

<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
function el(tag, attrs, parent) {

}
function tx(parent, x, y, str, cls, size, anchor) {

}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;

function lyr(name, parent) { return el('g', { class: 'lyr', 'data-ly': name }, parent); }

const svg = $('#scene');
const defs = el('defs', null, svg);
function lin(id, x1, y1, x2, y2, stops, user) {

  stops.forEach(s => el('stop', { offset: s[0], style: 'stop-color:' + s[1] + ';stop-opacity:' + (s[2] == null ? 1 : s[2]) }, g));
}
function rad(id, stops) {
  const g = el('radialGradient', { id }, defs);
  stops.forEach(s => el('stop', { offset: s[0], style: 'stop-color:' + s[1] + ';stop-opacity:' + (s[2] == null ? 1 : s[2]) }, g));
}
lin('spaceG', 0, 0, 0, 1, [[0, '#0d2a4a'], [1, '#06162a']]);
lin('skyG', 0, 0, 0, 1, [[0, 'var(--sky1)'], [1, 'var(--sky2)']]);
lin('atmG', 0, 0, 0, 1, [[0, '#9fd2f2', .2], [.5, '#c8e6f8', .55], [1, '#9fd2f2', .2]]);
lin('gndG', 0, 0, 1, 0, [[0, '#4f8a43'], [.45, '#6f9a52'], [.62, '#2f78b4'], [1, '#2a6aa3']]);

rad('glowG', [[0, '#ffffff', .75], [1, '#ffffff', 0]]);
const SW = '#f2b53a', LW = '#e2553b', CV = '#3f9a5b', LH = '#2f86c8', MIXC = '#e68a3e';

/* 굵기가 값에 비례하는 화살표 (100 → 32px) */
function mkArrow(parent, col, tags, noFlow) {
  const g = el('g', { class: 'arw', 'data-t': tags || '' }, parent);
  const body = el('path', { fill: 'none', stroke: col, 'stroke-linejoin': 'round' }, g);

    g, set(pts, v) {
      const w = 6 + v * .26, n = pts.length, a = pts[n - 2], b = pts[n - 1];

      const hl = Math.min(w * .7 + 12, L * .7), hw = w / 2 + 9, e = [b[0] - ux * hl, b[1] - uy * hl];

function arrow(parent, pts, v, col, tags) { const a = mkArrow(parent, col, tags); a.set(pts, v); return a.g; }
function label(parent, x, y, num, lines, anchor) {

function box(name, parent, lines, y0) {
  const L = lyr(name, parent), y = y0 || 474, h = lines.length > 1 ? 74 : 48;

  lines.forEach((s, i) => tx(L, 500, y + 31 + i * 27, s, 'tw', 18));

}
function cloud(parent, cx, cy, s) {
  const g = el('g', { transform: `translate(${cx},${cy}) scale(${s || 1})` }, parent);
  [[-26, 4, 18], [-8, -8, 22], [14, -2, 20], [30, 6, 15], [0, 8, 18]].forEach(c => el('circle', { cx: c[0], cy: c[1], r: c[2], fill: '#f4f7fa' }, g));
  el('ellipse', { cx: 2, cy: 18, rx: 44, ry: 7, fill: '#c9d4de' }, g);
  return g;
}
function molecule(parent, x, y, kind, s) {
  const g = el('g', { transform: `translate(${x},${y}) scale(${s || 1})` }, parent);
  if (kind === 'co2') {
    el('line', { x1: -14, y1: 0, x2: 14, y2: 0, stroke: '#3b4a59', 'stroke-width': 3 }, g);
    el('circle', { cx: -15, cy: 0, r: 7, fill: '#e04a3a', stroke: '#7a1d14', 'stroke-width': 1.2 }, g);
    el('circle', { cx: 15, cy: 0, r: 7, fill: '#e04a3a', stroke: '#7a1d14', 'stroke-width': 1.2 }, g);
    el('circle', { cx: 0, cy: 0, r: 8, fill: '#3b4a59', stroke: '#111', 'stroke-width': 1.2 }, g);
  } else {
    el('line', { x1: -11, y1: 9, x2: 0, y2: 0, stroke: '#3b4a59', 'stroke-width': 3 }, g);
    el('line', { x1: 11, y1: 9, x2: 0, y2: 0, stroke: '#3b4a59', 'stroke-width': 3 }, g);
    el('circle', { cx: 0, cy: 0, r: 8, fill: '#e04a3a', stroke: '#7a1d14', 'stroke-width': 1.2 }, g);
    el('circle', { cx: -12, cy: 10, r: 5, fill: '#f4f7fa', stroke: '#6b7b8a', 'stroke-width': 1.2 }, g);
    el('circle', { cx: 12, cy: 10, r: 5, fill: '#f4f7fa', stroke: '#6b7b8a', 'stroke-width': 1.2 }, g);
  }
  return g;
}
function wave(x1, y1, x2, y2, amp, per) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, n = Math.ceil(L / 4);

  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el('line', { x1: f1(Math.cos(a) * (r + 5)), y1: f1(Math.sin(a) * (r + 5)), x2: f1(Math.cos(a) * (r + 13)), y2: f1(Math.sin(a) * (r + 13)), stroke: '#ffd166', 'stroke-width': 3, 'stroke-linecap': 'round' }, g); }
  el('circle', { r, fill: 'url(#sunG)' }, g);
  return g;
}
function thermo(parent, x, yTop, yBot, r) {
  const g = el('g', null, parent);
  el('rect', { x: x - 9, y: yTop, width: 18, height: yBot - yTop + 4, rx: 9, fill: '#f4f7fa', stroke: '#33475a', 'stroke-width': 2 }, g);
  el('circle', { cx: x, cy: yBot + r - 2, r, fill: '#d9412f', stroke: '#33475a', 'stroke-width': 2 }, g);
  const fill = el('rect', { x: x - 5, width: 10, rx: 5, fill: '#d9412f' }, g);
  return { g, set(fr) { const top = mix(yBot, yTop + 6, clamp(fr)); fill.setAttribute('y', f1(top)); fill.setAttribute('height', f1(yBot + 6 - top)); } };
}

  inner.innerHTML = '<h2>직접 바꿔 보기</h2><p class="intro">온실 기체의 양과 지구의 반사율을 바꾸면 지표의 평균 기온이 어떻게 달라지는지 확인해 보자.</p>' +
    '<div class="seg" role="group" aria-label="예시 고르기">' + PRE.map((p, i) => `<button type="button" data-i="${i}">${p[0]}</button>`).join('') + '</div>' +
    '<label class="sl" for="eR">온실 기체의 양 <span id="eV"></span></label>' +
    '<input type="range" id="eR" min="0" max="100" step="1">' +
    '<div class="scale"><span>없음</span><span>지표 복사를 모두 흡수</span></div>' +
    '<label class="sl" for="aR">지구의 반사율 <span id="aV"></span></label>' +
    '<input type="range" id="aR" min="20" max="45" step="1">' +
    '<div class="scale"><span>20 % (어두운 지구)</span><span>45 % (밝은 지구)</span></div>' +
    '<div class="ro"><span>지표 평균 기온</span><span id="r0"></span><span>지구가 흡수하는 태양 복사</span><span id="r1"></span><span>우주로 나가는 지구 복사</span><span id="r2"></span></div>' +
    '<p class="note">대기를 한 층으로 보고 대류와 숨은열을 뺀 <b>단순 모형</b>이다. 그래서 화살표의 값은 앞의 열수지 그림과 다르다. 어느 경우든 평형에서는 흡수하는 태양 복사와 우주로 나가는 지구 복사가 같다.</p>';
  const eR = $('#eR'), aR = $('#aR');
  eR.value = Math.round(LAB.e * 100); aR.value = Math.round(LAB.a * 100);
  eR.addEventListener('input', () => setLab(+eR.value / 100, LAB.a));
  aR.addEventListener('input', () => setLab(LAB.e, +aR.value / 100));
  inner.querySelectorAll('.seg button').forEach(b => b.onclick = () => { const p = PRE[+b.dataset.i]; setLab(p[1], p[2]); });
  applyState({ scene: 'lab', ly: new Set(), set: {} });
  setLab(LAB.e, LAB.a);
}
function setLab(e, a) {
  LAB.e = e; LAB.a = a;
  const eR = $('#eR'), aR = $('#aR');
  if (eR && +eR.value !== Math.round(e * 100)) eR.value = Math.round(e * 100);
  if (aR && +aR.value !== Math.round(a * 100)) aR.value = Math.round(a * 100);
  inner.querySelectorAll('.seg button').forEach(b => { const p = PRE[+b.dataset.i]; b.classList.toggle('sel', Math.abs(p[1] - e) < .005 && Math.abs(p[2] - a) < .005); });
  const r = drawLab();
  const v = $('#eV'); if (v) v.textContent = Math.round(e * 100) + ' %';
  const w = $('#aV'); if (w) w.textContent = Math.round(a * 100) + ' %';
  const t = r.Ts;
  $('#r0').innerHTML = `<b>${t < 0 ? '−' : ''}${Math.abs(t).toFixed(1)} °C</b>`;
  $('#r1').textContent = Math.round(r.abs);
  $('#r2').textContent = Math.round(r.up + r.win) + ' (대기 ' + Math.round(r.up) + ' + 지표 ' + Math.round(r.win) + ')';
}
/* 확인 문제 */
const QZ = { i: 0, ans: QUIZ.map(() => null), done: false };
const CIR = ['①', '②', '③', '④', '⑤'];
function quizScene(q, answered) {
  if (answered && q.sceneA) return applyState({ scene: q.sceneA, ly: new Set(q.lyA), set: {} });
  applyState({ scene: q.scene || 'bud', ly: new Set(q.ly.concat(answered ? q.lyA || [] : [])), set: { f: answered ? q.f : null } });
}
function renderQuiz() {
  if (QZ.done) return renderResult();
  const q = QUIZ[QZ.i], a = QZ.ans[QZ.i];
  quizScene(q, a !== null);
  inner.innerHTML = `<h2>확인 문제</h2><div class="qh">${QZ.i + 1} / ${QUIZ.length}</div><p class="q">${q.q}</p>` +
    (q.bogi ? `<div class="bogi"><div class="bt">〈보기〉</div>${q.bogi.map(b => `<p>${b}</p>`).join('')}</div>` : '') +
    `<div class="opts${q.row ? ' row' : ''}">` + q.o.map((o, i) => `<button type="button" class="opt" data-i="${i}">${q.bogi ? o : CIR[i] + ' ' + o}</button>`).join('') + '</div>' +
    '<div id="fbx"></div>' +
    `<div class="qnav"><button type="button" id="qp"${QZ.i === 0 ? ' disabled' : ''}>이전 문제</button><button type="button" id="qn" class="pri">${QZ.i === QUIZ.length - 1 ? '결과 보기' : '다음 문제'}</button></div>`;
  inner.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  $('#qp').onclick = () => { QZ.i--; renderQuiz(); };
  $('#qn').onclick = () => { if (QZ.i === QUIZ.length - 1) QZ.done = true; else QZ.i++; renderQuiz(); };
  if (a !== null) showFb();
  cap.scrollTop = 0; updateNav();
}
function answer(i) {
  if (QZ.ans[QZ.i] !== null) return;
  QZ.ans[QZ.i] = i; showFb(); quizScene(QUIZ[QZ.i], true);
}
function showFb() {
  const q = QUIZ[QZ.i], a = QZ.ans[QZ.i], ok = a === q.a;
  inner.querySelectorAll('.opt').forEach(b => {
    const i = +b.dataset.i; b.disabled = true;
    if (i === q.a) b.classList.add('right'); else if (i === a) b.classList.add('wrong');
  });
  const lab = q.bogi ? q.o[q.a] : CIR[q.a] + ' ' + q.o[q.a];
  $('#fbx').innerHTML = `<div class="fb${ok ? '' : ' x'}"><b>${ok ? '정답' : '오답'}</b>${ok ? '' : ` (정답: ${lab})`}<br>${q.ex}</div>`;
  const f = $('#fbx .fb'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
}
function renderResult() {
  const n = QZ.ans.filter((a, i) => a === QUIZ[i].a).length;
  applyState({ scene: 'bud', ly: new Set(SOL.concat(TER)), set: {} });
  inner.innerHTML = `<h2>확인 문제 결과</h2><div class="score">${n} / ${QUIZ.length}</div><ul class="rlist">` +
    QUIZ.map((q, i) => { const ok = QZ.ans[i] === q.a; return `<li><span class="mk ${ok ? 'o' : 'x'}">${ok ? '○' : '×'}</span><span>${i + 1}. ${QT[i]}</span></li>`; }).join('') +
    '</ul><div class="qnav"><button type="button" id="qr">다시 풀기</button><button type="button" id="q0" class="pri">처음부터 다시 보기</button></div>';
  $('#qr').onclick = () => { QZ.i = 0; QZ.ans = QUIZ.map(() => null); QZ.done = false; renderQuiz(); };
  $('#q0').onclick = () => go(0);
  cap.scrollTop = 0; updateNav();
}
/* 넘김 */
function show(slideChanged) {
  const sl = SLIDES[cur.s];
  if (slideChanged) renderCaption(sl);
  if (!sl.lab && !sl.quiz) applyState(stateAt(sl, cur.k));
  updateSteps(sl, cur.k);
  updateNav();
}
function next() {
  const sl = SLIDES[cur.s];
  if (!sl.interactive && cur.k < sl.steps.length) { cur.k++; show(false); }
  else if (cur.s < SLIDES.length - 1) { cur.s++; cur.k = 0; show(true); }
}
function prev() {
  const sl = SLIDES[cur.s];
  if (!sl.interactive && cur.k > 0) { cur.k--; show(false); }
  else if (cur.s > 0) { cur.s--; cur.k = SLIDES[cur.s].steps.length; show(true); }
}
function go(s) { cur.s = s; cur.k = 0; show(true); }
function updateNav() {
  const sl = SLIDES[cur.s], mk = sl.steps.length, N = SLIDES.length;
  $('#prev').disabled = cur.s === 0 && cur.k === 0;
  $('#next').disabled = cur.s === N - 1;
  $('#barI').style.width = ((cur.s + (mk ? cur.k / mk : 1)) / N * 100).toFixed(1) + '%';
  $('#cnt').textContent = (cur.s + 1) + ' / ' + N;
  $('#kicker').textContent = sl.ch;
  $('#pips').innerHTML = Array.from({ length: mk }, (_, i) => `<i class="${i < cur.k ? 'on' : ''}"></i>`).join('');
  const hint = $('#hint'), on = !sl.interactive && cur.s < N - 1;
  hint.classList.toggle('on', on);
  hint.querySelector('span').textContent = sl.cover ? '누르면 시작' : cur.k < mk ? '누르면 계속' : '누르면 다음 장';
}
let suppress = false, sx = null, sy = 0;
function onTap(e) {
  if (suppress) { suppress = false; return; }
  if (SLIDES[cur.s].interactive) return;
  if (e.target.closest('button,a,input,label,select')) return;
  if (window.getSelection && String(window.getSelection())) return;
  next();
}
[stage, cap].forEach(n => {
  n.addEventListener('click', onTap);
  n.addEventListener('pointerdown', e => { if (e.target.closest('input,button')) { sx = null; return; } sx = e.clientX; sy = e.clientY; });
  n.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.4 * Math.abs(dy)) { suppress = true; setTimeout(() => { suppress = false; }, 450); dx < 0 ? next() : prev(); }
  });
  n.addEventListener('pointercancel', () => { sx = null; });
});
$('#next').onclick = () => next();
$('#prev').onclick = () => prev();
addEventListener('keydown', e => {
  const t = e.target, tag = t && t.tagName;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(SLIDES.length - 1); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
});
const fsb = $('#fs');
if (!document.fullscreenEnabled) fsb.hidden = true;
function toggleFS() {
  if (!document.fullscreenEnabled) return;
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {}
}
fsb.onclick = toggleFS;

buildBud(); buildSpec(); buildGraph(); buildLoop(); buildLab(); buildCmp(); buildIce();
show(true);
</script>
