<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>배터리 가상 시험동 · KJE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 배터리 회사 셀 시험동. 밝은 알루미늄 회색 바닥 위에 시험 기록지(흰 판)와 노란 멀티미터, 구리색 버튼.
   왼쪽은 실험 장치 그림(멀티미터 액정이 입력한 값을 그대로 보여 줌), 오른쪽은 기록 패널. */
:root{
  --bg:#E5E9EB; --sheet:#F8F9F8; --sheet2:#ECEFF0; --field:#FFFFFF; --ink:#1A1F23; --ink2:#55616A; --line:#C2CACF;
  --acc:#A9531F; --on-acc:#FFF9F4; --acc-soft:#F3E3D7; --focus:#2C78C8;
  --pos:#D1342B; --neg:#23282C; --neg-edge:#23282C;
  --good:#24804F; --warn:#B57A06; --bad:#C0352D;
  --meter:#F2C12E; --meter-edge:#9C7A0E; --lcd:#B8C6A2; --lcd-ink:#1C2918; --lcd-dim:rgba(28,41,24,.18);
  --plate:#B9C0C6; --plate-edge:#7D868D; --paper:#CFE6F3; --paper-edge:#8DB6CF;
  --mg:#DCE0E4; --zn:#A6B1BA; --fe:#6B7177; --cu:#C9703F; --al:#CDD3D8;
  --grid:rgba(26,31,35,.06); --brine:#9FCDE6; --cuso4:#2F86C9; --elec:#E5A100;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --num:"Share Tech Mono","IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171A; --sheet:#1B2125; --sheet2:#242C31; --field:#10151A; --ink:#E5EAED; --ink2:#9AA7B0; --line:#36424A;
    --acc:#E0874C; --on-acc:#1C0D04; --acc-soft:#3A271B; --focus:#7DB6EE;
    --neg:#0D1013; --neg-edge:#8E989F; --good:#5BC98C; --warn:#E6B44A; --bad:#FF7A6E;
    --plate:#8C959C; --plate-edge:#5E676E; --paper:#3C5A6C; --paper-edge:#6E93AA;
    --grid:rgba(229,234,237,.05); --brine:#3E7899; --cuso4:#3B95DA; --elec:#F2B92E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171A; --sheet:#1B2125; --sheet2:#242C31; --field:#10151A; --ink:#E5EAED; --ink2:#9AA7B0; --line:#36424A;
  --acc:#E0874C; --on-acc:#1C0D04; --acc-soft:#3A271B; --focus:#7DB6EE;
  --neg:#0D1013; --neg-edge:#8E989F; --good:#5BC98C; --warn:#E6B44A; --bad:#FF7A6E;
  --plate:#8C959C; --plate-edge:#5E676E; --paper:#3C5A6C; --paper-edge:#6E93AA;
  --grid:rgba(229,234,237,.05); --brine:#3E7899; --cuso4:#3B95DA; --elec:#F2B92E;
  color-scheme: dark;
}
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ margin:0; min-height:100%; background-color:var(--bg); background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:32px 32px; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55; overflow-x:hidden; }
body.locked{ overflow:hidden; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
h1, h2, h3{ text-wrap:balance; }
.disp{ font-family:var(--display); font-weight:400; font-synthesis:none; }
.num{ font-family:var(--num); font-variant-numeric:tabular-nums; }

#app{ max-width:1280px; margin:0 auto; padding-inline:clamp(16px,2.6vw,30px); padding-block:0 40px; }

/* ── header & steps ── */
.top{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 22px; padding:14px 0 10px; }
.home{ background:none; border:0; padding:6px 0; cursor:pointer; font-family:var(--display); font-size:24px; line-height:1; }
.caseid{ display:flex; flex-wrap:wrap; gap:2px 12px; align-items:baseline; }
.caseid .no{ font-family:var(--num); font-size:17px; }
.caseid .place{ color:var(--ink2); display:inline-flex; align-items:center; gap:8px; }
.clock{ margin-left:auto; display:flex; align-items:baseline; gap:8px; }
.clock-l{ font-size:14px; color:var(--ink2); }
#timer{ font-family:var(--num); font-size:24px; color:var(--acc); }
.steps{ list-style:none; margin:0 0 20px; padding:10px 0 12px; display:flex; gap:6px; overflow-x:auto; border-top:2px solid var(--ink); scrollbar-width:thin; }
.steps li{ flex:none; display:flex; align-items:center; gap:4px; }
.steps button{ min-height:40px; padding:0 13px; border-radius:6px; border:1.5px solid var(--line); background:var(--sheet); color:var(--ink2); font-size:15px; white-space:nowrap; cursor:pointer; }
.steps button.done{ color:var(--ink); border-color:var(--ink2); }
.steps button[aria-current="step"]{ background:var(--ink); color:var(--sheet); border-color:var(--ink); font-weight:700; }
.steps button:disabled{ opacity:.45; cursor:default; }
.steps .grp{ padding:0 8px; margin:0 2px; border-left:1.5px dashed var(--line); border-right:1.5px dashed var(--line); }
.grp-l{ font-size:13px; color:var(--ink2); margin-right:2px; white-space:nowrap; }

/* ── common blocks ── */
h1.st{ font-family:var(--display); font-weight:400; font-synthesis:none; font-size:clamp(32px,4.2vw,46px); line-height:1.1; margin:0 0 8px; }
.instr{ font-size:18px; max-width:62ch; margin:0 0 10px; }
.who{ color:var(--ink2); font-size:15px; margin:0 0 14px; max-width:75ch; }
.who b{ color:var(--ink); font-weight:600; }
.narrow{ max-width:840px; }
.say{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:baseline; background:var(--sheet); border:1.5px solid var(--line); border-left:5px solid var(--acc); padding:12px 16px; margin:0 0 18px; border-radius:4px 10px 10px 4px; max-width:70ch; }
.say b{ font-family:var(--display); font-weight:400; font-synthesis:none; font-size:20px; color:var(--acc); white-space:nowrap; }
.say p{ margin:0; }
.actions{ display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:12px 16px; margin-top:24px; }
.progress{ color:var(--ink2); font-variant-numeric:tabular-nums; margin-right:auto; }
.primary{ min-height:56px; padding:0 26px; border-radius:10px; border:0; background:var(--acc); color:var(--on-acc); font-size:18px; font-weight:700; cursor:pointer; }
.primary:disabled{ opacity:.35; cursor:not-allowed; }
.primary.danger{ background:var(--bad); color:#fff; }
.secondary{ min-height:50px; padding:0 18px; border-radius:10px; border:1.5px solid var(--ink); background:var(--sheet); font-weight:600; cursor:pointer; }
.secondary:disabled{ opacity:.45; cursor:default; }
.ghost{ min-height:50px; padding:0 16px; border-radius:10px; border:1.5px dashed var(--ink2); background:transparent; color:var(--ink2); font-weight:600; cursor:pointer; }
.ghost:disabled{ opacity:.45; cursor:default; }
.primary.sm, .secondary.sm, .ghost.sm{ min-height:46px; padding:0 16px; font-size:16px; }
.banner{ background:var(--sheet); border:2px solid var(--warn); border-radius:8px; padding:10px 14px; margin:0 0 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
.hint{ list-style:none; padding:0; margin:14px 0 0; color:var(--ink2); font-size:15px; }
.hint li::before{ content:"· "; }
h2.sec{ font-family:var(--display); font-weight:400; font-synthesis:none; font-size:26px; margin:28px 0 10px; }
h3.sub3{ font-size:17px; margin:18px 0 6px; }
.scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* ── form fields ── */
label.f{ display:block; font-size:15px; color:var(--ink2); }
label.f > span{ display:block; margin-bottom:6px; }
input[type=text], input[type=password], select, textarea{ width:100%; min-height:52px; font:inherit; font-size:18px; padding:0 12px; border-radius:8px; border:1.5px solid var(--line); background:var(--field); color:var(--ink); }
textarea{ min-height:130px; padding:12px; resize:vertical; line-height:1.6; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:380px; margin:18px 0; }
fieldset{ border:0; padding:0; margin:0; }
legend{ font-weight:700; margin-bottom:10px; padding:0; }
.members{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr)); gap:12px; }
.count{ font-size:14px; color:var(--ink2); text-align:right; margin-top:4px; font-variant-numeric:tabular-nums; }
.terr{ margin:6px 0 0; font-size:14px; color:var(--bad); }
.terr:empty{ display:none; }

/* ── option buttons ── */
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt{ flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 14px; border-radius:8px; border:1.5px solid var(--line); background:var(--sheet2); font-weight:600; cursor:pointer; }
.opt[aria-pressed="true"]{ background:var(--ink); color:var(--sheet); border-color:var(--ink); }
.opt small{ font-weight:500; font-size:12px; opacity:.75; }
.opt:disabled{ opacity:.4; cursor:default; }
.sw{ display:inline-block; width:18px; height:18px; border-radius:4px; flex:none; vertical-align:-3px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.25); }
.sub-l{ display:block; font-size:14px; color:var(--ink2); margin:12px 0 6px; }

/* ── work layout ── */
.work{ display:grid; grid-template-columns:1fr; gap:22px; }
.rig{ min-width:0; }
.rig svg{ display:block; width:100%; height:auto; max-width:520px; margin:0 auto; }
.work > section{ min-width:0; }
.legend{ font-size:14px; color:var(--ink2); text-align:center; margin:6px 0 0; }
@media (min-width:900px){
  .work{ grid-template-columns:minmax(0,5fr) minmax(0,7fr); align-items:start; }
  .rig{ position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px); }
}
@media (max-width:899px){ .rig svg{ max-width:420px; } }

/* ── cards (plates / pairs) ── */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:12px; }
.card{ position:relative; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:12px 14px 14px; min-width:0; }
.card.on{ border-color:var(--ink2); }
.card.focus{ border-color:var(--focus); box-shadow:0 0 0 3px var(--focus); }
.card-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; min-height:40px; }
.pl{ font-family:var(--display); font-size:30px; line-height:1; }
.card-head .ok{ margin-left:auto; color:var(--good); font-size:14px; font-weight:600; white-space:nowrap; }
.pairname{ display:inline-flex; align-items:center; gap:6px; font-family:var(--display); font-size:28px; line-height:1; }
.clip{ display:inline-block; width:12px; height:12px; border-radius:3px; }
.clip.r{ background:var(--pos); }
.clip.k{ background:var(--neg); box-shadow:0 0 0 1.5px var(--neg-edge); }
.mini{ margin:0; font-size:14px; color:var(--ink2); }

/* voltage input */
.vin{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.vin input{ width:120px; flex:none; text-align:center; font-family:var(--num); font-size:26px; padding:0 6px; }
.vin .unit{ font-weight:700; color:var(--ink2); }
.sign{ min-width:68px; min-height:52px; border-radius:8px; border:1.5px solid var(--line); background:var(--sheet2); font-weight:700; cursor:pointer; padding:0 10px; }
.sign[aria-pressed="true"]{ background:var(--ink); color:var(--sheet); border-color:var(--ink); }

/* svg common */
.svg-t{ fill:var(--ink); font-family:var(--body); }
.svg-t2{ fill:var(--ink2); font-family:var(--body); }
.svg-d{ fill:var(--ink); font-family:var(--display); }
.m-body{ fill:var(--meter); stroke:var(--meter-edge); stroke-width:2; }
.m-lcd{ fill:var(--lcd); stroke:#5C6A4E; stroke-width:2; }
.m-dig{ fill:var(--lcd-ink); font-family:var(--num); }
.m-ghost{ fill:var(--lcd-dim); font-family:var(--num); }
.m-dial{ fill:#2B2F33; stroke:#111; stroke-width:1.5; }
.m-lab{ fill:#2B2F33; font-family:var(--body); font-weight:700; }
.jack-r{ fill:var(--pos); stroke:#111; stroke-width:1.2; }
.jack-k{ fill:#202428; stroke:#111; stroke-width:1.2; }
.jack-n{ fill:#3A3F44; stroke:#111; stroke-width:1.2; }
.bk-glass{ fill:none; stroke:var(--ink2); stroke-width:2.5; stroke-linejoin:round; }
.bk-water{ fill:var(--brine); }
.bk-zn{ fill:var(--brine); fill-opacity:.35; }
.bk-cu{ fill:var(--cuso4); }
.bridge{ fill:none; stroke:var(--paper); stroke-width:16; stroke-linejoin:round; }
.e-dot{ fill:var(--elec); stroke:var(--sheet); stroke-width:1.5; }
.ion-p{ fill:var(--sheet); stroke:var(--acc); stroke-width:2; }
.ion-c{ fill:#BFE0F7; stroke:#1F6FAF; stroke-width:2; }
.ion-n{ fill:var(--sheet); stroke:var(--focus); stroke-width:2; stroke-dasharray:3 2; }
.bub{ fill:none; stroke:var(--ink2); stroke-width:1.5; }
.mv-t{ fill:var(--ink); font-family:var(--body); font-weight:700; pointer-events:none; }
.w-r{ fill:none; stroke:var(--pos); stroke-width:4; stroke-linecap:round; }
.w-k{ fill:none; stroke:var(--neg); stroke-width:4; stroke-linecap:round; }
.w-k-edge{ fill:none; stroke:var(--neg-edge); stroke-width:6; stroke-linecap:round; opacity:.55; }
.w-g{ fill:none; stroke:var(--ink2); stroke-width:3.5; stroke-linecap:round; }
.c-r{ fill:var(--pos); }
.c-k{ fill:var(--neg); stroke:var(--neg-edge); stroke-width:1.2; }
.plate{ stroke:var(--plate-edge); stroke-width:2; }
.paper{ fill:var(--paper); stroke:var(--paper-edge); stroke-width:1.5; }
.fade{ opacity:.35; }
.hl{ fill:none; stroke:var(--focus); stroke-width:3; stroke-dasharray:6 5; }

/* ladder */
.lad-axis{ stroke:var(--ink); stroke-width:2; }
.lad-grid{ stroke:var(--line); stroke-width:1; }
.lad-tick{ fill:var(--ink2); font-family:var(--num); font-size:15px; }
.lad-gap{ stroke:var(--acc); stroke-width:2; fill:none; }
.lad-gt{ fill:var(--acc); font-family:var(--num); font-size:16px; }

/* ── roles & checks ── */
.role{ background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.role h2{ font-family:var(--display); font-weight:400; font-synthesis:none; font-size:24px; margin:0; }
.duty{ margin:4px 0 12px; color:var(--ink2); font-size:15px; }
.role.fixed{ background:transparent; border-style:dashed; }
.check{ display:grid; grid-template-columns:34px 1fr; gap:2px 14px; width:100%; text-align:left; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; cursor:pointer; min-height:64px; align-items:center; }
.box{ grid-row:span 2; width:32px; height:32px; border:2.5px solid var(--ink2); border-radius:6px; display:grid; place-items:center; }
.check[aria-checked="true"]{ border-color:var(--good); }
.check[aria-checked="true"] .box{ background:var(--good); border-color:var(--good); }
.check[aria-checked="true"] .box::after{ content:""; width:9px; height:16px; border:solid #fff; border-width:0 3px 3px 0; transform:translate(0,-2px) rotate(45deg); }
.who-l{ font-size:14px; color:var(--ink2); }

/* ── case document ── */
.doc{ background:var(--sheet); border:1.5px solid var(--line); border-top:6px solid var(--ink); border-radius:2px; padding:22px clamp(14px,3vw,30px); max-width:940px; margin-bottom:18px; }
.doc-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 18px; margin-bottom:14px; }
.doc-title{ font-family:var(--display); font-size:32px; margin:0; }
.doc-org{ color:var(--ink2); margin:0; }
table.form{ width:100%; border-collapse:collapse; margin-bottom:14px; font-size:16px; }
.form th, .form td{ border:1px solid var(--line); padding:9px 12px; vertical-align:top; text-align:left; }
.form th{ background:var(--sheet2); white-space:nowrap; width:1%; text-align:center; }
.form caption{ font-weight:700; padding:8px; background:var(--sheet2); border:1px solid var(--line); border-bottom:0; text-align:left; }
.rule{ border:2px solid var(--ink); background:var(--sheet); padding:12px 16px; border-radius:4px; margin:0 0 16px; max-width:70ch; }
.rule b{ display:block; font-family:var(--display); font-weight:400; font-size:20px; margin-bottom:2px; }
.rule p{ margin:0; }
.rule .num{ font-size:20px; }

/* ── order & judge ── */
.tally{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr)); gap:8px; margin:0 0 16px; }
.tally div{ background:var(--sheet); border:1.5px solid var(--line); border-radius:8px; padding:8px 12px; }
.tally .pairname{ font-size:22px; }
.tally p{ margin:2px 0 0; font-size:15px; }
.tally .num{ font-size:18px; }
.orderbar{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:6px 0 4px; }
.slotbox{ min-height:84px; border:2px dashed var(--line); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--sheet); }
.slotbox.fill{ border-style:solid; border-color:var(--ink); }
.slotbox .pl{ font-size:34px; }
.slotbox small{ color:var(--ink2); font-size:13px; }
.ends{ display:flex; justify-content:space-between; font-size:14px; color:var(--ink2); margin-bottom:12px; }
.pick4 .opt{ font-family:var(--display); font-size:30px; font-weight:400; min-height:64px; }
.jgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:12px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:46px; padding:0 14px; border-radius:999px; border:1.5px dashed var(--ink2); background:transparent; font-size:15px; cursor:pointer; }
.chip[aria-pressed="true"]{ border-style:solid; border-color:var(--acc); background:var(--acc-soft); font-weight:700; }
.msgs{ list-style:none; padding:0; margin:12px 0 0; font-size:15px; }
.msgs li{ margin-top:4px; }
.msgs .err{ color:var(--bad); }
.msgs .note{ color:var(--ink2); }
.msgs .good{ color:var(--good); }
.jfoot{ display:flex; justify-content:flex-end; margin-top:12px; }
.stamp{ display:inline-block; margin-left:auto; font-family:var(--display); font-weight:400; color:var(--sc, var(--acc)); border:2.5px solid var(--sc, var(--acc)); border-radius:6px; padding:3px 12px 1px; font-size:22px; line-height:1.25; transform:rotate(-3deg); white-space:nowrap; }
.stamp.ok{ --sc:var(--good); }
.stamp.no{ --sc:var(--bad); }
.stamp.slam{ animation:lockin .35s ease-out both; }
@keyframes lockin{ from{ transform:scale(1.25) rotate(-3deg); opacity:0; } to{ transform:scale(1) rotate(-3deg); opacity:1; } }
.mtag{ display:inline-flex; align-items:center; gap:6px; font-weight:700; }

/* ── panels (al, series) ── */
.panel{ background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.panel h2{ font-family:var(--display); font-weight:400; font-size:24px; margin:0 0 6px; }
.panel.done{ border-color:var(--good); }
.panel.locked{ opacity:.5; }
.kv{ display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; margin:8px 0 0; }
.kv dt{ color:var(--ink2); }
.kv dd{ margin:0; font-weight:600; }
.cmp{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:10px 0; }
.cmp div{ background:var(--sheet2); border-radius:8px; padding:10px 12px; }
.cmp b{ display:block; font-family:var(--num); font-size:28px; font-weight:400; }
.cmp span{ color:var(--ink2); font-size:14px; }
.combos{ grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr)); }

function upgrade(d){
  if(!d || d.v !== 1 || !d.team || !d.pv || !d.look || !d.judge) return null;
  if(isVirtualRec(d) !== VIRTUAL) return null;   /* 다른 앱의 기록은 받지 않음 */
  const f = fresh();
  for(const k in f) if(d[k] === undefined) d[k] = f[k];
  for(const k in f.al) if(d.al[k] === undefined) d.al[k] = f.al[k];
  for(const k in f.ser) if(d.ser[k] === undefined) d.ser[k] = f.ser[k];
  for(const k in f.reply) if(d.reply[k] === undefined) d.reply[k] = f.reply[k];
  for(const k in f.ordx) if(d.ordx[k] === undefined) d.ordx[k] = f.ordx[k];
  PL.forEach(p => { const j = d.judge[p]; if(!j) return; if(j.hold === undefined) j.hold = false; if(!Array.isArray(j.cand)) j.cand = []; if(j.why === undefined) j.why = ''; });
  if(!Array.isArray(d.checks) || d.checks.length !== CHECKS.length) d.checks = CHECKS.map((_, i) => !!(d.checks || [])[i]);
  if(d.track && !STAGES2[d.track]) { /* 이 버전에 없는 2차 과정이면 1차까지만 보여 줌 */ }
  if(!d.app) d.app = APP;
  if(!d.tries || typeof d.tries !== 'object') d.tries = {};
  if(VIRTUAL && VX.upgrade) VX.upgrade(d);
  if(!stagesOf(d).includes(d.stage)) d.stage = 'report';
  if(d.track && STAGES2[d.track] && STAGES2[d.track].upgrade) STAGES2[d.track].upgrade(d);
  return d;
}
function listSlots(){
  const out = [];
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith(PREFIX)) continue;
      try{ const d = upgrade(JSON.parse(localStorage.getItem(k))); if(d) out.push(d); }catch(e){}
    }
  }catch(e){}
  return out.sort((a, b) => (b.updated || 0) - (a.updated || 0));
}
function loadSlot(id){ try{ return upgrade(JSON.parse(localStorage.getItem(PREFIX + id))); }catch(e){ return null; } }

(function migrateOld(){
  if(!VIRTUAL) return;
  try{
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith(OLD_PREFIX)) keys.push(k); }
    for(const k of keys){
      let d = null; try{ d = JSON.parse(localStorage.getItem(k)); }catch(e){}
      if(!isVirtualRec(d)) continue;

      if(t && t.v === 1){

function fmt(ms){
  if(ms == null || ms < 0) return '--:--';
  const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;

const clockOf = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function josa(w, a, b){
  const c = String(w || '').trim().slice(-1).charCodeAt(0);
  if(c >= 0xAC00 && c <= 0xD7A3) return w + ((c - 0xAC00) % 28 ? a : b);
  return w + a + '(' + b + ')';
}
/* 으로/로: 받침이 없거나 ㄹ 받침이면 '로' */
function ro(w){
  const c = String(w || '').trim().slice(-1).charCodeAt(0);
  if(c >= 0xAC00 && c <= 0xD7A3){ const j = (c - 0xAC00) % 28; return w + (j && j !== 8 ? '으로' : '로'); }
  return w + '(으)로';
}

function cleanV(s){
  let t = String(s ?? '').replace(',', '.').replace(/[^\d.]/g, '');
  const i = t.indexOf('.');
  if(i >= 0) t = t.slice(0, i + 1) + t.slice(i + 1).replace(/\./g, '');
  return t.slice(0, 5);
}
function vnum(s){
  const t = String(s ?? '').trim();
  if(!/\d/.test(t) || !/^\d*\.?\d*$/.test(t)) return null;
  const v = Number(t);
  return isFinite(v) ? v : null;
}
function vErr(s, max = 3, big){
  if(!String(s ?? '').trim()) return '';

function alIssues(){

/* ───────── 1차: 직렬 미션 ───────── */
const SOPTS = [[['A','B'],['C','D']], [['A','C'],['B','D']], [['A','D'],['B','C']]];
function serSum(i){
  const [p, q] = SOPTS[i], a = vAbs(p[0], p[1]), b = vAbs(q[0], q[1]);
  return a == null || b == null ? null : a + b;
}
function calcErr(i){
  const t = S.ser.calc[i];
  if(!String(t).trim()) return '';
  const e = vErr(t, 6); if(e) return e;
  const s = serSum(i);
  return s != null && Math.abs(vnum(t) - s) > 0.015 ? '기록표의 두 값을 다시 더해 봐요.' : '';
}
const calcDone = () => [0,1,2].every(i => vOk(S.ser.calc[i], 6) && !calcErr(i));
function serMsgs(){
  const s = S.ser, errors = [], notes = [];
  if(s.pick != null && calcDone()){
    const best = Math.max(...[0,1,2].map(serSum));
    if(serSum(s.pick) < best - 0.05) errors.push('계산한 값으로 보면 더 높은 전압이 나오는 조합이 있어요.');
  }
  if(s.pick != null && vOk(s.v, 6)){
    const v = vnum(s.v), e = serSum(s.pick), [p, q] = SOPTS[s.pick], a = vAbs(p[0], p[1]), b = vAbs(q[0], q[1]);
    if(Math.abs(v - e) > Math.max(0.3, e * 0.2)){
      if(Math.abs(v - Math.abs(a - b)) <= 0.2) notes.push(`측정값이 두 셀 전압의 차이(${r2f(Math.abs(a - b))} V)와 비슷해요. 한 셀이 거꾸로 이어졌을 수 있어요. 한 셀의 (+)극이 다른 셀의 (−)극과 이어졌는지 확인하고 다시 재요.`);
      else notes.push(`계산한 ${r2f(e)} V와 많이 달라요. 집게와 연결 도선, 거름종이가 젖어 있는지 확인하고 다시 재요.`);
    }
  }
  return { errors, notes };
}
function serIssues(){
  const s = S.ser, out = [];
  if(!calcDone()) out.push('세 조합의 예상 전압을 모두 바르게 계산하세요.');
  if(s.pick == null) out.push('만들 조합을 고르세요.');
  if(!vOk(s.v, 6)) out.push('직렬로 이은 전체 전압을 기록하세요.');

  if(serMsgs().errors.length) out.push('조합 선택을 다시 확인하세요.');

}

/* 전압 사다리: 아래로 갈수록 (−)극이 되기 쉬움 */

  const T = 46, B = 330, y = v => B - v / max * (B - T);

}

    ${PL.map(p => { const L = S.look[p], j = S.judge[p], r = S.order.indexOf(p), held = j.ok && j.hold, id = idOf(p);
      const basis = held ? j.why.trim() : chipsOf(p).filter(c => j.chips.includes(c.id)).map(c => c.label).join(', ');
      const key = keyFor(p);
      return `<tr><th scope="row" class="c">${p}</th><td>${L.color ? sw(COLOR[L.color].sw) + ' ' + COLOR[L.color].label : '-'}</td><td>${L.mag == null ? '-' : L.mag ? '붙음' : '붙지 않음'}</td>
        <td>${orderOk() ? `${r + 1}번째` : ordNA() ? '확정 불가' : '-'}</td><td><b>${id ? mname(id) : held ? '판단 보류' : '미확정'}</b>${held ? `<br><span class="who">후보: ${esc(candText(p))}</span>` : ''}</td>
        ${kc ? (key ? (held ? `<td class="kc">${mname(key)} (보류)</td>` : `<td class="kc ${id === key ? 'yes' : 'no'}">${mname(key)} ${id === key ? '✓' : '✗'}</td>`) : '<td>-</td>') : ''}
        <td class="wrap">${esc(basis) || '-'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function tablePairs(){

}

}

/* ═════════ 2차 시험 공통 틀 ═════════
   과정(통합과학, 화학)마다 사건, 측정 조건, 그래프 문항, 모형 문항, 결론 칸만 다르게 정의하고
   화면과 검사 흐름은 여기서 함께 씀 */
const STAGES2_LIST = ['case2','roles2','prep2','m2','g2','model','reply2','final'];
const SHORT2 = { case2:'의뢰', roles2:'역할 교대', prep2:'준비', m2:'측정', g2:'그래프' };
const TREND = { up:'커진다', down:'작아진다', flat:'거의 그대로다', none:'일정한 경향이 없다' };
/* 모형 문항: 정답이 고정된 문항(ok)과, 그 조의 그래프 판단에 따라 답이 정해지는 문항(okOf)을 함께 다룸 */
const isOkAns = (q, k) => q.okOf ? q.okOf() === k : !!(q.opts.find(o => o.k === k) || {}).ok;
const okOpt = q => q.opts.find(o => isOkAns(q, o.k)) || q.opts[0];
const qWhy = q => typeof q.why === 'function' ? q.why() : q.why;
const trendFb = id => { const t = R2().trend[id]; return t ? `그래프 단계에서 우리 조는 ‘${TREND[t]}’를 골랐어요. 그 판단과 맞는 답을 골라요.` : '그래프 단계의 판단을 먼저 확인해요.'; };
const R2 = () => S.r2;
const T2 = () => STAGES2[S.track].def;

function roleIssues2(){
  if(S.solo) return [];
  const out = [], used = new Set(), chief = S.roles.chief;
  for(const r of roleDefs()){
    if(r.id === 'chief') continue;
    const i = R2().roles[r.id];
    if(i == null || i === chief || !String(S.team.m[i]||'').trim()){ out.push(`${r.label} 담당을 정하세요.`); continue; }
    if(used.has(i)) out.push(`${nm(i)}에게 역할이 두 개 있어요.`);
    used.add(i);
  }
  return out;
}
function sameRoleNote(){
  const same = roleDefs().filter(r => r.id !== 'chief' && R2().roles[r.id] != null && R2().roles[r.id] === S.roles[r.id]);
  return same.length ? `${same.map(r => `${nm(S.roles[r.id])}(${r.label})`).join(', ')}: 1차와 같은 역할이에요. 되도록 다른 역할을 맡아 봐요.` : '';
}

/* ── 값 읽기 ── */
const fieldOf = f => T2().fields.find(x => x.f === f);
const cellOk = (c, f) => vOk(R2().data[c][f], fieldOf(f).max);
const condDone = c => T2().fields.every(x => !x.only || x.only.includes(c) ? (x.choice ? R2().data[c][x.f] != null : cellOk(c, x.f)) : true);
const dataDone = () => T2().conds.every(c => condDone(c.id));
const dv = (c, f) => cellOk(c, f) ? vnum(R2().data[c][f]) : null;
function fitEnds(xs, ys){
  const n = xs.length, mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0;
  for(let i = 0; i < n; i++){ sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
  const b = sxx ? sxy / sxx : 0, a = my - b * mx, lo = Math.min(...xs), hi = Math.max(...xs);
  return [a + b * lo, a + b * hi];
}
/* 기록한 값으로 보아 받아들일 수 있는 경향 (정답 표가 아니라 그 조의 데이터로 판단) */
function trendAllowed(ch){
  const conds = ch.conds.map(id => T2().conds.find(c => c.id === id));
  const ys = ch.conds.map(id => dv(id, ch.f));
  if(ys.some(v => v == null)) return null;
  const [f1, f2] = fitEnds(conds.map(c => c.x), ys), ok = new Set();
  /* 이웃한 두 점 사이의 '뚜렷한' 오르내림: 오르기도 하고 내리기도 하면 일정한 경향이 없다고 볼 수 있음 */
  const big = Math.max(...ys.map(Math.abs), 1e-9), span = Math.max(...ys) - Math.min(...ys);
  const step = ch.mode === 'abs' ? 0.02 : 0.1 * big, diffs = ys.slice(1).map((y, i) => y - ys[i]);
  const rises = diffs.some(d => d > step), falls = diffs.some(d => d < -step);
  if(ch.mode === 'abs'){
    const d = f2 - f1;
    if(d > 0.02) ok.add('up'); if(d < -0.02) ok.add('down');
    if(Math.abs(d) < 0.06 && span < 0.08) ok.add('flat');
  } else {
    const rel = (f2 - f1) / Math.max(Math.abs(f1), Math.abs(f2), 1e-9);
    if(rel >= 0.1) ok.add('up'); if(rel <= -0.1) ok.add('down');
    if(Math.abs(rel) < 0.25 && span / big < 0.25) ok.add('flat');
  }
  if(rises && falls) ok.add('none');
  if(!ok.size) ok.add('none');
  return ok;
}
function trendMsg(ch){
  const pick = R2().trend[ch.id], ok = trendAllowed(ch);
  if(!pick || !ok || ok.has(pick)) return '';
  const list = [...ok].map(k => `‘${TREND[k]}’`).join(' 또는 ');
  return `기록한 값을 이은 경향으로 보면 ${list} 쪽이에요. 그래프를 다시 봐요.`;
}
const trendsDone = () => T2().charts.every(ch => R2().trend[ch.id] && !trendMsg(ch)) && (!T2().extraDone || T2().extraDone());

/* ── 2차 일관성 검사 ── */
function runCheck2(){
  const cur = T2().conflicts(), now = Date.now(), r = R2();
  for(const f of r.flags){
    if(f.st !== 'open') continue;
    if(!cur.some(c => c.k === f.k && c.sig === f.sig)){
      f.st = 'fixed'; f.done = now;
      f.fix = (f.cs || []).map(c => { const a = JSON.stringify(f.snap[c]), b = JSON.stringify(r.data[c]); return a !== b ? `${T2().conds.find(x => x.id === c).label} 다시 측정` : ''; }).filter(Boolean).join(', ') || '기록 수정';
    }
  }
  for(const c of cur){
    if(r.flags.some(f => f.k === c.k && f.sig === c.sig && (f.st === 'open' || f.st === 'kept'))) continue;
    r.flags.push({ id:newId(), k:c.k, sig:c.sig, cs:c.cs, ks:[], lead:c.lead, boxes:c.boxes, note:c.note || '',
      acts: c.cs.map(id => ({ label:`${T2().conds.find(x => x.id === id).label} 다시 측정`, target:'m2', focus:id })),
      snap: Object.fromEntries(c.cs.map(id => [id, { ...r.data[id] }])), st:'open', at:now, done:null, fix:'', why:'' });
  }
  save();
  return r.flags.filter(f => f.st === 'open');
}

/* ── 그림: 꺾은선 그래프 ── */
function niceStep(range){ const raw = range / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function chartSVG(ch){
  const conds = ch.conds.map(id => T2().conds.find(c => c.id === id));
  const ys = ch.conds.map(id => dv(id, ch.f));
  const have = ys.filter(v => v != null);
  const Wd = 420, Ht = 250, L = 56, R = 18, T = 30, B = 196;
  let lo = 0, hi;
  if(ch.zoom && have.length){ const mn = Math.min(...have), mx = Math.max(...have), c = (mn + mx) / 2, half = Math.max(0.15, (mx - mn) / 2 + 0.05); lo = c - half; hi = c + half; }
  else hi = Math.max(ch.minMax || 1, ...have.map(v => v * 1.15));
  const st = niceStep(hi - lo); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const xs = conds.map(c => c.x), xmin = Math.min(...xs), xmax = Math.max(...xs);
  const X = v => L + 26 + (v - xmin) / (xmax - xmin || 1) * (Wd - L - R - 46), Y = v => B - (v - lo) / (hi - lo) * (B - T);
  const dec = st < 0.1 ? 2 : st < 1 ? 1 : 0;
  let grid = '';
  for(let v = lo; v <= hi + st / 2; v += st) grid += `<line class="lad-grid" x1="${L}" x2="${Wd - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="lad-tick" x="${L - 8}" y="${(Y(v) + 5).toFixed(1)}" text-anchor="end" font-size="13">${v.toFixed(dec)}</text>`;
  const pts = conds.map((c, i) => ys[i] == null ? null : [X(c.x), Y(ys[i])]);
  const line = pts.filter(Boolean).map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 ${Wd} ${Ht}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(ch.title)} 그래프">
    <text class="svg-t2" x="${L}" y="16" font-size="13">${esc(ch.yl)}${ch.zoom ? ' (세로축 일부만 표시)' : ''}</text>
    ${grid}
    <line class="lad-axis" x1="${L}" x2="${L}" y1="${T - 6}" y2="${B}"/><line class="lad-axis" x1="${L}" x2="${Wd - R}" y1="${B}" y2="${B}"/>
    ${conds.map(c => `<text class="lad-tick" x="${X(c.x).toFixed(1)}" y="${B + 20}" text-anchor="middle" font-size="13">${esc(c.short)}</text>`).join('')}
    <text class="svg-t2" x="${(L + Wd - R) / 2}" y="${B + 44}" text-anchor="middle" font-size="13">${esc(ch.xl)}</text>
    ${line ? `<polyline points="${line}" style="fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round"/>` : ''}
    ${pts.map((p, i) => p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5.5" style="fill:var(--acc);stroke:var(--sheet);stroke-width:2"/><text x="${p[0].toFixed(1)}" y="${(p[1] - 11).toFixed(1)}" text-anchor="middle" font-size="13" style="fill:var(--ink);font-family:var(--num)">${ys[i].toFixed(ch.dp)}</text>` : '').join('')}
  </svg>`;
}
/* 모형 그림 속 움직이는 점: 움직임 줄이기 설정이면 멈춘 점으로 */
function mover(path, r, cls, dur, begin, label, fs = 10){
  if(reduceMotion){
    const m = path.match(/M\s*([\d.]+)[ ,]([\d.]+)/);
    return m ? `<g><circle class="${cls}" cx="${m[1]}" cy="${m[2]}" r="${r}"/>${label ? `<text x="${m[1]}" y="${Number(m[2]) + 4}" text-anchor="middle" font-size="${fs}" class="mv-t">${label}</text>` : ''}</g>` : '';
  }
  return `<g><circle class="${cls}" r="${r}"/>${label ? `<text text-anchor="middle" font-size="${fs}" class="mv-t" dy="4">${label}</text>` : ''}<animateMotion dur="${dur}s" begin="${begin ? -begin : 0}s" repeatCount="indefinite" path="${path}"/></g>`;
}

  const vG2 = () => `<section>
    <h1 class="st">그래프</h1>

  /* 화면: 모형 */
  const vModel = () => {
    const steps = T.model, cur = steps.find(q => !modelDone(q.id)), doneN = steps.filter(q => modelDone(q.id)).length;
    const doneList = steps.filter(q => modelDone(q.id)).map(q => `<li><b>${esc(q.q)}</b><span class="res fixed">${esc(okOpt(q).t)}</span>${qWhy(q) ? `<span class="res kept">${esc(qWhy(q))}</span>` : ''}</li>`).join('');
    const tries = cur ? (R2().model.tries[cur.id] || 0) : 0, last = cur && R2().model.ans[cur.id];
    const fb = cur && last && !isOkAns(cur, last) ? (typeof cur.fb === 'function' ? cur.fb(last) : cur.fb && cur.fb[last]) || '다시 생각해 봐요.' : '';
    return `<div class="work">
      <div class="rig"><div class="figbox">${T.modelSVG(doneN)}</div><p class="legend">맞힌 내용이 그림에 하나씩 나타나요.</p></div>
      <section>
        <h1 class="st">${esc(T.modelLabel)}</h1>
        <p class="instr">${T.modelInstr}</p>
        ${S.solo ? '' : `<p class="who">팀이 함께 토의하고 <b>셀 개발 책임자 ${esc(josa(who('chief', 2), '이', '가'))}</b> 답을 골라요.</p>`}
        ${cur ? `<div class="panel" id="mq">
          <h2>${doneN + 1} / ${steps.length}</h2>
          <p style="margin:0 0 10px;font-size:18px;font-weight:600">${esc(cur.q)}</p>

        </div>` : `<div class="panel done"><h2>모형 완성</h2><p style="margin:0">${esc(T.modelDoneMsg)}</p></div>`}
        ${doneList ? `<h2 class="sec">확인한 내용</h2><ul class="history">${doneList}</ul>` : ''}
        <div class="actions"><span class="progress">${doneN}/${steps.length}</span><button type="button" class="primary" data-act="next" ${cur ? 'disabled' : ''}>${esc(T.replyLabel)}으로</button></div>
      </section>

  };
  /* 화면: 결론 */
  const issues2 = () => {
    const out = [];
    if(!dataDone()) out.push('2차 측정 기록이 다 차지 않았어요.');
    if(!trendsDone()) out.push('그래프 경향을 다시 확인해요.');
    if(!T.model.every(q => modelDone(q.id))) out.push('모형을 끝까지 완성해요.');
    for(const t of T.texts){ const n = R2().texts[t.id].trim().length; if(n < t.min) out.push(`${t.label}을(를) ${t.min}자 이상 써요. 지금 ${n}자예요.`); }
    return out;
  };
  mod.issues2 = issues2;
  const vReply2 = () => {
    const iss = issues2();
    return `<section class="narrow">
      <h1 class="st">${esc(T.replyLabel)}</h1>
      <p class="instr">${T.replyInstr}</p>
      ${T.replyFacts()}
      ${T.texts.map(t => `<h2 class="sec"><label for="t2-${t.id}">${esc(t.label)}</label></h2><p class="who">${esc(t.hint)}</p>
        <textarea id="t2-${t.id}" data-in="t2" data-id="${t.id}" placeholder="${esc(t.ph)}">${esc(R2().texts[t.id])}</textarea><div class="count" id="t2c-${t.id}">${R2().texts[t.id].trim().length}자</div>`).join('')}
      <div class="actions"><ul class="missing" id="missing2">${iss.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <button type="button" class="primary" id="sign2" data-act="sign2" ${iss.length ? 'disabled' : ''}>${S.solo ? '시험자' : '셀 개발 책임자'} ${esc(who('chief', 2))} 서명</button></div>
    </section>`;
  };
  /* 성적서 본문 */
  mod.reportBody = () => {
    const r = R2(), roleRows = S.solo ? `<div><dt>시험자</dt><dd>${esc(teamLabel(S))}</dd></div>` : roleDefs().map(x => `<div><dt>${x.label}</dt><dd>${esc(who(x.id, 2))}</dd></div>`).join('');
    const tries = T.model.reduce((a, q) => a + (r.model.tries[q.id] || 0), 0);
    return `<dl class="meta-grid">
        <div><dt>의뢰</dt><dd>${esc(T.title)}</dd></div>
        <div><dt>시험 시간</dt><dd>${timeRange(r.startAt, r.endAt)}</dd></div>
        ${roleRows}
      </dl>
      <h2 class="sec">측정 기록</h2>${T.dataTable()}
      <h2 class="sec">그래프와 경향</h2>
      <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))">${T.charts.map(ch => `<div class="figbox">${chartSVG(ch)}<p class="who" style="margin:4px 8px">${esc(ch.q)} → <b>${esc(TREND[r.trend[ch.id]] || '-')}</b></p></div>`).join('')}</div>
      ${T.extraReport ? T.extraReport() : ''}
      <h2 class="sec">${esc(T.modelLabel)}</h2>
      <p class="who">${T.model.filter(q => modelDone(q.id)).length}/${T.model.length}단계 완성${ui.view === 'teacher' ? `, 다시 고른 횟수 ${tries}번` : ''}</p>
      <h2 class="sec">${esc(T.replyLabel)}</h2>
      <dl class="reply-sum">${T.texts.map(t => `<dt>${esc(t.label)}</dt><dd>${esc(r.texts[t.id]) || '-'}</dd>`).join('')}</dl>

  };
  const histBlock2 = () => {
    const items = R2().flags.filter(f => f.st !== 'open').slice().sort((a, b) => a.at - b.at);
    if(!items.length) return `<p class="who">기록끼리 어긋난 곳이 없어서 재확인 요청이 없었어요.</p>`;
    return `<ul class="history">${items.map(f => `<li><span class="t">${R2().startAt ? fmt(f.at - R2().startAt) : ''}</span>${esc(f.lead)}<span class="res ${f.st}">${f.st === 'fixed' ? '다시 측정해 수정: ' + esc(f.fix) : '다시 확인한 뒤 기록 유지: ' + esc(f.why)}</span></li>`).join('')}</ul>`;
  };

    const signed = R2().signed;

      <div class="rep-head"><h1 class="st">종합 셀 시험 성적서</h1>${signed ? `<div class="seal"><span class="stamp ok">시험 완료</span><span class="sig">${S.solo ? '시험자' : '셀 개발 책임자'} ${esc(who('chief', 2))}</span></div>` : ''}</div>

      </div>

  mod.act = (a, el) => {
    const r = R2();
    switch(a){
      case 'role2': {
        const i = Number(el.dataset.i), rid = el.dataset.role;

      }
      case 'chk2': { const i = Number(el.dataset.i); r.checks[i] = !r.checks[i]; save(); render(); break; }
      case 'start2':
        if(!T.checks.every((_, i) => r.checks[i])) break;
        if(!r.startAt) r.startAt = Date.now();
        go(S.furthest > sIdx('m2') ? stagesOf(S)[S.furthest] : 'm2'); break;
      case 'd2c': r.data[el.dataset.c][el.dataset.f] = el.dataset.v; ui.live2 = { c:el.dataset.c, f:el.dataset.f }; mod.unsign(); save(); render(); break;
      case 'trend': { r.trend[el.dataset.id] = el.dataset.v; const ch = T.charts.find(c => c.id === el.dataset.id); if(ch && trendMsg(ch)) tryAgain('trend'); mod.unsign(); save(); render(); break; }

        mod.unsign(); save(); render();
        if(good){ const mq = document.getElementById('mq'); if(mq) mq.scrollIntoView({ block:'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }); }
        break;
      }
      case 'sign2':
        if(issues2().length) break;
        r.signed = true; r.endAt = Date.now(); save(); go('final'); break;
      default: if(T.act) T.act(a, el);
    }
  };
  mod.input = (k, el) => {
    const r = R2();
    if(k === 'd2'){
      const c = cleanV(el.value); if(c !== el.value) el.value = c;

      }
      default: if(T.refresh) T.refresh();
    }
  };
  mod.csvHead = T.csvHead;
  mod.csvRow = active => active ? T.csvRow() : T.csvHead.map(() => '');
  return mod;
}

STAGES2.chem = makeTrack(CHEM);

/* ═════════ 가상 실험대 (배터리 가상 시험동 빌드에만 들어감) ═════════
   학생이 화면 속 실험대에서 거름종이를 깔고, 전극판을 올리고, 집게를 물리고, 다이얼을 돌린다.
   앱은 값을 대신 기록해 주지 않는다. 학생이 멀티미터 액정을 보고 기록표에 옮겨 적는다.
   사포질 생략, 거름종이 재사용, 마른 거름종이, 다이얼 위치 같은 조작 실수는 값에 그대로 드러나고,
   조작 기록으로 남아 교사 화면에 모인다. */

/* 소금물 거름종이 전지에서 금속마다의 상대 높이(V). 교실에서 흔히 재는 값에 맞춘 단순 모형이며 표준 전극 전위가 아님 */
const VPHI = { Mg:0.00, Al:0.35, Zn:0.75, Fe:1.10, Cu:1.60 };
const VFILL = { Mg:'#DCDFE2', Zn:'#B7BFC6', Fe:'#7F868C', Cu:'#C46C3D', Al:'#D4D9DD' };
const VDIAL = [['off','끔'], ['v2','직류 2 V'], ['v20','직류 20 V'], ['ma','직류 200 mA']];
const VSLIP = { nosand:'사포질하지 않은 판으로 측정', reuse:'앞 짝에 쓴 거름종이를 다시 씀', dry:'마른 거름종이로 측정', mamode:'전류(mA) 자리에서 전압 측정' };
const VTIP = {
  nosand: p => `${p}판을 사포질하지 않고 쟀어요. 표면이 변한 판은 값이 달라질 수 있어요.`,
  reuse: () => '앞 짝에 쓴 거름종이예요. 짝을 바꿀 때마다 새 거름종이를 깔아요.',
  dry: () => '거름종이가 말라 있어서 전류가 흐르지 않아요. 소금물을 적셔요.',
  mamode: () => '직류 전류(mA) 자리에서는 전압을 잴 수 없고 셀이 단락돼요. 다이얼을 직류 전압으로 돌려요.',
  over: () => '액정 왼쪽의 1은 범위를 넘었다는 뜻이에요. 다이얼을 20 V로 올려요.'
};
const MEL_MIN = 1.8;   /* 멜로디 소자가 울리는 최소 전압 */
const VB = { sig:'', from:0, disp:0, since:0, tau:1.1, done:'', timer:null, tipped:{}, mag:null, magAt:0, ringAt:0, rang:false, guide:'' };

/* 조마다 같은 결과가 나오도록 씨앗값으로 만드는 난수 */
function vrng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function vhash(...xs){ let h = 2166136261; for(const ch of xs.join('|')) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; }

VX.fresh = () => {
  const seed = (Math.random() * 4294967296) >>> 0, r = vrng(seed);
  const ms = MK.slice();
  for(let i = ms.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [ms[i], ms[j]] = [ms[j], ms[i]]; }
  const key = Object.fromEntries(PL.map((p, i) => [p, ms[i]]));
  const phi = {};
  for(const m in VPHI) phi[m] = m === 'Mg' ? 0 : +(VPHI[m] + (r() - 0.5) * 0.08).toFixed(3);
  /* 반응성이 큰 판 하나는 표면이 많이 변해 있음: 사포질하지 않으면 값이 눈에 띄게 달라짐 */
  const act = PL.filter(p => key[p] !== 'Cu'), odd = act[Math.floor(r() * act.length)];
  const ox = Object.fromEntries(PL.map(p => [p, key[p] === 'Cu' ? 0 : +(p === odd ? 0.15 + r() * 0.07 : 0.02 + r() * 0.03).toFixed(3)]));
  return { seed, key, phi, odd, ox, sand:{}, bench:vBenchBlank(), papers:0, flip:[false, false], seen:{}, seenSer:null, log:[], slips:{} };
};
function vBenchBlank(){ return { paper:0, wet:false, used:'', slots:[null, null], red:null, black:null, dial:'off' }; }
VX.upgrade = d => {
  const v = d.vlab; if(!v) return;
  if(!v.bench) v.bench = vBenchBlank();
  for(const k of ['sand', 'seen', 'slips']) if(!v[k]) v[k] = {};
  if(!Array.isArray(v.log)) v.log = [];
  if(!Array.isArray(v.flip)) v.flip = [false, false];
};

/* ── 물리 모형 ── */
const V = () => S.vlab;
const metalOf = p => p === 'E' ? 'Al' : V().key[p];
function oxNow(p, t){
  const v = V(), s = v.sand[p];
  if(p === 'E'){   /* 알루미늄: 처음엔 산화막이 두껍고, 사포질하면 얇아졌다가 시간이 지나면 다시 두꺼워짐 */
    const base = 0.75;
    if(!s) return base;
    return 0.05 + (base - 0.05) * (1 - Math.exp(-(t - s) / 1000 / 40));
  }
  return s ? 0 : v.ox[p];
}
const ephi = (p, t) => V().phi[metalOf(p)] + oxNow(p, t);
const vPlates = () => S.stage === 'al' ? PL.concat('E') : PL;
/* 지금 실험대에서 멀티미터가 가리킬 값: 빨간 집게 쪽 − 검은 집게 쪽 */
function vTarget(t){
  const v = V(), b = v.bench;
  if(b.dial === 'off') return { off:true };
  if(S.stage === 'series') return vSerTarget(t);
  const on = b.red && b.black && b.red !== b.black && b.slots.includes(b.red) && b.slots.includes(b.black);
  if(!on) return { v:0, open:true };
  if(!b.paper || !b.wet) return { v:0, open:true, dry:true };
  const pk = [b.red, b.black].sort().join('');
  let x = ephi(b.red, t) - ephi(b.black, t);
  const cont = !!(b.used && b.used !== pk);
  if(cont){ const h = vhash(v.seed, b.paper, pk); x += (h < 0.5 ? -1 : 1) * (0.05 + (h % 0.5) * 0.14); }
  x += (vhash(v.seed, b.paper, pk, 'c') - 0.5) * 0.02;
  return { v:x, pk, cont, tau: cont ? 1.2 : 0.65 };
}
function vCells(){
  const s = S.ser; if(s.pick == null) return null;
  return SOPTS[s.pick].map((c, i) => V().flip[i] ? [c[1], c[0]] : [c[0], c[1]]);   /* [왼쪽 판, 오른쪽 판] */
}
function vSerTarget(t){
  const cells = vCells();
  if(!cells) return { v:0, open:true };
  const x = cells.reduce((a, [L, R]) => a + (ephi(R, t) - ephi(L, t)), 0) + (vhash(V().seed, S.ser.pick, V().flip.join()) - 0.5) * 0.02;
  return { v:x, tau:0.65, ser:true };
}
function vFmt(x){
  const d = V().bench.dial;
  if(d === 'v20') return { t:(x < -0.004 ? '-' : '') + Math.abs(x).toFixed(2), u:'DC V' };
  if(d === 'v2'){
    if(Math.abs(x) >= 1.9995) return { t:'', o:(x < 0 ? '-' : '') + '1', u:'DC V', over:true };
    return { t:(x < -0.0004 ? '-' : '') + Math.abs(x).toFixed(3), u:'DC V' };
  }
  if(d === 'ma'){ const i = x / 0.09; return { t:(i < -0.04 ? '-' : '') + Math.abs(i).toFixed(1), u:'DC mA' }; }   /* 내부 저항 약 90 Ω */
  return { t:'', u:'' };
}
function vSig(){
  const v = V(), b = v.bench;
  return [S.stage, b.paper, b.wet, b.slots.join(','), b.red, b.black, b.dial, JSON.stringify(v.sand), S.ser.pick, v.flip.join()].join('|');
}
/* 시간 상수의 6.5배가 지나면 표시가 둘째 자리까지 멈춘 것으로 봄 (새 거름종이 약 4초, 쓴 거름종이 약 8초) */
const SETTLE = 6.5;
const vSettledNow = () => (Date.now() - VB.since) / 1000 > VB.tau * SETTLE;

/* ── 기록 ── */
const VLOG_MAX = 600;
function vLog(a, d){
  const v = V(); if(!v) return;
  v.log.push({ t:Date.now(), s:S.stage, a, d });
  if(v.log.length > VLOG_MAX) v.log.splice(0, v.log.length - VLOG_MAX);
}
function vTip(k, ...args){
  if(S.exam || VB.tipped[k + args.join('')]) return;
  VB.tipped[k + args.join('')] = true;
  showToast(VTIP[k](...args));
}
function vSlip(k, p){
  const v = V();
  v.slips[k] = (v.slips[k] || 0) + 1;
  vLog('slip', p ? `${VSLIP[k]} (${p}판)` : VSLIP[k]);
  vTip(k, p || '');
}

/* ── 액정과 안내를 0.12초마다 갱신 ── */
function vTick(){
  if(!S || !S.vlab || ui.view !== 'game' || !['pairs', 'al', 'series'].includes(S.stage)) return;
  const t = Date.now(), tg = vTarget(t), sig = vSig();
  if(sig !== VB.sig){ VB.sig = sig; VB.from = VB.disp; VB.since = t; VB.tau = tg.tau || 0.65; }
  const lcd = document.getElementById('vlcd'), ovl = document.getElementById('vlcdo'), un = document.getElementById('vlcdu');
  if(tg.off){ VB.disp = 0; if(lcd) lcd.textContent = ''; if(ovl) ovl.textContent = ''; if(un) un.textContent = ''; vGuideTick(); return; }
  const dt = (t - VB.since) / 1000, jit = (Math.random() - 0.5) * (tg.open ? 0.024 : 0.003);
  VB.disp = tg.v + (VB.from - tg.v) * Math.exp(-dt / VB.tau) + jit;
  const f = vFmt(VB.disp);
  if(lcd) lcd.textContent = f.t; if(ovl) ovl.textContent = f.o || ''; if(un) un.textContent = f.u;
  if(f.over) vTip('over');
  if(dt > VB.tau * SETTLE) vSettled(tg, f);
  vGuideTick();
}
function vSettled(tg, f){
  if(VB.done === VB.sig) return;
  VB.done = VB.sig;
  const v = V(), b = v.bench;
  if(tg.open){
    if(tg.dry && b.red && b.black && b.dial !== 'off'){ vSlip('dry'); save(); }
    return;
  }
  vLog('read', `액정 ${f.o || f.t} ${f.u}` + (tg.ser ? ` (직렬 ${vCells().map(c => c.join('–')).join(' + ')})` : ` (빨간 ${b.red} · 검은 ${b.black})`));
  if(b.dial === 'ma'){ vSlip('mamode'); save(); return; }
  if(tg.ser){ v.seenSer = { pick:S.ser.pick, flip:v.flip.slice(), v:+tg.v.toFixed(3), at:Date.now() }; save(); return; }
  if(!b.used) b.used = tg.pk;
  if(tg.cont) vSlip('reuse');
  for(const p of [b.red, b.black]) if(p !== 'E' && !v.sand[p] && v.key[p] !== 'Cu') vSlip('nosand', p);
  v.seen[tg.pk] = { red:b.red, black:b.black, v:+tg.v.toFixed(3), at:Date.now() };
  save();
}
function vGuideTick(){
  const g = document.getElementById('vguide-t');
  if(!g) return;
  const t = vGuide();
  if(t !== VB.guide){ VB.guide = t; g.textContent = t; }
}
VX.after = () => {
  const on = S && ui.view === 'game' && ['pairs', 'al', 'series'].includes(S.stage);
  if(on && !VB.timer) VB.timer = setInterval(vTick, 120);
  if(!on && VB.timer){ clearInterval(VB.timer); VB.timer = null; }
  if(on) vTick();
};

/* ── 연습 모드 안내: 지금 실험대 상태를 보고 다음에 할 일 하나 ── */
const vRoleTxt = r => r === 'insp' ? `전기화학 분석원 ${inspNames(1)}` : `${roleLabel(r)} ${who(r, 1)}`;
const vRole = r => S.solo ? '' : ` (${vRoleTxt(r)})`;
function vPairSteps(x, y, done){
  const b = V().bench, pk = [x, y].sort().join('');
  if(!b.paper || (b.used && b.used !== pk)) return `${x}–${y} 짝을 잴 새 거름종이를 깔아요${vRole('keep')}.`;
  if(!b.wet) return `거름종이에 소금물을 적셔요${vRole('keep')}.`;
  const others = b.slots.filter(p => p && p !== x && p !== y);
  if(others.length) return `${others.map(p => p + '판').join(', ')}을 내리고 ${x}판과 ${y}판을 올려요${vRole('insp')}.`;
  if(!b.slots.includes(x) || !b.slots.includes(y)) return `${x}판과 ${y}판을 거름종이 위에 올려요${vRole('insp')}.`;
  if(b.red !== x) return `빨간 집게를 ${x}판에 물려요${vRole('insp')}.`;
  if(b.black !== y) return `검은 집게를 ${y}판에 물려요${vRole('insp')}.`;
  if(b.dial !== 'v2' && b.dial !== 'v20') return `다이얼을 직류 전압(2 V 또는 20 V)으로 돌려요${vRole('insp')}.`;
  if(!vSettledNow()) return '액정 숫자가 멈출 때까지 기다려요.';
  return done;
}
function vGuide(){
  const v = V(), b = v.bench, st = S.stage;
  if(st === 'look'){
    const n = PL.filter(lookDone).length;
    return n < 4 ? `판마다 자석을 대 보고, 색과 함께 카드에 기록해요${vRole('insp')}.` : '네 판을 모두 기록했어요. 전압을 재러 가요.';
  }
  if(st === 'pairs'){
    const uns = PL.filter(p => !v.sand[p]);
    if(uns.length) return `먼저 전극판 ${uns.map(p => p + '판').join(', ')}을 사포로 문질러요${vRole('keep')}.`;
    const nk = PK.find(k => !pairDone(k));
    if(!nk) return '여섯 짝을 모두 기록했어요. 기록을 확인하고 전압 사다리로 가요.';
    return vPairSteps(nk[0], nk[1], `${pairName(nk)} 카드에 숫자, − 표시, (−)극을 적어요${vRole('rec')}.`);
  }
  if(st === 'al'){
    const a = S.al, cu = alCu();
    if(!a.pred) return '재기 전에 먼저 예상을 골라요.';

function w2Fresh(track){
  const v = V(), now = Date.now();

  }

    cu:1, br:{ on:false, n:0, used:null }, sand:{ Zn:false, Cu:false }, sandN:0, red:null, black:null, dial:'off', t0:now, seen:{}, once:{} };
}
function B2(){

const sig2 = b => b.track === 'int'
  ? [b.dipped, b.depth, b.conc, b.red, b.black, b.dial, b.jack, b.sandN].join('|')
  : [b.cu, b.br.on, b.br.n, b.sand.Zn, b.sand.Cu, b.red, b.black, b.dial].join('|');
const keyInt = (d, c) => `${d}|${c}`;
const keyChem = (on, cu) => `${on ? 1 : 0}|${cu}`;

/* ── 물리 모형: 통합과학 ── */
const INT_G = c => c === 0 ? 0.015 : (c / (c + 1.2)) / (5 / 6.2);   /* 농도에 따른 전류 배율 (5 %를 1로) */
function intVoc(b){
  const dv0 = b.conc === 0 ? -0.25 : 0.05 * Math.log10(b.conc / 5);
  return b.v5 + dv0 + 0.01 * (b.depth - 3) - 0.07 * Math.min(1, b.tsh / 60) - 0.02 * Math.min(1, b.timm / 300);
}
const intIss = b => b.k * (b.depth + 0.3) * INT_G(b.conc) / (1 + b.tsh / 45 + b.timm / 400);   /* mA */
/* 지금 액정이 가리킬 값. V 범위는 V, 전류 범위는 mA. 빨간 집게가 구리판이면 +, 마그네슘판이면 − */
function intRead(b, now){
  if(b.dial === 'off') return { off:true };
  const on = b.dipped && b.red && b.black && b.red !== b.black;
  const vmode = b.dial === 'v2' || b.dial === 'v20';
  if(!on) return { x:0, open:true, vmode };
  const sign = b.red === 'Cu' ? 1 : -1;
  if(vmode){
    if(b.jack !== 'v') return { x:sign * 0.004 * intIss(b) / 18, short:true, kind:'vjack', vmode };
    const sv = Math.max(0, (now - b.tdip) / 1000);
    return { x:sign * (intVoc(b) - 0.15 * Math.exp(-sv / 2.5)), kind:'v', vmode };
  }
  const okJack = b.dial === b.jack;
  if(!okJack) return { x:0, open:true, kind:'ijack' };
  const si = Math.max(0, (now - b.t0) / 1000);
  return { x:sign * intIss(b) * (1 + 0.6 * Math.exp(-si / 5)), short:true, kind:b.dial === 'a10' ? 'a10' : 'i' };
}
/* ── 물리 모형: 화학 ── */
function chemE(b){

  if(b.br.used != null && b.br.used !== b.cu){ const h = vhash(V().seed, b.br.n, b.cu); e += (h < 0.5 ? -1 : 1) * (0.01 + (h % 0.5) * 0.04); }
  return e;
}
function chemRead(b){
  if(b.dial === 'off') return { off:true };
  const on = b.red && b.black && b.red !== b.black, vmode = b.dial !== 'ma';
  if(!on) return { x:0, open:true, vmode };
  const sign = b.red === 'Cu' ? 1 : -1, cont = b.br.on && b.br.used != null && b.br.used !== b.cu;
  if(!b.br.on) return { x:0, open:true, nob:true, vmode, tau:0.8 };
  if(!vmode) return { x:sign * chemE(b) / 0.3, kind:'ma', tau:0.8 };

function fmt2(x, dial){

    return { t:(x < -0.0004 ? '-' : '') + Math.abs(x).toFixed(3), u:'DC V' };

  if(dial === 'ma'){
    if(Math.abs(x) >= 199.95) return { t:'', o:(x < 0 ? '-' : '') + '1', u:'DC mA', over:true };
    return { t:(x < -0.04 ? '-' : '') + Math.abs(x).toFixed(1), u:'DC mA' };
  }
  if(dial === 'a10'){ const a = x / 1000; return { t:(a < -0.004 ? '-' : '') + Math.abs(a).toFixed(2), u:'DC A' }; }

function vTick2(){

  const show = f => { if(lcd) lcd.textContent = f.t; if(ovl) ovl.textContent = f.o || ''; if(un) un.textContent = f.u; };
  if(b.track === 'int'){
    if(b.dipped) b.timm += dt;

    if(rd.short) b.tsh += dt;

const act1 = VX.act;
VX.act = (a, el) => {
  if(!a.startsWith('v2')) return act1(a, el);
  if(!S || !S.vlab || !S.track) return true;
  const b = B2(), val = el.dataset.v;
  switch(a){
    case 'v2conc': {
      const c = Number(val);
      if(b.dipped){ showToast('극판을 꺼낸 뒤 비커를 바꿔요.'); return true; }
      if(b.conc !== c){ b.conc = c; vLog('beaker', `소금물 ${c} % 비커로 바꿈`); touch2(b, { dip:true }); }
      return true;
    }
    case 'v2depth': {
      const d = Number(val);
      if(b.depth !== d){ b.depth = d; vLog('depth', `잠긴 깊이 ${d} cm${b.dipped ? ' (담근 채 옮김)' : ''}`); touch2(b, { dip:true }); }
      return true;
    }
    case 'v2dip': {
      const on = val === '1';
      if(b.dipped !== on){ b.dipped = on; vLog('dip', on ? `극판을 담금 (소금물 ${b.conc} %, 깊이 ${b.depth} cm)` : '극판을 꺼냄'); touch2(b, { dip:true }); }
      return true;
    }
    case 'v2sand':
      if(b.dipped) return true;
      b.tsh = 0; b.timm = 0; b.sandN++; b.cond0 = null;
      vLog('sand', '두 극판을 사포로 문지르고 물로 씻음'); touch2(b, { dip:true }); return true;
    case 'v2clip': {
      const c = el.dataset.c;
      b[c] = b[c] === val ? null : val;
      vLog('clip', `${c === 'red' ? '빨간' : '검은'} 집게 ${b[c] ? '→ ' + PNAME2[b[c]] : '뗌'}`); touch2(b); return true;
    }
    case 'v2dial':
      if(b.dial !== val){ b.dial = val; vLog('dial', `다이얼 ${((b.track === 'int' ? DIAL2 : VDIAL).find(x => x[0] === val) || [])[1]}`); touch2(b); }
      return true;
    case 'v2jack':
      if(b.jack !== val){ b.jack = val; vLog('jack', `빨간 리드를 ${(JACK2.find(x => x[0] === val) || [])[1]} 단자로 옮김`); touch2(b); }
      return true;
    case 'v2cu': {
      const c = Number(val);
      if(b.cu !== c){ b.cu = c; const was = b.br.on; b.br.on = false; vLog('beaker', `황산 구리 ${fmtM(c)} M 수용액으로 바꿈${was ? ' (염다리를 뺌)' : ''}`); touch2(b); }
      return true;
    }
    case 'v2br':
      if(val === 'new'){ b.br = { on:true, n:b.br.n + 1, used:null }; vLog('bridge', `새 염다리를 걺 (${b.br.n}번째)`); }
      else if(val === 'old'){ if(!b.br.n || b.br.on) return true; b.br.on = true; vLog('bridge', '쓰던 염다리를 다시 걺'); }
      else { if(!b.br.on) return true; b.br.on = false; vLog('bridge', '염다리를 뺌'); }
      touch2(b); return true;
    case 'v2csand':
      b.sand[val] = true; b.sandN++; vLog('sand', `${PNAME2[val]} 사포질`); touch2(b); return true;
  }
  return true;
};

/* ── 교사 화면: 기록한 값과 실험대 10초 값(또는 멈춘 값) 견주기 ── */
const nearest = (arr, x) => !arr || !arr.length ? null : x == null ? arr[arr.length - 1] : arr.reduce((a, y) => Math.abs(y - x) < Math.abs(a - x) ? y : a, arr[0]);
function cmp2(){
  const b = S.vlab && S.vlab.b2;
  if(!b || !S.r2) return [];
  if(b.track === 'int') return INT.conds.map(c => {
    const s = b.seen[keyInt(c.depth, c.conc)] || {}, rv = dv(c.id, 'v'), ri = dv(c.id, 'i');
    const bv = nearest(s.v, rv), bi = nearest(s.i, ri), notes = [];
    if(bv == null && bi == null) notes.push('실험대에서 10초 값 없음');
    else {
      if(bv == null) notes.push('전압 10초 값 없음'); else if(rv != null && Math.abs(rv - bv) > 0.03) notes.push('전압 차이 큼');
      if(bi == null) notes.push('전류 10초 값 없음'); else if(ri != null && Math.abs(ri - bi) > Math.max(0.3, bi * 0.08)) notes.push('전류 차이 큼');
    }
    return { c, rv, bv, ri, bi, note:notes.join(', '), bad:notes.some(n => n.includes('차이')) };
  });
  return CHEM.conds.map(c => {
    const s = b.seen[keyChem(c.bridge, c.cu)] || {}, rv = dv(c.id, 'v'), bv = nearest((s.v || []).map(Math.abs), rv);
    const note = bv == null ? '실험대에서 잰 값 없음' : rv != null && Math.abs(rv - bv) > 0.02 ? '값 차이 큼' : '';
    return { c, rv, bv, note, bad:note === '값 차이 큼' };
  });
}

/* ───────── 제출 코드: 다른 가상 실험실과 같은 방식 ─────────
   학생은 제출 글(요약 + 분석 코드)을 복사해 웨일 클래스에 내고, 선생님은 교사 화면에 붙여 넣어 불러옴.
   기록이 길어서 브라우저가 지원하면 deflate로 줄이고(z), 아니면 그대로(r) 담음. 가벼운 가림 처리. */
const XK = 'vlab-battery-2026', SUBCODE = 'VBATT1:';
const b64u = u => { let s = ''; for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

const xorK = u => { for(let i = 0; i < u.length; i++) u[i] ^= XK.charCodeAt(i % XK.length); return u; };
async function flate(u, T){ return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer()); }
async function encodeTeam(d){
  let u = new TextEncoder().encode(JSON.stringify({ kind:FILE_KIND, v:1, data:d })), z = 'r';
  if(typeof CompressionStream === 'function'){ try{ u = await flate(u, CompressionStream); z = 'z'; }catch(e){} }
  return SUBCODE + z + b64u(xorK(u));
}
async function decodeTeam(code){
  const body = code.slice(SUBCODE.length), z = body[0];
  let u = xorK(unb64u(body.slice(1)));
  if(z === 'z') u = await flate(u, DecompressionStream); else if(z !== 'r') throw new Error('bad');
  return JSON.parse(new TextDecoder().decode(u));
}

/* ═════════ 서술 피드백 (교사 → 학생) ═════════
   교사가 조별 서술 답안에 자주 쓰는 지적사항을 눌러 붙이고, 모자란 말은 한 줄 더 씀.
   - 저장: 이 기기(TS.fb) + 수합이 켜져 있으면 db 'feedback/<기록 id>'
   - 학생: '보내기'를 한 피드백만 성적서 화면에 보임 (수합 연결 시 실시간, 같은 기기면 바로)
   - 출력: 조별 피드백지 인쇄, 또는 HTML 파일로 저장
   학생 이름은 피드백 문서에 넣지 않음 (기록 id와 반·조만) */
const FB_FIELDS = [
  { key:'cause', label:'불량 원인 추정', get:d => d.reply && d.reply.cause },
  { key:'plan', label:'재발 방지 대책', get:d => d.reply && d.reply.plan }
];
/* 2차 서술 칸은 과정 정의(STAGES2[track].def.texts)에서 가져옴 */
function fbFieldsOf(d){
  const out = FB_FIELDS.map(f => ({ key:f.key, label:f.label, text:(f.get(d) || '').trim() }));
  const tr = d && d.track, mod = tr && STAGES2[tr];
  if(mod && mod.def && d.r2 && d.r2.texts){
    for(const t of mod.def.texts) out.push({ key:`${tr}.${t.id}`, label:`[2차 ${TRACKS[tr]}] ${t.label}`, text:(d.r2.texts[t.id] || '').trim() });
  }
  return out;
}
const FB_ALL_KEYS = () => {
  const keys = FB_FIELDS.map(f => ({ key:f.key, label:f.label }));
  for(const tr in STAGES2){ const def = STAGES2[tr].def; if(def && def.texts) def.texts.forEach(t => keys.push({ key:`${tr}.${t.id}`, label:`[2차 ${TRACKS[tr]}] ${t.label}` })); }
  return keys;
};
/* 기본 지적사항 (교사 화면 '피드백 문구' 탭에서 고칠 수 있음) */
const FB_DEFAULT = {
  good:['측정값을 근거로 잘 들었어요.', '결과와 결론이 잘 이어져요.', '과학 용어를 정확히 썼어요.'],
  fix:['측정값(숫자) 근거가 없어요.', '근거와 결론이 이어지지 않아요.', '우리 조 기록과 맞지 않는 내용이 있어요.', '단위가 빠졌어요.', '과학 용어가 부정확해요.', '너무 일반적이에요. 이번 시험에 맞게 구체적으로 써 봐요.'],
  spec:{
    'cause':['어느 판이 바뀌었는지 특정하지 않았어요.', '‘불빛이 어둡다’와 전압을 연결하지 않았어요.'],
    'plan':['실제로 할 수 있는 검사 방법이 아니에요.', '이번에 쓴 방법(자석, 짝 전압)을 활용하지 않았어요.'],
    'int.concl':['전압과 전류를 구분하지 않았어요.', '예상과 다른 결과를 언급하지 않았어요.'],
    'int.design':['좋은 점만 쓰고 어려운 점이 없어요.'],
    'chem.bridge':['염다리를 걸기 전후 측정값을 비교하지 않았어요.'],
    'chem.conc':['측정 오차를 생각하지 않았어요.'],
    'chem.design':['좋은 점만 쓰고 어려운 점이 없어요.']
  }
};
function fbBank(){
  const b = TS.fbBank;
  if(!b) return FB_DEFAULT;
  return { good:b.good || FB_DEFAULT.good, fix:b.fix || FB_DEFAULT.fix, spec:Object.assign({}, FB_DEFAULT.spec, b.spec || {}) };
}
const fbc = { cloud:new Map(), sub:null, subErr:false, stu:null, stuId:null, stuSub:null, timers:{} };
const fbFresh = id => ({ v:1, id, items:{}, note:'', sent:false, sentAt:null, at:0 });
/* 이 기기 것과 수합된 것 중 최근 것 */
function fbGet(id){
  if(!TS.fb) TS.fb = {};
  const a = TS.fb[id], b = fbc.cloud.get(id);
  if(a && b) return (b.at || 0) > (a.at || 0) ? b : a;
  return a || b || null;
}
function fbEdit(id){
  const cur = fbGet(id);
  const d = cur ? JSON.parse(JSON.stringify(cur)) : fbFresh(id);
  if(!TS.fb) TS.fb = {};
  TS.fb[id] = d;
  return d;
}
const fbItem = (f, key) => f.items[key] || (f.items[key] = { good:[], fix:[], note:'' });
const fbHas = f => !!f && (!!(f.note || '').trim() || Object.values(f.items || {}).some(x => x.good.length || x.fix.length || (x.note || '').trim()));
function fbCommit(id, f, o = {}){
  f.at = Date.now(); TS.fb[id] = f; tSave();
  if(!cloud.db) return;
  clearTimeout(fbc.timers[id]);
  fbc.timers[id] = setTimeout(async () => {
    try{ await cloud.db.doc('feedback/' + id).set(JSON.parse(JSON.stringify(TS.fb[id]))); fbc.cloud.set(id, TS.fb[id]); if(o.toast) showToast(o.toast); }
    catch(e){ showToast('피드백을 수합 공간에 저장하지 못했어요. 이 기기에는 저장됐어요.'); }
  }, o.now ? 0 : 700);
}
/* 교사: 피드백 전체 구독 */
function fbSubTeacher(){
  if(!cloud.db || fbc.sub) return;
  try{
    fbc.sub = cloud.db.collection('feedback').onSnapshot(snap => {
      const m = new Map();
      for(const doc of snap.docs){ const b = doc.data(); if(b && b.id) m.set(b.id, b); }
      fbc.cloud = m; fbc.subErr = false;
      if(ui.view === 'teacher') softRender();
    }, () => { fbc.sub = null; fbc.subErr = true; });
  }catch(e){ fbc.subErr = true; }
}
/* 학생: 자기 기록의 피드백만 구독 */
function fbSubStudent(){
  const id = S && ui.view === 'game' ? S.id : null;
  if(!cloud.db || id === fbc.stuId) return;
  if(fbc.stuSub){ try{ fbc.stuSub(); }catch(e){} fbc.stuSub = null; }
  fbc.stuId = id; fbc.stu = null;
  if(!id) return;
  try{
    fbc.stuSub = cloud.db.doc('feedback/' + id).onSnapshot(snap => {
      const before = fbc.stu && fbc.stu.at;
      fbc.stu = snap.exists ? (snap.data() || null) : null;
      if((fbc.stu && fbc.stu.at) !== before && S && (S.stage === 'report' || S.stage === 'final')) softRender();
    }, () => {});
  }catch(e){}
}
/* 학생 화면에 보일 피드백: 수합으로 받은 것, 또는 같은 기기에서 교사가 보낸 것 */
function fbForStudent(id){
  const a = TS.fb && TS.fb[id], b = fbc.stuId === id ? fbc.stu : null;
  const f = a && b ? ((b.at || 0) > (a.at || 0) ? b : a) : (a || b);
  return f && f.sent ? f : null;
}

/* ── 공통 그리기: 피드백 내용 (학생 화면·피드백지) ── */
function fbBody(d, f, o = {}){
  const fields = fbFieldsOf(d).filter(x => { const it = f.items[x.key]; return it && (it.good.length || it.fix.length || (it.note || '').trim()); });
  const rows = fields.map(x => {

      ${it.good.length ? `<ul class="fb-l good">${it.good.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      ${it.fix.length ? `<ul class="fb-l fix">${it.fix.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      ${(it.note || '').trim() ? `<p class="fb-note">${esc(it.note.trim())}</p>` : ''}
    </div>`;
  }).join('');
  return `${rows}${(f.note || '').trim() ? `<div class="fb-q"><h3>선생님 한마디</h3><p class="fb-note">${esc(f.note.trim())}</p></div>` : ''}`;
}

/* ── 교사: 조 상세 화면 아래 피드백 작성 ── */
function fbEditor(){
  const id = S.id, f = fbGet(id) || fbFresh(id), bank = fbBank();
  const fields = fbFieldsOf(S);
  const chip = (key, kind, s) => {
    const it = f.items[key], on = !!it && it[kind].includes(s);
    return `<button type="button" class="fb-chip ${kind}" data-fb="pick" data-id="${esc(id)}" data-key="${esc(key)}" data-kind="${kind}" data-s="${esc(s)}" aria-pressed="${on}">${kind === 'good' ? '✓' : '!'} ${esc(s)}</button>`;
  };
  const block = x => {
    const it = f.items[x.key] || { good:[], fix:[], note:'' };
    const fixes = [...(bank.spec[x.key] || []), ...bank.fix];
    /* 목록에서 지운 문구라도 이미 붙인 것은 보이게 */
    const extraG = it.good.filter(s => !bank.good.includes(s)), extraF = it.fix.filter(s => !fixes.includes(s));
    return `<div class="fb-ed">
      <h3>${esc(x.label)}</h3>
      <p class="fb-ans">${x.text ? esc(x.text) : '<i>아직 쓰지 않았어요.</i>'}</p>
      <div class="fb-chips" role="group" aria-label="${esc(x.label)} 잘한 점">${[...bank.good, ...extraG].map(s => chip(x.key, 'good', s)).join('')}</div>
      <div class="fb-chips" role="group" aria-label="${esc(x.label)} 고칠 점">${[...fixes, ...extraF].map(s => chip(x.key, 'fix', s)).join('')}</div>
      <label class="f"><span>덧붙일 말</span><textarea class="fb-ta" data-fbin="note" data-id="${esc(id)}" data-key="${esc(x.key)}" placeholder="예: 아연–구리 전압 0.5 V를 함께 쓰면 더 설득력 있어요.">${esc(it.note || '')}</textarea></label>
    </div>`;
  };
  const has = fbHas(f);
  const state = !has ? '아직 쓴 피드백이 없어요.'
    : f.sent ? (cloud.db ? `학생 성적서에 보이는 중 · 고치면 바로 반영돼요 (${clockOf(f.at)})` : `보냄 · 실시간 수합이 꺼져 있어 이 기기 성적서에만 보여요. 피드백지로 출력해 나눠 주세요.`)
    : `작성 중 · 이 기기${cloud.db ? '와 수합 공간' : ''}에 저장됨 (${clockOf(f.at)}) · 아직 학생에게 보이지 않아요`;
  return `<section class="fb-wrap" id="fb-ed">
    <h2 class="sec" style="font-size:32px;margin-top:44px">서술 피드백</h2>
    <p class="who">자주 쓰는 말은 눌러서 붙이고, 모자란 말은 ‘덧붙일 말’에 써요. 문구 목록은 ‘피드백 문구’ 탭에서 바꿀 수 있어요.</p>
    ${fields.map(block).join('')}
    <label class="f" style="margin-top:18px"><span>조 전체에 한마디 (선택)</span><textarea class="fb-ta" data-fbin="all" data-id="${esc(id)}" placeholder="예: 측정을 꼼꼼히 다시 확인한 점이 좋았어요.">${esc(f.note || '')}</textarea></label>
    <div class="tsave" role="status" style="margin-top:14px"><span id="fb-state">${esc(state)}</span></div>
    <div class="actions" style="justify-content:flex-start">
      ${f.sent ? `<button type="button" class="secondary" data-fb="unsend" data-id="${esc(id)}">학생 화면에서 내리기</button>` : `<button type="button" class="primary" data-fb="send" data-id="${esc(id)}" ${has ? '' : 'disabled'}>학생에게 보내기</button>`}
      <button type="button" class="secondary" data-fb="print" data-id="${esc(id)}" ${has ? '' : 'disabled'}>피드백지 인쇄</button>
      <button type="button" class="ghost" data-fb="html" data-id="${esc(id)}" ${has ? '' : 'disabled'}>피드백지 파일 저장</button>
    </div>
  </section>`;
}

function fbPrint(list){
  list = list.filter(d => fbHas(fbGet(d.id)));
  if(!list.length){ showToast('출력할 피드백이 없어요.'); return; }
  const box = document.getElementById('fbprint');
  box.innerHTML = `<style>${FB_PRINT_CSS}</style>${fbSheetsHTML(list)}`;
  document.body.classList.add('fbprinting');
  const done = () => { document.body.classList.remove('fbprinting'); box.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  try{ window.print(); }catch(e){ done(); fbSaveHTML(list); return; }
  setTimeout(() => { if(document.body.classList.contains('fbprinting')) done(); }, 60000);
}
async function fbSaveHTML(list){
  list = list.filter(d => fbHas(fbGet(d.id)));
  if(!list.length){ showToast('저장할 피드백이 없어요.'); return; }
  const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서술 피드백지</title><style>body{margin:0;background:#ddd}@media screen{.fb-sheet{max-width:210mm;margin:12px auto;box-shadow:0 1px 4px rgba(0,0,0,.2)}}@page{size:A4;margin:0}${FB_PRINT_CSS}</style></head><body>${fbSheetsHTML(list)}</body></html>`;
  const name = `${VIRTUAL ? '배터리가상시험동' : '배터리시험팀'}_피드백지${list.length === 1 ? '_' + (teamLabel(list[0]) || '').replace(/\s+/g, '_') : ui.tCls ? '_' + ui.tCls + '반' : ''}.html`;
  const r = await saveFile(name, html, 'text/html');
  if(r === 'ok') showToast('피드백지 파일을 저장했어요. 열어서 인쇄하거나 PDF로 저장하세요.');

}

/* ── 이벤트 ── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-fb]');
  if(!el || el.disabled) return;
  const a = el.dataset.fb, id = el.dataset.id;
  switch(a){
    case 'pick': {
      const f = fbEdit(id), it = fbItem(f, el.dataset.key), arr = it[el.dataset.kind], s = el.dataset.s;
      const i = arr.indexOf(s); if(i >= 0) arr.splice(i, 1); else arr.push(s);
      fbCommit(id, f); render(); break;
    }
    case 'send': { const f = fbEdit(id); f.sent = true; f.sentAt = Date.now(); fbCommit(id, f, { now:true, toast:'학생 성적서 화면에 보냈어요.' }); if(!cloud.db) showToast('보냈어요. 실시간 수합이 꺼져 있어서 이 기기 성적서에만 보여요. 피드백지로 출력해 나눠 주세요.'); render(); break; }
    case 'unsend': { const f = fbEdit(id); f.sent = false; fbCommit(id, f, { now:true, toast:'학생 화면에서 내렸어요.' }); render(); break; }
    case 'print': { const d = allTeams().find(x => x.id === id); if(d) fbPrint([d]); break; }
    case 'html': { const d = allTeams().find(x => x.id === id); if(d) fbSaveHTML([d]); break; }
    case 'printall': fbPrint(allTeams().filter(d => ui.tCls == null || String(d.team.cls) === ui.tCls)); break;
    case 'htmlall': fbSaveHTML(allTeams().filter(d => ui.tCls == null || String(d.team.cls) === ui.tCls)); break;
    case 'bankreset': TS.fbBank = null; tSave(); render(); showToast('기본 문구로 되돌렸어요.'); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.fbin;
  if(!k || ui.view !== 'teacher') return;
  if(k === 'bank'){
    const lines = el.value.split('\n').map(s => s.trim()).filter(Boolean), b = fbBank();
    const nb = { good:b.good.slice(), fix:b.fix.slice(), spec:Object.assign({}, b.spec) };
    const which = el.dataset.k;
    if(which === 'good' || which === 'fix') nb[which] = lines; else nb.spec[which.slice(5)] = lines;
    TS.fbBank = nb; tSave(); return;
  }
  const id = el.dataset.id, f = fbEdit(id);
  if(k === 'note') fbItem(f, el.dataset.key).note = el.value;
  else if(k === 'all') f.note = el.value;
  fbCommit(id, f);
  const st = document.getElementById('fb-state');
  if(st) st.textContent = f.sent ? (cloud.db ? '학생 성적서에 보이는 중 · 고치면 바로 반영돼요' : '보냄 · 이 기기 성적서에만 보여요') : '작성 중 · 저장됨';
  ui.pendingRender = true;   /* 칸을 떠나면 보내기 버튼 상태 등을 다시 그림 */
});

/* ═════════ 중간 저장 · 다음에 이어서 하기 ═════════
   - 중간 저장: 지금까지의 기록을 결과 파일(JSON)로 받음. 어느 단계에서든 가능. 교사 화면 '결과 파일 불러오기'에도 그대로 쓰임
   - 다음에 이어서 하기: 이 기기에 저장(수합 중이면 선생님 화면에도 보냄)하고 처음 화면으로. 목록에서 다시 엶
   - 저장 파일로 이어 하기: 받아 둔 파일을 다른 기기에서도 불러와 멈춘 단계부터 이어 함 */
const msFileName = d => `${VIRTUAL ? '배터리가상시험동' : '배터리시험팀'}_${(teamLabel(d) || '반조미정').replace(/\s+/g, '_')}_${(() => { const t = new Date(); return `${t.getMonth() + 1}월${t.getDate()}일_${String(t.getHours()).padStart(2, '0')}${String(t.getMinutes()).padStart(2, '0')}`; })()}.json`;
const msHasTeam = () => !!(S && (S.team.cls || S.team.grp || memberIdx().length));
async function msSaveFile(){
  if(!S) return false;
  if(!msHasTeam()){ showToast('반·조를 먼저 적어야 저장할 수 있어요.'); return false; }
  save(); pushNow();
  const text = JSON.stringify({ kind:FILE_KIND, v:1, data:S });
  if(canSave()){
    const r = await saveFile(msFileName(S), text, 'application/json');
    if(r === 'ok'){ showToast('중간 저장 파일을 받았어요. 잘 보관해 두세요.'); return true; }
    if(r === 'declined') return false;
  }
  /* 파일로 받을 수 없는 화면: 내용을 보여 주고 복사하게 함 */
  ui.modal = { type:'msjson', text }; renderModal();
  return false;
}
function msPauseAsk(){
  if(!S) return;
  if(!msHasTeam()){ ui.view = 'title'; ui.modal = null; render(); window.scrollTo(0, 0); return; }
  ui.modal = { type:'mspause' }; renderModal();
}
function msLeave(){
  save(); pushNow();
  const sent = cloud.state === 'on';
  ui.view = 'title'; ui.modal = null; render(); window.scrollTo(0, 0);
  showToast(`저장했어요. 처음 화면 목록에서 ‘이어서 하기’로 다시 열어요.${sent ? ' 선생님 화면에도 보냈어요.' : ''}`);
}
/* 받아 둔 파일 읽기 */
async function msResumeFile(file){
  let o = null;
  try{ o = JSON.parse(await file.text()); }catch(e){ showToast('저장 파일을 읽지 못했어요.'); return; }
  const raw = o && (o.kind === 'battery-lab-team' || o.kind === 'battery-vlab-team') ? o.data : o;
  if(raw && raw.team && raw.pv && isVirtualRec(raw) !== VIRTUAL){ showToast(`${VIRTUAL ? '배터리 시험팀(실제 실험)' : '배터리 가상 시험동'}의 저장 파일이에요. 그 앱에서 불러와요.`); return; }
  let d = null; try{ d = upgrade(raw); }catch(e){}
  if(!d){ showToast('이 앱의 저장 파일이 아니에요.'); return; }
  const local = loadSlot(d.id);
  if(local && (local.updated || 0) > (d.updated || 0)){ ui.modal = { type:'msnewer', file:d, local }; renderModal(); return; }
  msOpen(d);
}
function msOpen(d){
  try{ localStorage.setItem(PREFIX + d.id, JSON.stringify(d)); }catch(e){ showToast('이 기기에 저장할 수 없어요. 저장 공간을 확인해 주세요.'); return; }
  openSlot(d.id);
  queuePush();
  showToast(`${teamLabel(d) || '저장된'} 기록을 불러왔어요. ${stageName(d.stage, d.track)} 단계부터 이어 해요.`);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-ms]');
  if(!el || el.disabled) return;
  switch(el.dataset.ms){
    case 'save': msSaveFile(); break;
    case 'pause': msPauseAsk(); break;
    case 'leave': msLeave(); break;
    case 'leavefile': (async () => { await msSaveFile(); if(ui.modal && ui.modal.type === 'msjson') return; msLeave(); })(); break;
    case 'copy': {
      const box = document.getElementById('msbox');
      const fallback = () => { if(box){ box.focus(); box.select(); } showToast('선택된 내용을 복사하세요.'); };
      try{ navigator.clipboard.writeText(box ? box.value : '').then(() => showToast('복사했어요.'), fallback); }catch(err){ fallback(); }
      break;
    }
    case 'usefile': { const d = ui.modal && ui.modal.file; ui.modal = null; if(d){ d.updated = Date.now(); msOpen(d); } break; }
    case 'uselocal': { const d = ui.modal && ui.modal.local; ui.modal = null; if(d) openSlot(d.id); break; }
  }
});
document.addEventListener('change', e => {
  if(e.target && e.target.id === 'resumeimp' && e.target.files && e.target.files[0]){ msResumeFile(e.target.files[0]); e.target.value = ''; }
});

const VIEWS = { team:viewTeam, roles:viewRoles, case:viewCase, check:viewCheck, look:viewLook, pairs:viewPairs, order:viewOrder, judge:viewJudge, al:viewAl, series:viewSeries, reply:viewReply, report:viewReport };
const m2 = () => S && S.track && STAGES2[S.track] ? STAGES2[S.track] : null;

function prereq(st){
  const i = sIdx(st);
  if(i > sIdx('pairs') && i < P2 && !pairsDone()) return { msg:'전압 측정 기록이 다 차지 않았어요. 여섯 짝을 모두 기록해야 이어 갈 수 있어요.', st:'pairs', label:'전압 측정으로 가기' };
  if((st === 'judge') && !orderDone()) return { msg:'전압 기록이 바뀌어서 전압 사다리를 다시 정해야 해요.', st:'order', label:'전압 사다리로 가기' };
  if((st === 'al') && !judgedAll()) return { msg:'기록이 바뀌어서 금속 식별을 다시 확정해야 해요.', st:'judge', label:'금속 식별로 가기' };
  const m = m2();
  if(m && m.prereq) return m.prereq(st);
  return null;
}
/* 이 단계를 떠나도 되는가 */
function complete(st){
  switch(st){
    case 'look': return looksDone();
    case 'pairs': return pairsDone();
    case 'order': return orderDone();
    case 'judge': return judgedAll();
    case 'al': return !alIssues().length;
    case 'series': return !serIssues().length;
    case 'reply': return S.reply.signed;
    case 'report': return true;
  }
  const m = m2();

}

function setStage(st, focus = null){
  S.stage = st;
  S.furthest = Math.max(S.furthest, sIdx(st));
  ui.focus = focus; ui.scrollTo = focus; ui.tried = {};
  if(st === 'pairs' && focus) ui.live = focus;
  const m = m2(); if(m && m.enter) m.enter(st);
  save(); render();
  if(focus == null) window.scrollTo(0, 0);
}
function go(st){
  if(S.solo && st === 'roles') st = sIdx('case') <= S.furthest + 1 ? 'case' : 'team';
  if(S.solo && st === 'roles2'){   /* 개별: 역할 교대 없이 준비로 */
    if(sIdx('roles2') > S.furthest + 1) return;
    S.furthest = Math.max(S.furthest, sIdx('roles2')); st = 'prep2';
  }
  const i = sIdx(st);
  if(i < 0 || i > S.furthest + 1) return;
  if(i > sIdx('pairs') && runCheck1().length){ openFlags(1, () => go(st)); return; }
  const m = m2();
  if(m && m.gate && m.gate(st, () => go(st)) === false) return;
  setStage(st);
}
/* 앞 단계를 고치고 돌아갈 때: 그 사이에 다시 해야 할 단계가 있으면 거기로, 없으면 가장 멀리 간 단계로 */
function goNext(st){
  const list = stagesOf(S), from = sIdx(st), last = Math.min(Math.max(S.furthest, from + 1), list.length - 1);
  for(let i = from + 1; i < last; i++) if(!complete(list[i])){ go(list[i]); return; }
  go(list[last]);
}
function next(){
  switch(S.stage){
    case 'team':
      if(teamIssues().length) break;
      if(S.solo){ for(const r in S.roles) S.roles[r] = 0; S.furthest = Math.max(S.furthest, sIdx('roles')); go('case'); }
      else go('roles');
      break;
    case 'roles': if(!roleIssues().length) go('case'); break;
    case 'case': go('check'); break;
    case 'look': if(looksDone()) goNext('look'); break;
    case 'pairs': if(pairsDone()) goNext('pairs'); break;
    case 'order': if(orderDone()) goNext('order'); break;
    case 'judge': if(judgedAll()) goNext('judge'); break;
    case 'al': if(!alIssues().length) goNext('al'); break;
    case 'series': if(!serIssues().length) goNext('series'); break;
    default: { const m = m2(); if(m && m.next) m.next(); }
  }
}

/* 앱의 판정 피드백(오류 문구)을 받은 횟수: 성적서·교사 화면·CSV에 남김 */
function tryAgain(k){ S.tries[k] = (S.tries[k] || 0) + 1; }
/* 금속 식별: 판단이 기록과 맞지 않는다는 피드백이 화면에 나타나면 셈.
   카드에 오류가 보이는 조건(judgeCard의 show)과 같게 보고, 아직 덜 고른 상태 안내와 판단 보류 안내는 세지 않음.
   오류가 없다가 생길 때, 또는 금속을 다른 것으로 바꿨는데도 오류가 남을 때 한 번 */
const JUDGE_TODO = ['금속을 고르세요.', '근거를 하나 이상 고르세요.'];
function judgeFb(p){
  const j = S.judge[p];
  if(j.hold || !(ui.tried[p] || (j.metal && j.chips.length))) return '';
  return judgeMsgs(p).errors.filter(e => !JUDGE_TODO.includes(e)).join('|');
}
function countJudge(p, before, metalChanged){ const now = judgeFb(p); if(now && (!before || metalChanged)) tryAgain('judge'); }
/* 알루미늄: 오류는 고른 답뿐 아니라 나중에 적은 측정값 때문에도 나타남.
   선택을 바꿀 때, 그 직전에 보이던 오류(아직 세지 않은 것)와 바꾼 뒤 새로 나타난 오류를 각각 한 번씩 셈 */
const alFb = () => alMsgs().errors.join('|');
function countFb(k, before, now){
  const seen = ui.fbSeen || (ui.fbSeen = {});
  if(before && seen[k] !== before){ tryAgain(k); seen[k] = before; }
  if(now && seen[k] !== now){ tryAgain(k); seen[k] = now; }
  if(!now) seen[k] = '';
}
