      ui.tried[p] = true;
      if(judgeMsgs(p).errors.length){ countJudge(p, before, false); save(); }
      else { const j = S.judge[p]; j.ok = true; j.sig = judgeSig(p); ui.stamp = p; touch1(); }
      render(); break;
    }
    case 'alpred': S.al.pred = v; touch1(); render(); break;
    case 'alneg': { const before = alFb(); S.al[el.dataset.f] = v; countFb('al', before, alFb()); touch1(); render(); break; }
    case 'alsand': S.al.sand = v === '1'; if(!S.al.sand){ S.al.v2 = ''; S.al.n2 = null; } touch1(); render(); if(S.al.sand){ const i = $('#al-v2'); if(i) i.focus(); } break;
    case 'alexp': { const before = alFb(); S.al.exp = v; countFb('al', before, alFb()); touch1(); render(); break; }
    case 'spick': S.ser.pick = Number(el.dataset.i); if(serMsgs().errors.length) tryAgain('ser'); touch1(); render(); break;
    case 'sring': S.ser.ring = Number(v); touch1(); render(); break;
    case 'spec': S.reply.spec[k] = v; if(specMsg(k)) tryAgain('spec'); touch1(); render(); break;
    case 'sign':
      if(replyIssues().length) break;
      S.reply.signed = true; S.endAt = Date.now(); save(); go('report'); break;
    case 'to2': {
      if(!S.track){
        const t = courseTrack();
        if(!t || !STAGES2[t] || !S.reply.signed) break;
        S.track = t; S.r2 = STAGES2[t].fresh();
        if(S.solo) S.r2.roles = { insp1:0, insp2:null, rec:0, keep:0 };
      }
      const m = m2(); if(!m) break;
      go(S.furthest >= P2 ? stagesOf(S)[S.furthest] : m.stages[0]); break;
    }
    case 'keep': { ui.keepId = el.dataset.id; ui.keepTxt = ''; ui.keepErr = ''; renderModal(); const kw = document.getElementById('kw'); if(kw) kw.focus(); break; }
    case 'keepcancel': ui.keepId = null; ui.keepErr = ''; renderModal(); break;
    case 'keepok': {
      const ph = (ui.modal && ui.modal.ph) || 1, arr = flagsOf(ph);
      const f = arr.find(x => x.id === el.dataset.id);
      const kw = document.getElementById('kw'), why = kw ? kw.value.trim() : '';
      if(why.length < 5){ ui.keepTxt = why; ui.keepErr = '다시 확인한 내용을 5자 이상 적어요.'; renderModal(); const k2 = document.getElementById('kw'); if(k2) k2.focus(); break; }
      ui.keepId = null; ui.keepErr = '';
      if(f){ f.st = 'kept'; f.done = Date.now(); f.why = why; }
      save();
      if(!arr.some(x => x.st === 'open')){ const after = ui.pending; closeModal(); if(after) after(); }
      else renderModal();
      break;
    }
    case 'remeasure': {
      const ph = Number(el.dataset.ph), target = el.dataset.target, focus = el.dataset.focus || null;
      closeModal();
      if(ph === 1){ ui.live = focus; setStage(target, focus); }
      else { const m = m2(); if(m && m.remeasure) m.remeasure(target, focus); }
      break;
    }
    default: {
      if(VIRTUAL && VX.act && VX.act(a, el)) break;
      const m = m2(); if(m && m.act) m.act(a, el);
    }
  }
});

function onInput(e){
  const el = e.target, k = el.dataset && el.dataset.in;
  if(!k || !S || ui.view !== 'game') return;
  if(k === 'cls' || k === 'grp') S.team[k] = el.value;
  else if(/^m\d$/.test(k)) S.team.m[Number(k.slice(1))] = el.value;
  else if(k === 'pv' || k === 'al' || k === 'calc' || k === 'serv'){
    const c = cleanV(el.value);
    if(c !== el.value) el.value = c;
    if(k === 'pv'){ S.pv[el.dataset.k].v = c; ui.live = el.dataset.k; }
    else if(k === 'al') S.al[el.dataset.f] = c;
    else if(k === 'calc') S.ser.calc[Number(el.dataset.i)] = c;
    else S.ser.v = c;
    unsign1();
  }
  else if(k === 'alnote'){ S.al.note = el.value; unsign1(); }
  else if(k === 'ordplan'){ S.ordx.plan = el.value; unsign1(); }
  else if(k === 'jwhy'){
    const j = S.judge[el.dataset.p]; j.why = el.value; unsign1();
    if(j.ok && holdMsgs(el.dataset.p).errors.length){ j.ok = false; ui.pendingRender = true; }
  }
  else if(k === 'cause' || k === 'plan'){ S.reply[k] = el.value; unsign1(); }
  else { const m = m2(); if(m && m.input) m.input(k, el); }
  save();
  refresh(k);
}
document.addEventListener('input', onInput);
document.addEventListener('change', e => {
  if(e.target && e.target.id === 'imp' && e.target.files && e.target.files.length){ importFiles([...e.target.files]); e.target.value = ''; return; }
  if(e.target && e.target.tagName === 'SELECT') onInput(e);
});
document.addEventListener('focusout', () => {
  if(!ui.pendingRender) return;
  ui.pendingRender = false;
  setTimeout(softRender, 0);
});
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') pushNow(); });
window.addEventListener('pagehide', () => pushNow());
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && ui.modal){ closeModal(); return; }
  if(e.key === 'Enter' && e.target && (e.target.id === 'pin1' || e.target.id === 'pin2')){ e.preventDefault(); pinSubmit(); }
});

let tick = 0;
setInterval(() => {
  if(ui.view === 'teacher' && ++tick % 30 === 0 && !ui.modal) softRender();
  const t = document.getElementById('timer');
  if(!t || !S || ui.view !== 'game') return;
  const p2 = ph2(), st = p2 ? S.r2.startAt : S.startAt, en = p2 ? S.r2.endAt : S.endAt;
  if(st) t.textContent = fmt((en || Date.now()) - st);
}, 1000);

function boot(data){
  if(data && data.view === 'game' && data.id && loadSlot(data.id)) openSlot(data.id);
  else render();
  cloud.ready = initCaps();
}
try{ window.claude?.hot?.snapshot?.(() => ({ view:ui.view === 'game' ? 'game' : 'title', id:S ? S.id : null })); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>
