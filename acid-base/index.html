<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>환경 대응팀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한빛천 관제 센터 콘솔. 위엔 상태 표시줄, 왼쪽엔 실험 장비 모니터, 오른쪽엔 기록 패널. 어두운 화면 하나로만 디자인 */
:root{
  --paper:#0C171E; --sheet:#13232C; --sheet2:#1B303B; --field:#09131A; --ink:#E3EDF2; --ink2:#93A8B4; --line:#2A4250;
  --hi:#46C2DA; --on-hi:#04161C; --tape:#F2B705; --stamp:#FF6B5E; --focus:#8EDCFF; --good:#5BC98C;
  --plate:#1B303B; --plate-edge:#3B5867; --well:#0E1C24;
  --A:#E8BF2A; --N:#55B865; --B:#4F86E0;
  --ion-h:#E8BF2A; --ion-o:#4F86E0; --ion-na:#4A3F60; --ion-cl:#2F5040;
  --water:#22465F; --water-ink:#CDE8FB; --merc:#FF6B6B;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,Menlo,monospace;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{ box-sizing: inherit; }
html{ height:100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ margin:0; min-height:100%; background-color:var(--paper); background-image:linear-gradient(rgba(70,194,218,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(70,194,218,.035) 1px, transparent 1px); background-size:44px 44px; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55; overflow-x:hidden; }
body.locked{ overflow:hidden; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.disp{ font-family:var(--display); font-weight:800; font-synthesis:none; }
h1, h2, h3{ text-wrap:balance; }

#app{ max-width:1280px; margin:0 auto; padding-inline:clamp(16px,2.6vw,30px); padding-block:0 40px; }

/* ── header & steps ── */
.top{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 22px; padding:14px 0 10px; }
.home{ background:none; border:0; padding:6px 0; cursor:pointer; font-family:var(--display); font-weight:800; font-synthesis:none; font-size:21px; }
.caseid{ display:flex; flex-wrap:wrap; gap:2px 12px; align-items:baseline; }
.caseid .no{ font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; }
.caseid .place{ color:var(--ink2); display:inline-flex; align-items:center; gap:8px; }
.clock{ margin-left:auto; display:flex; align-items:baseline; gap:8px; }
.clock-l{ font-size:14px; color:var(--ink2); }
#timer{ font-family:var(--mono); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--hi); }
.steps{ position:relative; list-style:none; margin:0 0 20px; padding:10px 0 12px; display:flex; gap:6px; overflow-x:auto; border-top:1.5px solid var(--line); scrollbar-width:thin; }
.steps li{ flex:none; display:flex; align-items:center; gap:4px; }
.steps button{ min-height:40px; padding:0 13px; border-radius:999px; border:1.5px solid var(--line); background:transparent; color:var(--ink2); font-size:15px; white-space:nowrap; cursor:pointer; }
.steps button.done{ color:var(--ink); border-color:var(--ink2); }
.steps button[aria-current="step"]{ background:var(--hi); color:var(--on-hi); border-color:var(--hi); font-weight:700; }
.steps button:disabled{ opacity:.42; cursor:default; }
.steps .grp{ padding:0 8px; margin:0 2px; border-left:1.5px dashed var(--line); border-right:1.5px dashed var(--line); }
.grp-l{ font-size:13px; color:var(--ink2); margin-right:2px; white-space:nowrap; }

/* ── common blocks ── */
h1.st{ font-family:var(--display); font-weight:800; font-synthesis:none; font-size:clamp(30px,4vw,42px); line-height:1.12; margin:0 0 8px; }
.instr{ font-size:18px; max-width:62ch; margin:0 0 10px; }
.who{ color:var(--ink2); font-size:15px; margin:0 0 14px; max-width:75ch; }
.who b{ color:var(--ink); font-weight:600; }
.narrow{ max-width:820px; }
.say{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:baseline; background:var(--sheet); border:1.5px solid var(--line); padding:12px 16px; margin:0 0 18px; border-radius:12px; max-width:70ch; }
.say b{ font-family:var(--display); font-weight:800; font-synthesis:none; font-size:18px; color:var(--hi); display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.say b::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--hi); box-shadow:0 0 8px var(--hi); }
.say p{ margin:0; }
.actions{ display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:12px 16px; margin-top:24px; }
.progress{ color:var(--ink2); font-variant-numeric:tabular-nums; margin-right:auto; }
.primary{ min-height:56px; padding:0 26px; border-radius:12px; border:0; background:var(--hi); color:var(--on-hi); font-size:18px; font-weight:700; cursor:pointer; }
.primary:disabled{ opacity:.32; cursor:not-allowed; }
.primary.danger{ background:var(--stamp); color:#1C0705; }
.secondary{ min-height:50px; padding:0 18px; border-radius:10px; border:1.5px solid var(--ink); background:transparent; font-weight:600; cursor:pointer; }
.secondary:disabled{ opacity:.45; cursor:default; }
.ghost{ min-height:50px; padding:0 16px; border-radius:10px; border:1.5px dashed var(--ink2); background:transparent; color:var(--ink2); font-weight:600; cursor:pointer; }
.ghost:disabled{ opacity:.45; cursor:default; }
.primary.sm, .secondary.sm, .ghost.sm{ min-height:46px; padding:0 16px; font-size:16px; }
.banner{ background:var(--sheet); border:2px solid var(--tape); border-radius:8px; padding:10px 14px; margin:0 0 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
.hint{ list-style:none; padding:0; margin:14px 0 0; color:var(--ink2); font-size:15px; }
.hint li::before{ content:"· "; }
h2.sec{ font-family:var(--display); font-weight:800; font-synthesis:none; font-size:23px; margin:28px 0 10px; }
h3.sub3{ font-size:17px; margin:18px 0 6px; }

/* ── form fields ── */
label.f{ display:block; font-size:15px; color:var(--ink2); }
label.f > span{ display:block; margin-bottom:6px; }
input[type=text], input[type=password], select, textarea{ width:100%; min-height:52px; font:inherit; font-size:18px; padding:0 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--field); color:var(--ink); }
textarea{ min-height:140px; padding:12px; resize:vertical; line-height:1.6; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:380px; margin:18px 0; }
fieldset{ border:0; padding:0; margin:0; }
legend{ font-weight:700; margin-bottom:10px; padding:0; }
.members{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr)); gap:12px; }
.count{ font-size:14px; color:var(--ink2); text-align:right; margin-top:4px; font-variant-numeric:tabular-nums; }

/* ── evidence tags (sample cards) ── */
.samples{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr)); gap:12px; }
.tag{ position:relative; background:var(--sheet); border:1.5px solid var(--line); border-radius:6px 14px 14px 6px; padding:12px 14px 14px 30px; min-width:0; }
.tag::before{ content:""; position:absolute; left:11px; top:20px; width:9px; height:9px; border-radius:50%; background:var(--line); }
.tag.on::before{ background:var(--hi); box-shadow:0 0 8px var(--hi); }
.tag.focus{ border-color:var(--focus); box-shadow:0 0 0 3px var(--focus); }
.tag-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; min-height:38px; }
.sno{ font-family:var(--display); font-weight:800; font-synthesis:none; font-size:28px; line-height:1; }
.tag-head .ok{ margin-left:auto; color:var(--good); font-size:14px; font-weight:600; white-space:nowrap; }
.sub{ margin-top:8px; }
.sub-l{ display:block; font-size:14px; color:var(--ink2); margin:10px 0 6px; }
.sub .sub-l{ margin-top:0; }
.mini{ margin:0; font-size:14px; color:var(--ink2); }
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt{ flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--sheet2); font-weight:600; cursor:pointer; }
.opt[aria-pressed="true"]{ background:var(--hi); color:var(--on-hi); border-color:var(--hi); }
.opt small{ font-weight:500; font-size:12px; opacity:.75; }
.sw{ display:inline-block; width:18px; height:18px; border-radius:4px; flex:none; vertical-align:-3px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2); }
.sw.round{ border-radius:50%; }
.ph-pick{ width:100%; min-height:56px; display:flex; align-items:center; gap:12px; padding:0 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--sheet2); font-weight:600; cursor:pointer; text-align:left; }
.ph-pick .sw{ width:30px; height:30px; border-radius:7px; }
.ph-pick.empty{ border-style:dashed; color:var(--ink2); }

/* temperature input */
.tin{ display:flex; align-items:center; gap:8px; }
.tin input{ width:104px; flex:none; text-align:center; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; padding:0 6px; }
.tin .unit{ font-weight:600; color:var(--ink2); }
.step{ width:52px; min-height:52px; flex:none; border-radius:10px; border:1.5px solid var(--line); background:var(--sheet2); font-size:24px; font-weight:700; line-height:1; cursor:pointer; }
.terr{ margin:6px 0 0; font-size:14px; color:var(--stamp); }
.terr:empty{ display:none; }

/* ── work layout with apparatus drawing ── */
.work{ display:grid; grid-template-columns:1fr; gap:22px; }
.plate-col{ min-width:0; }
.plate-col svg{ display:block; width:100%; height:auto; max-width:560px; margin:0 auto; }
.work > section{ min-width:0; }
.legend{ font-size:14px; color:var(--ink2); text-align:center; margin:6px 0 0; }
@media (min-width:900px){
  .work{ grid-template-columns:minmax(0,5fr) minmax(0,7fr); align-items:start; }
  .plate-col{ position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px); }
}
@media (max-width:899px){
  .plate-col svg{ max-width:460px; }
}

/* plate svg */
.pl-plate{ fill:var(--plate); stroke:var(--plate-edge); stroke-width:2; }
.pl-well{ fill:var(--well); stroke:var(--plate-edge); stroke-width:1.5; }
.pl-num{ fill:var(--ink); font-family:var(--display); font-weight:800; font-size:24px; }
.pl-label{ fill:var(--ink2); font-size:16px; font-weight:600; font-family:var(--body); }
.pl-label.on{ fill:var(--ink); font-weight:700; }
.pl-active{ fill:var(--hi); opacity:.16; }
.pl-strip-empty{ fill:none; stroke:var(--ink2); stroke-width:1.2; stroke-dasharray:3 3; }
.pl-strip{ stroke:rgba(0,0,0,.25); stroke-width:1; }
.pl-ph{ font-size:14px; font-weight:700; fill:#fff; paint-order:stroke; stroke:rgba(0,0,0,.5); stroke-width:2.6px; font-family:var(--body); }
.pl-mg{ fill:#A3ACB6; stroke:#6E7883; stroke-width:1; }
.pl-bub{ fill:var(--sheet); fill-opacity:.85; stroke:var(--ink2); stroke-width:1.3; }
.pl-ring{ fill:none; stroke:var(--focus); stroke-width:3.5; }
.well{ cursor:pointer; outline:none; }
.well:hover .pl-well, .well:focus-visible .pl-well{ stroke:var(--focus); stroke-width:3; }
.pop{ animation:pop .34s ease-out; transform-box:fill-box; transform-origin:center; }
@keyframes pop{ from{ transform:scale(.8); } to{ transform:scale(1); } }

/* beakers svg */
.bk-glass{ fill:none; stroke:var(--ink2); stroke-width:2.5; stroke-linejoin:round; }
.bk-lip{ stroke:var(--ink2); stroke-width:2.5; stroke-linecap:round; }
.bk-liq{ opacity:.9; }
.bk-liq.clear{ fill:var(--well); stroke:var(--line); stroke-width:1; opacity:1; }
.th-tube{ fill:var(--sheet); stroke:var(--ink2); stroke-width:1.2; }
.th-merc{ fill:var(--merc); }
.th-bulb{ fill:var(--sheet); stroke:var(--ink2); stroke-width:1.2; }
.th-bulb.on{ fill:var(--merc); stroke:var(--merc); }
.bk-temp{ fill:var(--ink); font-weight:700; font-size:19px; font-family:var(--body); }
.bk-name{ fill:var(--ink); font-family:var(--display); font-size:28px; }
.bk-vol{ fill:var(--ink2); font-size:15px; font-family:var(--body); }
.bk-sel{ fill:var(--hi); opacity:.16; }
.bk{ cursor:pointer; outline:none; }
.bk:hover .bk-glass, .bk:focus-visible .bk-glass{ stroke:var(--focus); stroke-width:4; }

/* graph */
.graph{ display:block; width:100%; height:auto; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; }
.graph line, .graph text, .graph polyline, .graph circle{ pointer-events:none; }
.g-col{ fill:transparent; cursor:crosshair; outline:none; }
.g-col:hover{ fill:var(--sheet2); }
.g-col.sel{ fill:var(--hi); fill-opacity:.14; }
.g-col:focus-visible{ stroke:var(--focus); stroke-width:3; }
.g-grid{ stroke:var(--line); stroke-width:1; }
.g-axis{ stroke:var(--ink); stroke-width:2; }
.g-tick{ fill:var(--ink2); font-size:14px; font-family:var(--body); font-variant-numeric:tabular-nums; }
.g-xl{ fill:var(--ink); font-family:var(--display); font-size:22px; }
.g-xs{ fill:var(--ink2); font-size:13px; font-family:var(--body); }
.g-title{ fill:var(--ink2); font-size:14px; font-weight:600; font-family:var(--body); }
.g-init{ stroke:var(--ink2); stroke-width:1.5; stroke-dasharray:6 5; }
.g-init-t{ fill:var(--ink2); font-size:13px; font-family:var(--body); }
.g-line{ fill:none; stroke:var(--hi); stroke-width:2.5; stroke-linejoin:round; }
.g-pt{ fill:var(--hi); stroke:var(--sheet); stroke-width:2; }
.g-pt.bad{ fill:var(--sheet); stroke:var(--stamp); stroke-width:3; }
.g-ring{ fill:none; stroke:var(--focus); stroke-width:3; }
.g-val{ fill:var(--ink); font-weight:700; font-size:16px; font-family:var(--body); font-variant-numeric:tabular-nums; }
.bar-w{ fill:var(--water); stroke:var(--water-ink); stroke-width:1.5; }
.bar-t{ fill:var(--merc); fill-opacity:.75; }
.gpick{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-top:12px; }
.gpick .opt, .mtabs .opt{ flex-direction:column; gap:0; min-height:62px; padding:4px 6px; font-family:var(--display); font-size:22px; font-weight:400; }
.gpick .opt small, .mtabs .opt small{ font-family:var(--body); font-size:13px; font-weight:600; opacity:1; min-height:1.2em; }
.gpick .opt small.bad{ color:var(--stamp); }
.gpick .opt[aria-pressed="true"] small.bad{ color:var(--on-hi); }
.gfine{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; margin-top:12px; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; }
.gfine .gf-t{ margin-right:auto; font-variant-numeric:tabular-nums; }

/* prep: volume table */
.vol-head, .vol-row{ display:grid; grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 70px; gap:10px; align-items:center; }
.vol-head{ font-size:14px; color:var(--ink2); margin-bottom:6px; }
.vol-row{ margin-bottom:8px; }
.vin{ display:flex; align-items:center; gap:6px; min-width:0; }
.vin input{ text-align:center; font-weight:600; min-width:0; }
.vin span{ color:var(--ink2); font-size:15px; }
.sum{ text-align:right; color:var(--ink2); font-variant-numeric:tabular-nums; }
.t0-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:6px; }
@media (max-width:520px){
  .t0-row{ grid-template-columns:1fr; }
  .vol-head, .vol-row{ grid-template-columns:36px minmax(0,1fr) minmax(0,1fr); }
  .vol-head span:last-child{ display:none; }
  .sum{ display:none; }
}

/* ion model */
.mtabs{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:6px 0 16px; }
.mwork{ display:grid; gap:18px; }
.mviz, .mside{ min-width:0; }
@media (min-width:900px){ .mwork{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; } }
.ionsvg{ display:block; width:100%; max-width:520px; height:auto; margin:0 auto; }
.m-glass{ fill:none; stroke:var(--ink2); stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
.m-liq{ fill:var(--water); opacity:.4; }
.ion{ cursor:pointer; outline:none; }
.ion .c{ stroke:rgba(0,0,0,.28); stroke-width:1.2; }
.ion-h .c{ fill:var(--ion-h); }
.ion-o .c{ fill:var(--ion-o); }
.ion-na .c{ fill:var(--ion-na); }
.ion-cl .c{ fill:var(--ion-cl); }
.ion text{ font-family:var(--body); font-weight:700; font-size:15px; pointer-events:none; }
.ion-h text{ fill:#16202A; }
.ion-o text{ fill:#FFFFFF; }
.ion-na text, .ion-cl text{ fill:var(--ink); }
.ion-ch{ font-size:12px; }
.ion .ring{ fill:none; stroke:var(--focus); stroke-width:4; }
.ion:focus-visible .c{ stroke:var(--focus); stroke-width:3; }
.water rect{ fill:var(--water); stroke:var(--water-ink); stroke-width:1.5; }
.water text{ fill:var(--water-ink); font-weight:700; font-size:14px; font-family:var(--body); }
.sub2{ font-size:10px; }
.ilegend{ list-style:none; padding:0; margin:0 0 12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px 12px; font-size:15px; }
.ilegend li{ display:flex; align-items:center; gap:8px; }
.ichip{ display:inline-block; flex:none; min-width:46px; height:30px; line-height:30px; text-align:center; padding:0 8px; border-radius:15px; font-weight:700; font-size:14px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2); }
.ichip sup, .ichip sub{ line-height:0; font-size:11px; }
.ichip.ion-h{ background:var(--ion-h); color:#16202A; }
.ichip.ion-o{ background:var(--ion-o); color:#fff; }
.ichip.ion-na{ background:var(--ion-na); color:var(--ink); }
.ichip.ion-cl{ background:var(--ion-cl); color:var(--ink); }
.ichip.water{ background:var(--water); color:var(--water-ink); border-radius:8px; }
.wcount{ font-size:18px; margin:6px 0 10px; }
.wcount b{ font-family:var(--display); font-weight:400; font-size:30px; margin:0 4px; }
.mmsg{ color:var(--stamp); font-size:15px; margin:8px 0; }
.cmp{ margin:12px 0 0; padding:10px 14px; border-radius:8px; background:var(--sheet); border:1.5px solid var(--line); font-size:15px; }
.cmp.same{ border-color:var(--good); }
.cmp.diff{ border-color:var(--tape); }
.msum svg{ display:block; width:100%; max-width:720px; height:auto; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; }

/* ── roles & checks ── */
.role{ background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.role h2{ font-family:var(--display); font-weight:800; font-synthesis:none; font-size:22px; margin:0; }
.duty{ margin:4px 0 12px; color:var(--ink2); font-size:15px; }
.role.fixed{ background:transparent; border-style:dashed; }
.fixed-name{ margin:0; font-weight:700; font-size:19px; }
.check{ display:grid; grid-template-columns:34px 1fr; gap:2px 14px; width:100%; text-align:left; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; cursor:pointer; min-height:64px; align-items:center; }
.box{ grid-row:span 2; width:32px; height:32px; border:2.5px solid var(--ink2); border-radius:6px; display:grid; place-items:center; }
.check[aria-checked="true"]{ border-color:var(--hi); }
.check[aria-checked="true"] .box{ background:var(--hi); border-color:var(--hi); }
.check[aria-checked="true"] .box::after{ content:""; width:9px; height:16px; border:solid var(--on-hi); border-width:0 3px 3px 0; transform:translate(0,-2px) rotate(45deg); }
.who-l{ font-size:14px; color:var(--ink2); }

/* ── case document ── */
.doc{ background:var(--sheet); border:1.5px solid var(--line); border-radius:4px; padding:22px clamp(14px,3vw,30px); max-width:920px; margin-bottom:18px; }

/* ── console bits ── */
.lamp{ display:inline-block; flex:none; width:10px; height:10px; border-radius:50%; background:var(--tape); box-shadow:0 0 10px var(--tape); }

.mon-t{ fill:var(--ink2); font-size:12px; font-family:var(--mono); }

(() => {

function upgrade(d){
  if(!d || d.v !== 1 || !d.rec || !d.team || !d.judge || !d.reply) return null;
  if(!d.id) d.id = String(d.created || Date.now());
  if(!STAGES.includes(d.stage)) d.stage = STAGES.includes(d.last) ? d.last : 'team';
  delete d.last;
  const c = Array.isArray(d.checks) ? d.checks : [];
  d.checks = c.length === 4 && CHECKS.length === 5 ? [c[0], c[1], false, c[2], c[3]] : CHECKS.map((_, i) => !!c[i]);
  const f = fresh2();
  if(!d.r2) d.r2 = f;
  else {
    for(const k in f) if(d.r2[k] === undefined) d.r2[k] = f[k];
    for(const k in f.concl) if(d.r2.concl[k] === undefined) d.r2.concl[k] = f.concl[k];
  }
  return d;
}
function listSlots(){
  const out = [];
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith(PREFIX)) continue;
      try{ const d = upgrade(JSON.parse(localStorage.getItem(k))); if(d) out.push(d); }catch(e){}
    }
  }catch(e){}
  return out.sort((a, b) => (b.updated || 0) - (a.updated || 0));
}
function loadSlot(id){
  try{ return upgrade(JSON.parse(localStorage.getItem(PREFIX + id))); }catch(e){ return null; }
}
function removeSlot(id){ try{ localStorage.removeItem(PREFIX + id); }catch(e){} }
function migrate(){
  try{
    const raw = localStorage.getItem(LEGACY);
    if(!raw) return;
    const d = upgrade(JSON.parse(raw));
    if(d) localStorage.setItem(PREFIX + d.id, JSON.stringify(d));
    localStorage.removeItem(LEGACY);
  }catch(e){}
}

/* ───────── 그림: 온도 그래프 ───────── */
const G = { W:600, H:376, L:64, R:584, T:24, B:288 };

    body = `<div class="opts">${['Y','G','B'].map(k => opt('btb',k,BTB_NAME[k],sw(BTB_COLORS[k],true))).join('')}</div>`;

function litCell(v, kind){

  return v ? sw(LIT.redChanged)+'푸르게 변함' : sw(LIT.red)+'변화 없음';
}

    return `<tr><th scope="row" class="c">${CIRC[s]}</th>

    <thead><tr><th>시료</th><th>푸른 리트머스</th><th>붉은 리트머스</th><th>BTB</th><th>전기 전도성</th><th>pH 시험지</th><th>마그네슘</th><th>판정</th>${kc ? '<th>정답</th>' : ''}<th>판정 근거</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function histBlock(items, tag){

const cloud = { db:null, state:'checking', last:null, timer:null, writing:false, dirty:false, teams:new Map(), sub:null, subOk:false, subErr:false, ready:null };
const dl = { api:null };
const inClaude = !!(window.claude && typeof window.claude.use === 'function');
const canSave = () => !!dl.api || !inClaude;
function blobSave(filename, data, type){
  try{
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  }catch(e){ return false; }
}
async function saveFile(filename, data, type){
  if(dl.api){
    try{ await dl.api.save({ filename, data }); return 'ok'; }
    catch(e){ if(e && e.code === 'declined') return 'declined'; }
  }
  if(!inClaude && blobSave(filename, data, type)) return 'ok';
  return 'fail';
}
function capUse(n){
  try{ return window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null); }
  catch(e){ return Promise.resolve(null); }
}
async function initCaps(){
  const [db, d] = await Promise.all([capUse('db'), capUse('downloads')]);

  if(!cloud.db || cloud.state === 'denied' || cloud.state === 'full' || !S) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(pushNow, 1200);
}
async function pushNow(){
  clearTimeout(cloud.timer);
  if(!cloud.db || cloud.state === 'denied' || cloud.state === 'full' || !S || !S.team.cls || !S.team.grp) return;
  if(cloud.writing){ cloud.dirty = true; return; }
  cloud.writing = true;
  const d = S;
  const body = { id:d.id, cls:Number(d.team.cls) || 0, grp:Number(d.team.grp) || 0, stage:d.stage, updated:d.updated || Date.now(), json:JSON.stringify(d) };
  let wait = 1200;
  try{
    await cloud.db.collection('teams').doc(d.id).set(body);
    cloud.last = Date.now(); cloud.state = 'on';
  }catch(e){
    const c = e && e.code;
    if(c === 'quota_exceeded') cloud.state = 'full';
    else if(['invalid_argument','not_granted','revoked','capability_disabled','capability_removed','transform_error'].includes(c)) cloud.state = 'denied';
    else { cloud.state = 'retry'; cloud.dirty = true; wait = 6000; }
  }
  cloud.writing = false;
  refreshSync();
  if(cloud.dirty){ cloud.dirty = false; clearTimeout(cloud.timer); cloud.timer = setTimeout(pushNow, wait); }
}
function syncText(){
  switch(cloud.state){
    case 'checking': return '';

    case 'retry': return '연결이 불안정해서 다시 보내는 중이에요. 기록은 이 기기에도 저장돼요.';
    case 'denied': return '이 계정으로는 선생님 화면에 보낼 수 없어요. 기록은 이 기기에 저장돼요.';
    case 'full': return '수합 공간이 가득 찼어요. 선생님께 알려 주세요. 기록은 이 기기에 저장돼요.';
    default: return canSave() ? '기록은 이 기기에만 저장돼요. 끝나면 결과 파일을 저장해 선생님께 내요.' : '기록은 이 기기에만 저장돼요.';

const TKEY = 'chem-forensics-teacher-v1';
const SCORE = { 1:{A:20,B:15,C:10,D:5}, 2:{A:20,B:15,C:10,D:5}, 3:{A:30,B:25,C:20,D:15}, 4:{A:30,B:25,C:20,D:15} };
const ITEM = { 1:'탐구 수행: 1차 분석 결과', 2:'탐구 수행: 2차 분석 결과', 3:'과학적 원리 설명 및 생활 속 적용', 4:'보고서 구성과 발표 및 역할 수행' };
const C3 = ['반응 결과(물과 열 발생)를 올바르게 설명함', '모형으로 수소 이온과 수산화 이온이 반응해 물이 생성되는 원리를 설명함', '생활 속 중화 반응의 사례를 2가지 이상 설명함'];
const G0 = { i1:null, i2:null, c3:[false,false,false], c3set:false, i4:null, per:{} };
function tFresh(){ return { v:1, key:{}, names:{}, grades:{}, imported:{}, pin:null }; }
function tLoad(){ try{ const d = JSON.parse(localStorage.getItem(TKEY) || 'null'); if(d && d.v === 1) return Object.assign(tFresh(), d); }catch(e){} return tFresh(); }
function tSave(){ try{ localStorage.setItem(TKEY, JSON.stringify(TS)); }catch(e){} }
let TS = tLoad();
const hasKey = () => SAMPLES.some(s => TS.key[s]);
const keyedN = () => SAMPLES.filter(s => TS.key[s]).length;
const gradeOf = id => TS.grades[id] || (TS.grades[id] = JSON.parse(JSON.stringify(G0)));
const i3Of = g => g.c3set ? ['D','C','B','A'][g.c3.filter(Boolean).length] : null;
function teamTotal(id){
  const g = TS.grades[id]; if(!g) return null;
  const v = [g.i1, g.i2, i3Of(g), g.i4];
  return v.some(x => !x) ? null : SCORE[1][v[0]] + SCORE[2][v[1]] + SCORE[3][v[2]] + SCORE[4][v[3]];
}
function withTeam(d, fn){ const prev = S; S = d; try{ return fn(); } finally{ S = prev; } }
function ago(ts){
  if(!ts) return '';
  const m = Math.floor((Date.now() - ts) / 60000);
  return m < 1 ? '방금' : m < 60 ? `${m}분 전` : whenStr(ts);
}
function allTeams(){
  const m = new Map();
  const add = d => { if(!d || !d.team || !d.team.cls || !d.team.grp) return; const o = m.get(d.id); if(!o || (d.updated || 0) > (o.updated || 0)) m.set(d.id, d); };
  Object.values(TS.imported).forEach(x => add(upgrade(x)));
  listSlots().forEach(add);
  cloud.teams.forEach(add);
  return [...m.values()].sort((a, b) => (a.team.cls - b.team.cls) || (a.team.grp - b.team.grp) || ((b.updated || 0) - (a.updated || 0)));
}
function subscribeTeams(){
  if(!cloud.db || cloud.sub) return;
  try{
    cloud.sub = cloud.db.collection('teams').onSnapshot(snap => {
      const m = new Map();
      for(const doc of snap.docs){
        const b = doc.data();
        try{ const d = upgrade(JSON.parse(b && b.json)); if(d) m.set(d.id, d); }catch(e){}
      }
      cloud.teams = m; cloud.subOk = true; cloud.subErr = false;
      if(ui.view === 'teacher') softRender();
    }, () => { cloud.sub = null; cloud.subErr = true; if(ui.view === 'teacher') softRender(); });
  }catch(e){ cloud.subErr = true; }
}
function metrics(){
  const valid = s => S.judge[s].ok && S.judge[s].sig === recSig(s);
  return {
    judged: SAMPLES.filter(valid).length,
    correct: hasKey() ? SAMPLES.filter(s => TS.key[s] && valid(s) && S.judge[s].liq === TS.key[s]).length : null,
    kept1: S.flags.filter(f => f.st === 'kept').length,
    kept2: S.r2.flags.filter(f => f.st === 'kept').length,
    meas: IDX5.filter(rowDone).length, graph: graphOk(), model: IDX5.filter(modelOk).length,
    s1: S.reply.signed, s2: S.r2.concl.signed, p2: !!S.r2.startAt
  };
}
function sugg1(m){
  if(m.correct == null || keyedN() < 6) return null;
  const n = m.correct;
  return n === 6 ? 'A' : n >= 4 ? 'B' : n === 3 ? 'C' : 'D';
}
function sugg2(m){
  if(!m.p2) return null;
  if(m.meas === 5 && m.graph) return S.r2.concl.change.trim().length >= TXT.change ? 'A' : 'B';
  return m.meas >= 3 ? 'C' : 'D';
}
async function hashPin(p){
  const txt = 'chem-forensics:' + p;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }catch(e){ let h = 0; for(const ch of txt) h = (h * 31 + ch.charCodeAt(0)) | 0; return 'x' + (h >>> 0).toString(16); }
}
async function getPinHash(){
  if(cloud.db){ try{ const s = await cloud.db.doc('config/teacher').get(); return s.exists ? (s.data().pin || null) : null; }catch(e){} }
  return TS.pin;
}
async function setPinHash(h){

}

async function pinSubmit(){
  const m = ui.modal; if(!m || m.type !== 'pin') return;
  const p1 = (document.getElementById('pin1') || {}).value || '', p2 = (document.getElementById('pin2') || {}).value || '';
  if(!/^\d{4,6}$/.test(p1)){ m.err = '숫자 4~6자리로 입력하세요.'; renderModal(); return; }
  if(m.mode === 'set'){
    if(p1 !== p2){ m.err = '두 번 입력한 번호가 달라요.'; renderModal(); return; }
    await setPinHash(await hashPin(p1));
  } else if(await hashPin(p1) !== m.hash){ m.err = '번호가 맞지 않아요.'; renderModal(); return; }
  ui.modal = null; renderModal(); enterTeacher();
}

async function importFiles(files){
  let ok = 0, bad = 0;
  for(const f of files){
    try{
      const o = JSON.parse(await f.text());
      for(const x of (Array.isArray(o) ? o : [o])){
        const d = upgrade(x && x.kind === 'chem-forensics-team' ? x.data : null);
        if(d && d.team.cls && d.team.grp){ const prev = TS.imported[d.id]; if(!prev || (prev.updated || 0) <= (d.updated || 0)) TS.imported[d.id] = d; ok++; }
        else bad++;
      }
    }catch(e){ bad++; }
  }
  tSave(); render();
  showToast(`결과 파일 ${ok}개를 불러왔어요.${bad ? ` 읽지 못한 파일 ${bad}개.` : ''}`);

const csvCell = v => { const t = String(v ?? ''); return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
function buildCSV(list){
  const rows = [['반','조','이름','1차 역할','2차 역할','1차 분석 결과(20)','2차 분석 결과(20)','원리 설명·생활 적용(30)','보고서·발표·역할(30)','합계','1차 판정 일치']];
  for(const d of list){
    withTeam(d, () => {
      const g = TS.grades[d.id] || G0, m = metrics(), defs = roleDefs();
      const roleOf = (i, ph) => { const r = defs.find(x => rolesOf(ph)[x.id] === i); return r ? r.label : ''; };
      const g3 = i3Of(g);
      for(const i of memberIdx()){
        const g4 = (g.per && g.per[i]) || g.i4;
        const sc = [g.i1 ? SCORE[1][g.i1] : '', g.i2 ? SCORE[2][g.i2] : '', g3 ? SCORE[3][g3] : '', g4 ? SCORE[4][g4] : ''];
        const tot = sc.every(x => x !== '') ? sc.reduce((a, b) => a + b, 0) : '';
        rows.push([S.team.cls, S.team.grp, nm(i), roleOf(i, 1), S.r2.startAt ? roleOf(i, 2) : '', ...sc, tot, m.correct == null ? '' : `${m.correct}/${keyedN()}`]);
      }
    });
  }
  return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

function softRender(){
  const a = document.activeElement;
  if(a && a !== document.body && a.matches && a.matches('input, textarea, select')){ ui.pendingRender = true; refreshSync(); return; }

/* ───────── 렌더 & 이동 ───────── */
function render(){
  const app = $('#app');
  if(ui.view === 'teacher'){ app.innerHTML = viewTeacher(); renderModal(); return; }
  if(ui.view !== 'game' || !S){ app.innerHTML = viewTitle(); renderModal(); return; }
  app.innerHTML = viewHeader() + `<main>${VIEWS[S.stage]()}</main>`;
  ui.pop = null; ui.stamp = null; ui.mpop = null;
  const nav = document.querySelector('.steps'), cur = nav && nav.querySelector('[aria-current]');
  if(nav && cur) nav.scrollLeft = cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2;
  renderModal();
  const behavior = reduceMotion ? 'auto' : 'smooth';
  if(ui.scrollTo != null){
    const el = document.getElementById('tag-' + ui.scrollTo);
    if(el) el.scrollIntoView({ block:'center', behavior });
    ui.scrollTo = null;
  }
  if(ui.scrollSel){
    const el = document.querySelector(ui.scrollSel);
    if(el) el.scrollIntoView({ block:'start', behavior });
    ui.scrollSel = null;
  }
}
function setStage(st, focus = null){
  S.stage = st;
  S.furthest = Math.max(S.furthest, sIdx(st));
  ui.focus = focus; ui.scrollTo = focus; ui.tried = {}; ui.msel = null; ui.mmsg = '';
  if(st === 'model'){ const nx = IDX5.find(k => !modelOk(k)); ui.mb = nx ?? 0; }
  save(); render();
  if(focus == null) window.scrollTo(0, 0);
}
function go(st){
  const i = sIdx(st);
  if(i < 0 || i > S.furthest + 1) return;
  if(i >= sIdx('judge') && runCheck().length){ openFlags(1, () => go(st)); return; }
  if(i > sIdx('m2') && runCheck2().length){ openFlags(2, () => go(st)); return; }
  setStage(st);
}
function next(){
  switch(S.stage){
    case 'team': if(!teamIssues().length) go('roles'); break;
    case 'roles': if(!roleIssues().length) go('case'); break;
    case 'case': go('check'); break;
    case 'judge': SAMPLES.forEach(syncJudge); if(SAMPLES.every(s => S.judge[s].ok)) go('reply'); break;
  }
}
function afterTest(i){
  const idx = sIdx('t'+i);
  go(S.furthest > idx ? STAGES[S.furthest] : STAGES[idx+1]);
}
function testNext(){
  const i = Number(S.stage.slice(1));
  if(!testDone(i)) return;
  const open = runCheck();
  if(open.length){ openFlags(1, () => afterTest(i)); return; }
  afterTest(i);
}
function setRec(s, f, v){
  S.rec[s][f] = f === 'btb' ? v : Number(v);
  ui.pop = { s, row:ROW_OF[f] };
  if(ui.focus === s) ui.focus = null;
  syncJudge(s); unsign1(); save(); render();
}
function wellNav(s, r){
  const target = r === 0 ? 't0' : r === 1 ? 't1' : r === 3 ? 't4' : (S.stage === 't3' ? 't3' : 't2');
  if(sIdx(target) > S.furthest) return;
  if(S.stage === target){ ui.focus = s; ui.scrollTo = s; render(); }
  else setStage(target, s);
}
function startNew(){
  S = fresh(); ui.view = 'game'; ui.tried = {}; ui.focus = null; ui.gsel = null;
  setStage('team');
}
function openSlot(id){
  const d = loadSlot(id);

/* ───────── 부분 갱신 (입력 중 포커스 유지) ───────── */
function refresh(){
  switch(S.stage){
    case 'team': {
      const iss = teamIssues(), dup = dupNote();
      $('#team-hint').innerHTML = iss.map(x => `<li>${x}</li>`).join('') + (dup ? `<li>${esc(dup)}</li>` : '');

      $('#sign').disabled = iss.length > 0;
      break;
    }
    case 'prep2': {
      $('#viz').innerHTML = beakersSVG({});
      IDX5.forEach(i => { $('#sum-' + i).textContent = sumText(i); });
      $('#t0err').textContent = tErr(S.r2.t0a) || tErr(S.r2.t0b);
      $('#prep-warn').innerHTML = prepWarn().map(x => `<li class="note">${esc(x)}</li>`).join('');

      $('#start2').disabled = iss.length > 0;

      const n = IDX5.filter(rowDone).length;

      for(const f in TXT){ const e = $('#cnt-' + f); if(e) e.textContent = cntText(f); }

}

/* ───────── 이벤트 ───────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const a = el.dataset.act, s = Number(el.dataset.s);
  switch(a){
    case 'scrim': if(e.target === el) closeModal(); break;
    case 'close': closeModal(); break;
    case 'home': ui.view = 'title'; ui.modal = null; save(); render(); window.scrollTo(0, 0); break;
    case 'new': startNew(); break;
    case 'open': openSlot(el.dataset.id); break;
    case 'delask': {
      const d = loadSlot(el.dataset.id);
      ui.modal = { type:'del', id:el.dataset.id, label: d && d.team.cls && d.team.grp ? `${d.team.cls}반 ${d.team.grp}조` : '이' };
      renderModal(); break;
    }
    case 'del': removeSlot(el.dataset.id); if(S && S.id === el.dataset.id) S = null; ui.modal = null; render(); break;
    case 'exportTeam': exportTeam(); break;
    case 'tgate': openGate(); break;
    case 'pinok': pinSubmit(); break;
    case 'thome': ui.view = 'title'; ui.tDetail = null; render(); window.scrollTo(0, 0); break;
    case 'ttab': ui.tTab = el.dataset.v; ui.tDetail = null; render(); break;
    case 'tcls': ui.tCls = el.dataset.v || null; render(); break;
    case 'tdetail': ui.tDetail = el.dataset.id; render(); window.scrollTo(0, 0); break;
    case 'tback': ui.tDetail = null; render(); window.scrollTo(0, 0); break;
    case 'topen': ui.tOpen = ui.tOpen === el.dataset.id ? null : el.dataset.id; render(); break;
    case 'tdelask': {
      const d = allTeams().find(x => x.id === el.dataset.id);
      ui.modal = { type:'tdel', id:el.dataset.id, label: d ? `${d.team.cls}반 ${d.team.grp}조` : '이' }; renderModal(); break;
    }
    case 'tdel': deleteTeam(el.dataset.id); break;
    case 'tkey': { const k = Number(el.dataset.s); TS.key[k] = TS.key[k] === el.dataset.v ? null : el.dataset.v; tSave(); render(); break; }
    case 'tg': { const g = gradeOf(el.dataset.id), n = el.dataset.n; g['i' + n] = g['i' + n] === el.dataset.v && !el.classList.contains('sugg') ? null : el.dataset.v; tSave(); render(); break; }
    case 'tc3': { const g = gradeOf(el.dataset.id), k = Number(el.dataset.k); g.c3[k] = !g.c3[k]; g.c3set = true; tSave(); render(); break; }
    case 'tp': {
      const g = gradeOf(el.dataset.id), i = el.dataset.i, v = el.dataset.v;
      if(!g.per) g.per = {};
      if(!v || v === g.i4) delete g.per[i]; else g.per[i] = v;
      tSave(); render(); break;
    }
    case 'csv': exportCSV(); break;
    case 'csvcopy': {
      const box = document.getElementById('csvbox');
      const fallback = () => { if(box){ box.focus(); box.select(); } showToast('선택된 내용을 복사하세요.'); };
      try{ navigator.clipboard.writeText(box ? box.value : '').then(() => showToast('복사했어요.'), fallback); }catch(e){ fallback(); }
      break;
    }
    case 'go': go(el.dataset.stage); break;
    case 'next': next(); break;
    case 'role': {
      const i = Number(el.dataset.i), rid = el.dataset.role;
      for(const k in S.roles) if(S.roles[k] === i) S.roles[k] = null;
      S.roles[rid] = i; save(); render(); break;
    }
    case 'role2': {
      const i = Number(el.dataset.i), rid = el.dataset.role;
      for(const k in S.r2.roles) if(S.r2.roles[k] === i) S.r2.roles[k] = null;
      S.r2.roles[rid] = i; save(); render(); break;
    }
    case 'chk': { const i = Number(el.dataset.i); S.checks[i] = !S.checks[i]; save(); render(); break; }
    case 'chk2': { const i = Number(el.dataset.i); S.r2.checks[i] = !S.r2.checks[i]; save(); render(); break; }
    case 'start':
      if(!S.checks.every(Boolean)) break;
      if(!S.startAt) S.startAt = Date.now();
      go(S.furthest > sIdx('t0') ? STAGES[S.furthest] : 't0'); break;
    case 'start2':
      if(prepIssues().length) break;
      if(!S.r2.startAt) S.r2.startAt = Date.now();
      go(S.furthest > sIdx('m2') ? STAGES[S.furthest] : 'm2'); break;
    case 'set': setRec(s, el.dataset.f, el.dataset.v); break;
    case 'phsheet': ui.modal = { type:'ph', s }; renderModal(); break;
    case 'setph': ui.modal = null; setRec(s, 'ph', el.dataset.v); break;
    case 'testnext': testNext(); break;
    case 'well': wellNav(s, Number(el.dataset.r)); break;
    case 'keep': { ui.keepId = el.dataset.id; ui.keepTxt = ''; ui.keepErr = ''; renderModal(); const k = document.getElementById('kw'); if(k) k.focus(); break; }
    case 'keepcancel': { ui.keepId = null; ui.keepErr = ''; renderModal(); break; }
    case 'keepok': {
      const ph = (ui.modal && ui.modal.ph) || 1, arr = ph === 2 ? S.r2.flags : S.flags;
      const f = arr.find(x => x.id === el.dataset.id);
      const k = document.getElementById('kw'), why = k ? k.value.trim() : '';
      if(why.length < 5){ ui.keepTxt = why; ui.keepErr = '다시 확인한 내용을 5자 이상 적어요.'; renderModal(); const k2 = document.getElementById('kw'); if(k2) k2.focus(); break; }
      ui.keepId = null; ui.keepErr = '';
      if(f){ f.st = 'kept'; f.done = Date.now(); f.why = why; }
      save();
      if(!arr.some(x => x.st === 'open')){ const p = ui.pending; ui.modal = null; ui.pending = null; renderModal(); if(p) p(); }
      else renderModal();
      break;
    }
    case 'remeasure': {
      const i = TESTS.findIndex(t => t.id === el.dataset.t);
      ui.modal = null; ui.pending = null; renderModal();
      setStage('t'+i, s); break;
    }
    case 'remeasure2': {
      const i = el.dataset.i === '' ? null : Number(el.dataset.i);
      ui.modal = null; ui.pending = null; renderModal();
      setStage(el.dataset.target, i); break;
    }
    case 'jliq': { const j = S.judge[s]; j.liq = el.dataset.v; j.ok = false; unsign1(); save(); render(); break; }
    case 'jchip': {
      const j = S.judge[s], id = el.dataset.id;
      j.chips = j.chips.includes(id) ? j.chips.filter(x => x !== id) : [...j.chips, id];
      j.ok = false; unsign1(); save(); render(); break;
    }
    case 'jok': {
      ui.tried[s] = true;
      const j = S.judge[s];
      if(!judgeMsgs(s).errors.length){ j.ok = true; j.sig = recSig(s); ui.stamp = s; }
      save(); render(); break;
    }
    case 'mix': S.reply.mix[s] = el.dataset.v; unsign1(); save(); render(); break;
    case 'sus': {
      const l = S.reply.sus;
      S.reply.sus = l.includes(s) ? l.filter(x => x !== s) : [...l, s];
      S.reply.none = false; unsign1(); save(); render(); break;
    }
    case 'susnone': S.reply.none = !S.reply.none; if(S.reply.none) S.reply.sus = []; unsign1(); save(); render(); break;
    case 'sign':
      if(replyIssues().length) break;
      S.reply.signed = true; S.endAt = Date.now(); save(); go('report'); break;
    case 'to2': go(S.furthest >= P2 ? STAGES[S.furthest] : 'case2'); break;

    case 'tstep': {
      const i = Number(el.dataset.i), d = S.r2.data[i], I = initT(i);
      const base = tval(d.t) ?? (I != null ? r1(I) : 25);
      d.t = clamp(r1(base + 0.1 * Number(el.dataset.d)), 0, 60).toFixed(1);
      unsign2(); save(); render(); break;
    }
    case 'bcol': { const i = Number(el.dataset.i); S.r2.data[i].color = el.dataset.v; unsign2(); save(); render(); break; }
    case 'bk': { const i = Number(el.dataset.i); ui.focus = i; ui.scrollTo = i; render(); break; }
    case 'm2next': if(IDX5.every(rowDone)) go(S.furthest > sIdx('m2') ? STAGES[S.furthest] : 'g2'); break;
    case 'gcol': {
      const i = Number(el.dataset.i), [lo, hi] = tRange();
      let t;
      if(ui.kbd || (!e.clientX && !e.clientY)) t = S.r2.plot[i] ?? (lo + hi) / 2;
      else {
        const svg = el.ownerSVGElement, pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        t = lo + (G.B - p.y) / (G.B - G.T) * (hi - lo);
      }
      S.r2.plot[i] = clamp(r1(t), lo, hi); ui.gsel = i; unsign2(); save(); render(); break;
    }
    case 'gsel': ui.gsel = Number(el.dataset.i); render(); break;
    case 'gstep': {
      const i = ui.gsel; if(i == null) break;
      const [lo, hi] = tRange(), base = S.r2.plot[i] ?? r1((lo + hi) / 2);
      S.r2.plot[i] = clamp(r1(base + 0.1 * Number(el.dataset.d)), lo, hi);
      unsign2(); save(); render(); break;
    }
    case 'peak': S.r2.peak = Number(el.dataset.i); unsign2(); save(); render(); break;
    case 'mb': ui.mb = Number(el.dataset.i); ui.msel = null; ui.mmsg = ''; render(); break;
    case 'ion': {
      const b = Number(el.dataset.b), k = el.dataset.k, x = Number(el.dataset.x), m = mstate(b);
      if(!m || m.st.done) break;
      const sel = ui.msel;
      ui.mmsg = '';
      if(!sel || sel.b !== b) ui.msel = { b, k, x };
      else if(sel.k === k && sel.x === x) ui.msel = null;
      else if(sel.k === k) ui.msel = { b, k, x };
      else if((sel.k === 'h' && k === 'o') || (sel.k === 'o' && k === 'h')){
        const h = sel.k === 'h' ? sel.x : x, o = sel.k === 'o' ? sel.x : x;
        m.st.pairs.push([h, o]); ui.msel = null; ui.mpop = { b, h }; unsign2(); save();
      } else {
        ui.mmsg = `${ION[sel.k].name}과 ${ION[k].name}은 만나도 물 분자가 되지 않아요.`;
        ui.msel = null;
      }
      render(); break;
    }
    case 'mdone': {
      const m = mstate(ui.mb);
      if(m.h > 0 && m.o > 0) ui.mmsg = '아직 짝을 지어 물 분자가 될 수 있는 이온이 남아 있어요.';
      else { m.st.done = true; ui.mmsg = ''; ui.msel = null; unsign2(); save(); }
      render(); break;
    }
    case 'mreset': {
      const m = mstate(ui.mb);
      Object.assign(m.st, { pairs:[], done:false, liq:null });
      ui.msel = null; ui.mmsg = ''; unsign2(); save(); render(); break;
    }
    case 'mliq': { const m = mstate(ui.mb); m.st.liq = el.dataset.v; unsign2(); save(); render(); break; }
    case 'mnext': {
      const nx = IDX5.find(k => !modelOk(k));
      if(nx != null){ ui.mb = nx; ui.msel = null; ui.mmsg = ''; ui.scrollSel = '.mtabs'; }
      render(); break;
    }
    case 'pick': S.r2.concl.pick = Number(el.dataset.i); unsign2(); save(); render(); break;
    case 'sign2':
      if(issues2().length) break;
      S.r2.concl.signed = true; S.r2.endAt = Date.now(); save(); go('final'); break;
  }
});

function onInput(e){
  const el = e.target, k = el.dataset && el.dataset.in;
  if(k === 'tkname'){ TS.names[Number(el.dataset.s)] = el.value; tSave(); return; }
  if(!k || !S || ui.view !== 'game') return;
  const i = Number(el.dataset.i);
  if(k === 'cls' || k === 'grp') S.team[k] = el.value;
  else if(/^m\d$/.test(k)) S.team.m[Number(k.slice(1))] = el.value;
  else if(k === 'note'){ S.reply.note = el.value; unsign1(); }
  else if(k === 'cv'){
    const v = el.value.replace(/\D/g, '').slice(0, 3);
    if(v !== el.value) el.value = v;
    S.r2.cond[i][el.dataset.side] = v; unsign2();
  } else if(k === 't0' || k === 't'){
    const v = cleanT(el.value);
    if(v !== el.value) el.value = v;
    if(k === 't0') S.r2[el.dataset.k] = v; else S.r2.data[i].t = v;
    unsign2();
  } else if(k === 'c2'){ S.r2.concl[el.dataset.f] = el.value; unsign2(); }
  save();
  refresh();
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);

document.addEventListener('change', e => {
  if(e.target && e.target.id === 'imp' && e.target.files && e.target.files.length){ importFiles([...e.target.files]); e.target.value = ''; }
});
document.addEventListener('focusout', () => {
  if(!ui.pendingRender) return;
  ui.pendingRender = false;
  setTimeout(softRender, 0);
});
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') pushNow(); });
window.addEventListener('pagehide', () => pushNow());

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && ui.modal){ closeModal(); return; }
  if(e.key === 'Enter' && e.target && (e.target.id === 'pin1' || e.target.id === 'pin2')){ e.preventDefault(); pinSubmit(); return; }
  const t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t instanceof SVGElement && t.getAttribute('role') === 'button'){
    e.preventDefault();
    ui.kbd = true;
    t.dispatchEvent(new MouseEvent('click', { bubbles:true }));
    ui.kbd = false;
  }
});

let tick = 0;
setInterval(() => {
  if(ui.view === 'teacher' && ++tick % 30 === 0 && !ui.modal) softRender();
  const t = document.getElementById('timer');
  if(!t || !S || ui.view !== 'game') return;
  const p2 = ph2(), st = p2 ? S.r2.startAt : S.startAt, en = p2 ? S.r2.endAt : S.endAt;
  if(st) t.textContent = fmt((en || Date.now()) - st);
}, 1000);

migrate();
render();
cloud.ready = initCaps();
})();
</script>
