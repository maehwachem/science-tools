<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전자기 유도 인터랙티브 학습 자료 · KJE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ecf1; --ink:#0f2236; --muted:#566779; --line:#c8d3dc; --panel:#f5f8fa;
  --warm:#d9412f; --cold:#2f7fc1; --ok:#1f8a5b; --hi:#f6c46a;
  --sky1:#86c8ee; --sky2:#d6eefa; --skyInk:#0d2945; --halo:#eef7fc; --walk:#123f70;
  --btn:#0f2236; --btnInk:#f2f6f9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07121d; --ink:#e3ecf4; --muted:#8ea3b6; --line:#1d3349; --panel:#0d1c2c;
    --warm:#ef5a44; --cold:#4d9be0; --ok:#3cc488;
    --sky1:#0c2848; --sky2:#265687; --skyInk:#e8f2fb; --halo:#0b2440; --walk:#e8f2fb;
    --btn:#e3ecf4; --btnInk:#07121d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07121d; --ink:#e3ecf4; --muted:#8ea3b6; --line:#1d3349; --panel:#0d1c2c;
  --warm:#ef5a44; --cold:#4d9be0; --ok:#3cc488;
  --sky1:#0c2848; --sky2:#265687; --skyInk:#e8f2fb; --halo:#0b2440; --walk:#e8f2fb;
  --btn:#e3ecf4; --btnInk:#07121d; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.65 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  overflow:hidden; -webkit-tap-highlight-color:transparent; word-break:keep-all;
}
button{font:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#app{
  height:100%; max-width:1680px; margin:0 auto; display:flex; flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
}
header{flex:none;display:flex;align-items:center;gap:10px;min-height:54px}
.brand{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:23px;line-height:1;white-space:nowrap}
.brand small{font-family:"IBM Plex Sans KR",sans-serif;font-weight:500;font-size:14px;color:var(--muted);margin-left:6px}
#kicker{flex:1;min-width:0;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line);padding-left:14px}
.ibtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
#stageWrap{flex:none;width:100%}
#stage{
  position:relative;width:100%;margin:0 auto;aspect-ratio:1000/560;
  max-width:calc(52vh * 1.7857); max-width:calc(52dvh * 1.7857);
  border-radius:18px;overflow:hidden;background:#0b2440;cursor:pointer;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
#stage.inter{cursor:default}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#cap{flex:1;min-height:0;overflow:auto;padding:2px 4px 18px;cursor:pointer;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column}
#cap.inter{cursor:auto}
#cap>.inner{margin:0}
nav{flex:none;display:flex;align-items:center;gap:14px;height:70px}
.nbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);color:var(--btnInk);display:grid;place-items:center;cursor:pointer}
.nbtn svg{width:22px;height:22px}
.nbtn:disabled{opacity:.28;cursor:default}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--warm);transition:width .4s ease}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
#pips{display:flex;gap:6px}
#pips i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s}
#pips i.on{background:var(--warm)}
@media (min-aspect-ratio:5/4) and (min-width:640px){
  main{flex-direction:row;align-items:center;gap:30px}
  #stageWrap{flex:1.75 1 0;min-width:0}
  #stage{max-width:calc((100vh - 140px) * 1.7857);max-width:calc((100dvh - 140px) * 1.7857)}
  #cap{flex:1 1 0;min-width:320px;max-width:560px;max-height:100%;align-self:stretch}
  #cap>.inner{margin:auto 0}
}
@media (max-height:560px){
  header{min-height:44px}
  nav{height:58px}
  .nbtn{width:44px;height:44px}
}
/* stage overlays */
#badge{position:absolute;right:12px;top:12px;padding:5px 14px;border-radius:999px;font-weight:700;font-size:clamp(12px,1.5vw,16px);color:#fff;opacity:0;transition:opacity .3s,background-color .5s;pointer-events:none}
#badge.on{opacity:1}
#badge.n{background:#41566d}#badge.e{background:#c93a28}#badge.l{background:#2468b0}#badge.c{background:#b7791f}
#hint{display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .3s;white-space:nowrap}
#hint.on{opacity:1}
#hint b{width:7px;height:7px;border-radius:50%;background:var(--warm);animation:tap 1.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.25);opacity:1}}
/* svg scenes */
.scene{opacity:0;transition:opacity .45s ease;pointer-events:none}
.scene.on{opacity:1}
.lyr{opacity:0;transition:opacity .55s ease}
.lyr.vis{opacity:1}
.tw{fill:#fff;font-weight:600;paint-order:stroke;stroke:rgba(4,18,34,.8);stroke-width:5px;stroke-linejoin:round}
.ts{fill:var(--skyInk);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round}
.tn{fill:#2a3526;font-weight:700;paint-order:stroke;stroke:#efe9d5;stroke-width:4px;stroke-linejoin:round}
.tp{fill:#fff;font-weight:700}
.tq{font-weight:600;paint-order:stroke;stroke:#fbfaf6;stroke-width:5px;stroke-linejoin:round}
.rain line{stroke:#bfe2f7;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:9 13;animation:rain .55s linear infinite}
@keyframes rain{to{stroke-dashoffset:-22}}
.flow{stroke-dasharray:7 7;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.6);opacity:0}}
/* caption */
#cap h2{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(24px,2.3vw,34px);line-height:1.25;margin:0 0 12px}
#cap p{margin:0 0 10px}
.intro{font-size:clamp(16px,1.2vw,19px)}
.st{display:none;padding:2px 0 2px 14px;border-left:3px solid transparent;color:var(--muted);font-size:clamp(16px,1.2vw,19px)}
.st.on{display:block;animation:stIn .4s ease both}
.st.now{color:var(--ink);border-left-color:var(--warm)}
@keyframes stIn{from{opacity:0}to{opacity:1}}
#cap b{font-weight:700}
.cover h1{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(58px,7vw,104px);line-height:.95;margin:0}
.cover .en{font-size:clamp(17px,1.5vw,22px);color:var(--muted);margin:10px 0 18px;letter-spacing:.02em}
.cover .lead{font-size:clamp(18px,1.5vw,22px);font-weight:600;line-height:1.5;margin-bottom:14px}
.cover .org{color:var(--muted)}
.go{margin:8px 0 14px;padding:14px 28px;border-radius:999px;border:0;background:var(--warm);color:#fff;font-weight:700;font-size:17px;cursor:pointer;min-height:48px}
.small{font-size:14px;color:var(--muted)}
/* lab */
.seg{display:flex;gap:8px;margin:14px 0 16px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer}
.seg button[data-e="1"].sel{border-color:#c93a28;background:#c93a28;color:#fff}
.seg button[data-e="0"].sel{border-color:#41566d;background:#41566d;color:#fff}
.seg button[data-e="-1"].sel{border-color:#2468b0;background:#2468b0;color:#fff}
.sl{display:block;font-weight:700;margin-bottom:2px}
input[type=range]{width:100%;height:36px;accent-color:var(--warm);cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-4px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:9px 12px;align-items:center;margin:16px 0 12px;font-size:15px}
.mbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:5px}
.mv{font-weight:700;min-width:6.5em;text-align:right;font-size:14px}
.nowst{font-size:17px}
/* compare table */
.cmp{width:100%;border-collapse:collapse;font-size:14px;line-height:1.45;margin-top:4px}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{font-size:15px;border-bottom:2px solid var(--ink)}
.cmp tbody th{font-weight:600;color:var(--muted);width:30%}
.cmp [data-c]{opacity:0;transition:opacity .45s}
.cmp [data-c].on{opacity:1}
.cmp .ce{color:var(--warm)} .cmp .cl{color:var(--cold)}
/* quiz */
.qh{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:4px}
.q{font-size:clamp(16px,1.2vw,19px);font-weight:600}
.bogi{border:1.5px solid var(--ink);border-radius:3px;padding:8px 14px 4px;margin:8px 0 12px;font-size:15px}
.bogi .bt{text-align:center;font-weight:700;margin-bottom:4px}
.bogi p{margin:0 0 6px!important}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;padding:11px 14px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opts.row .opt{flex:1 1 92px;text-align:center;padding:10px 6px;white-space:nowrap}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.wrong{border-color:var(--warm);background:color-mix(in srgb,var(--warm) 12%,var(--panel))}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border-left:4px solid var(--ok)}
.fb.x{border-left-color:var(--warm)}
.qnav{display:flex;gap:8px;margin-top:14px}
.qnav button,.btn2{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer;padding:0 12px}
.qnav button.pri,.btn2.pri{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.qnav button:disabled{opacity:.35;cursor:default}
.score{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:clamp(40px,5vw,64px);line-height:1;margin:6px 0 14px}
.rlist{list-style:none;padding:0;margin:0 0 14px}
.rlist li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.rlist .mk{font-weight:700;width:1.4em}
.rlist .o{color:var(--ok)} .rlist .x{color:var(--warm)}
@media (prefers-reduced-motion:reduce){
  .scene,.lyr{transition-duration:.2s}
  .st.on{animation:none}
  #hint b,.ping{animation:none}
}
#badge.i{background:#c96a1a}#badge.z{background:#41566d}#badge.g{background:#1f8a5b}
#replay{position:absolute;right:12px;top:calc(12px + clamp(30px,4vw,40px));display:flex;align-items:center;gap:6px;padding:6px 14px;min-height:36px;border-radius:999px;border:0;background:rgba(6,20,36,.78);color:#fff;font-weight:700;font-size:clamp(12px,1.4vw,15px);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
#replay.on{opacity:1;pointer-events:auto}
#replay svg{width:16px;height:16px}
.seg button.sel{border-color:var(--btn);background:var(--btn);color:var(--btnInk)}
#stage{touch-action:none}
#stage.zoomed{cursor:move}
#stage.grab{cursor:grab}
#stage.grab.dragging{cursor:grabbing}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:16px 0 8px;padding:12px 14px;border-radius:12px;background:var(--panel)}
.rec .big{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:30px;line-height:1;text-align:right}
.rec .btn2{grid-column:1/-1;min-height:40px}
.lab-sl{margin-top:4px}
.lab-sl.off{opacity:.4}
.cmp tbody th{width:36%}
.credit{margin-top:6px;font-size:13px;color:var(--muted)}
u{text-underline-offset:3px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media (max-width:640px){#replay{padding:4px 9px;min-height:30px;top:calc(8px + 30px)}#replay .lb{display:none}}
#zreset{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;padding:6px 12px;min-height:36px;border-radius:999px;border:0;background:rgba(201,106,26,.94);color:#fff;font-weight:700;font-size:clamp(12px,1.4vw,15px);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}
#zreset.on{opacity:1;pointer-events:auto}
#zreset svg{width:16px;height:16px}
#pause{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 14px;min-height:36px;border-radius:999px;border:0;background:rgba(6,20,36,.78);color:#fff;font-weight:700;font-size:clamp(12px,1.4vw,15px);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,background-color .2s}
#pause.on{opacity:1;pointer-events:auto}
#pause svg{width:15px;height:15px}
#stage.paused #pause{background:rgba(201,106,26,.94)}
#stage.paused #scene *{animation-play-state:paused!important}
@media (max-width:640px){#pause{padding:4px 9px;min-height:30px}#pause .lb{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">전자기 유도<small>Electromagnetic Induction</small></div>
    <div id="kicker" aria-live="polite"></div>
    <button class="ibtn" id="snd" type="button" aria-label="소리 끄기" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke-width="1.6"/><path class="w" d="M15.5 9a4.5 4.5 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg>
    </button>
    <button class="ibtn" id="fs" type="button" aria-label="전체 화면">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>
  <main>
    <div id="stageWrap">
      <div id="stage">
        <svg id="scene" viewBox="0 0 1000 560" role="img" aria-label="전자기 유도 설명 그림"></svg>
        <div id="badge"></div>
        <button id="replay" type="button" aria-label="움직임 다시 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg><span class="lb">다시 보기</span></button>
        <button id="pause" type="button" aria-label="설명을 위한 일시정지" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><path class="pi" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/><path class="pl" d="M8 5l11 7-11 7z" style="display:none"/></svg><span class="lb">설명을 위한 일시정지</span></button>
        <button id="zreset" type="button" aria-label="원래 크기로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg><span id="zlv"></span></button>
      </div>
    </div>
    <section id="cap" aria-live="polite"><div class="inner"></div></section>
  </main>
  <nav>
    <button class="nbtn" id="prev" type="button" aria-label="이전">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="prog">
      <div class="bar"><i id="barI"></i></div>
      <div class="meta"><span id="cnt"></span><span id="hint"><b></b><span></span></span><span id="pips"></span></div>
    </div>
    <button class="nbtn" id="next" type="button" aria-label="다음">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</div>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}
function tx(parent, x, y, str, cls, size, anchor) {
  return el('text', { x, y, class: cls || 'tw', 'font-size': size || 22, 'text-anchor': anchor || 'middle', text: str }, parent);
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const f1 = v => v.toFixed(1);
const ease = t => .5 - .5 * Math.cos(Math.PI * clamp(t));
function lyr(name, parent) { return el('g', { class: 'lyr', 'data-ly': name }, parent); }
function pill(parent, label, fill, w, h, size) {
  const g = el('g', null, parent);
  w = w || 78; h = h || 32;
  el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill }, g);
  const t = el('text', { x: 0, y: (size || 19) * 0.36, 'text-anchor': 'middle', class: 'tp', 'font-size': size || 19, text: label }, g);
  g.t = t;
  return g;
}

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOT = RM ? 0.35 : 1;
const svg = $('#scene');
const defs = el('defs', null, svg);
function lin(id, x1, y1, x2, y2, stops) {
  const g = el('linearGradient', { id, x1, y1, x2, y2 }, defs);
  return stops.map(s => el('stop', { offset: s[0], style: 'stop-color:' + s[1] + ';stop-opacity:' + (s[2] == null ? 1 : s[2]) }, g));
}
function rad(id, stops) {
  const g = el('radialGradient', { id, cx: .5, cy: .5, r: .5 }, defs);
  return stops.map(s => el('stop', { offset: s[0], style: 'stop-color:' + s[1] + ';stop-opacity:' + (s[2] == null ? 1 : s[2]) }, g));
}
lin('bgG', 0, 0, 0, 1, [[0, '#123555'], [1, '#081a2e']]);
lin('nG', 0, 0, 0, 1, [[0, '#f07560'], [1, '#c1352a']]);
lin('sG', 0, 0, 0, 1, [[0, '#62a8e4'], [1, '#2366ad']]);
lin('galvG', 0, 0, 0, 1, [[0, '#f4f7f9'], [1, '#d5dde4']]);
lin('metalG', 0, 0, 0, 1, [[0, '#8fa1b2'], [1, '#55687a']]);
rad('glowG', [[0, '#fff7cf', 1], [.3, '#ffd66b', .8], [1, '#ffb640', 0]]);
rad('coreG', [[0, '#d6fff0', 1], [.5, '#55e0b0', .7], [1, '#1f8a5b', 0]]);

const SKEY = 'emi-sound';

  tick: () => tone(880, 0, .06, 'triangle', .05),

function sndUpdate() {

const QT = ['자석을 넣은 채 멈출 때', '자석을 뺄 때 바늘의 방향', '유도 전류를 세게 하는 방법', '전자기 유도를 이용하지 않는 것', '떨어지는 자석과 유도 전류'];
const CIR = ['①', '②', '③', '④', '⑤'];
function quizScene(q, answered, animate) { applyState(answered ? q.st1 : q.st0, animate); }
function renderQuiz() {
  if (QZ.done) return renderResult();
  const q = QUIZ[QZ.i], a = QZ.ans[QZ.i];
  quizScene(q, a !== null, false);
  inner.innerHTML = `<h2>확인 문제</h2><div class="qh">${QZ.i + 1} / ${QUIZ.length}</div><p class="q">${q.q}</p>` +
    (q.bogi ? `<div class="bogi"><div class="bt">〈보기〉</div>${q.bogi.map(b => `<p>${b}</p>`).join('')}</div>` : '') +
    `<div class="opts${q.row ? ' row' : ''}">` + q.o.map((o, i) => `<button type="button" class="opt" data-i="${i}">${q.row ? o : CIR[i] + ' ' + o}</button>`).join('') + '</div>' +
    '<div id="fbx"></div>' +
    `<div class="qnav"><button type="button" id="qp"${QZ.i === 0 ? ' disabled' : ''}>이전 문제</button><button type="button" id="qn" class="pri">${QZ.i === QUIZ.length - 1 ? '결과 보기' : '다음 문제'}</button></div>`;
  inner.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  $('#qp').onclick = () => { SFX.step(); QZ.i--; renderQuiz(); };
  $('#qn').onclick = () => { if (QZ.i === QUIZ.length - 1) { QZ.done = true; SFX.done(); } else { QZ.i++; SFX.step(); } renderQuiz(); };
  if (a !== null) showFb();
  cap.scrollTop = 0;
  updateNav();
}
function answer(i) {
  if (QZ.ans[QZ.i] !== null) return;
  QZ.ans[QZ.i] = i;
  (i === QUIZ[QZ.i].a ? SFX.ok : SFX.no)();
  showFb();
  quizScene(QUIZ[QZ.i], true, true);
}
function showFb() {
  const q = QUIZ[QZ.i], a = QZ.ans[QZ.i], ok = a === q.a;
  inner.querySelectorAll('.opt').forEach(b => {
    const i = +b.dataset.i;
    b.disabled = true;
    if (i === q.a) b.classList.add('right');
    else if (i === a) b.classList.add('wrong');
  });
  const lab = q.row ? q.o[q.a] : CIR[q.a];
  $('#fbx').innerHTML = `<div class="fb${ok ? '' : ' x'}"><b>${ok ? '정답' : '오답'}</b>${ok ? '' : ` (정답: ${lab})`}<br>${q.ex}</div>`;
  const f = $('#fbx .fb'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
}
function renderResult() {
  const n = QZ.ans.filter((a, i) => a === QUIZ[i].a).length;
  applyState({ scene: 'coil', ly: CO, set: { mode: 'osc' } }, false);
  inner.innerHTML = `<h2>확인 문제 결과</h2><div class="score">${n} / ${QUIZ.length}</div><ul class="rlist">` +
    QUIZ.map((q, i) => { const ok = QZ.ans[i] === q.a; return `<li><span class="mk ${ok ? 'o' : 'x'}">${ok ? '○' : '×'}</span><span>${i + 1}. ${QT[i]}</span></li>`; }).join('') +
    '</ul><div class="qnav"><button type="button" id="qr">다시 풀기</button><button type="button" id="q0" class="pri">처음부터 다시 보기</button></div>';
  $('#qr').onclick = () => { SFX.step(); QZ.i = 0; QZ.ans = QUIZ.map(() => null); QZ.done = false; renderQuiz(); };
  $('#q0').onclick = () => go(0);
  cap.scrollTop = 0;
  updateNav();
}

/* ---------- navigation ---------- */
function maxK(sl) { return sl.steps.length; }
function show(slideChanged, forward) {
  const sl = SLIDES[cur.s];
  if (PAUSED) setPause(false);
  if (slideChanged) { renderCaption(sl); resetZoom(); }
  if (!sl.lab && !sl.quiz) applyState(stateAt(sl, cur.k), !!forward && !slideChanged);
  (slideChanged ? SFX.slide : SFX.step)();
  updateSteps(sl, cur.k);
  updateNav();
}
function next() {
  const sl = SLIDES[cur.s];
  if (!sl.interactive && cur.k < maxK(sl)) { cur.k++; show(false, true); }
  else if (cur.s < SLIDES.length - 1) { cur.s++; cur.k = 0; show(true, true); }
}
function prev() {
  const sl = SLIDES[cur.s];
  if (!sl.interactive && cur.k > 0) { cur.k--; show(false, false); }
  else if (cur.s > 0) { cur.s--; cur.k = maxK(SLIDES[cur.s]); show(true, false); }
}
function go(s) { cur.s = s; cur.k = 0; show(true, true); }
function updateNav() {
  const sl = SLIDES[cur.s], mk = maxK(sl), N = SLIDES.length;
  $('#prev').disabled = cur.s === 0 && cur.k === 0;
  $('#next').disabled = cur.s === N - 1;
  $('#barI').style.width = ((cur.s + (mk ? cur.k / mk : 1)) / N * 100).toFixed(1) + '%';
  $('#cnt').textContent = (cur.s + 1) + ' / ' + N;
  $('#kicker').textContent = sl.ch;
  $('#pips').innerHTML = Array.from({ length: mk }, (_, i) => `<i class="${i < cur.k ? 'on' : ''}"></i>`).join('');
  const hint = document.getElementById('hint');
  const on = !sl.interactive && cur.s < N - 1;
  hint.classList.toggle('on', on);
  hint.querySelector('span').textContent = sl.cover ? '누르면 시작' : cur.k < mk ? '누르면 계속' : '누르면 다음 장';
}

/* ---------- pause ---------- */
let PAUSED = false;
function setPause(on) {
  if (PAUSED === on) return;
  PAUSED = on;
  stage.classList.toggle('paused', on);
  const b = $('#pause');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', on ? '움직임 이어 보기' : '설명을 위한 일시정지');
  b.querySelector('.pi').style.display = on ? 'none' : '';
  b.querySelector('.pl').style.display = on ? '' : 'none';
  b.querySelector('.lb').textContent = on ? '이어 보기' : '설명을 위한 일시정지';
  SFX.tick();
}
$('#pause').addEventListener('click', e => { e.stopPropagation(); setPause(!PAUSED); });
$('#pause').addEventListener('pointerdown', e => e.stopPropagation());

/* ---------- zoom ---------- */
const VB = { x: 0, y: 0, w: 1000 }, ZMAX = 5;
const ZM = { pts: new Map(), pinch: null, pan: null, lastTap: 0, moved: false };
const zoomed = () => VB.w < 999;
function setVB() {
  VB.w = clamp(VB.w, 1000 / ZMAX, 1000);
  const h = VB.w * .56;
  VB.x = clamp(VB.x, 0, 1000 - VB.w); VB.y = clamp(VB.y, 0, 560 - h);
  svg.setAttribute('viewBox', `${f1(VB.x)} ${f1(VB.y)} ${f1(VB.w)} ${f1(h)}`);
  const z = zoomed();
  stage.classList.toggle('zoomed', z);
  $('#zreset').classList.toggle('on', z);
  $('#zlv').textContent = z ? (1000 / VB.w).toFixed(1) + '배 · 원래 크기' : '';
}
function resetZoom() { VB.x = 0; VB.y = 0; VB.w = 1000; setVB(); }
function clientToSvg(cx, cy) { const r = svg.getBoundingClientRect(); return [VB.x + (cx - r.left) / r.width * VB.w, VB.y + (cy - r.top) / r.height * VB.w * .56, r]; }
function zoomAt(cx, cy, f) {
  const [px, py, r] = clientToSvg(cx, cy), nw = clamp(VB.w / f, 1000 / ZMAX, 1000);
  VB.w = nw; VB.x = px - (cx - r.left) / r.width * nw; VB.y = py - (cy - r.top) / r.height * nw * .56;
  setVB();
}
function midDist() {
  const p = [...ZM.pts.values()];
  return [(p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1];
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  ZM.pts.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
  ZM.moved = false;
  if (ZM.pts.size === 2) {
    endDrag(); sx = null;
    const [mx, my, d] = midDist(), [px, py] = clientToSvg(mx, my);
    ZM.pinch = { d, w: VB.w, px, py }; ZM.pan = null;
  } else if (ZM.pts.size === 1 && zoomed() && !SLIDES[cur.s].lab) {
    ZM.pan = { x: e.clientX, y: e.clientY, vx: VB.x, vy: VB.y };
  }
}, true);
addEventListener('pointermove', e => {
  const p0 = ZM.pts.get(e.pointerId);
  if (!p0) return;
  if (Math.hypot(e.clientX - p0.x0, e.clientY - p0.y0) > 6) ZM.moved = true;
  p0.x = e.clientX; p0.y = e.clientY;
  if (ZM.pinch && ZM.pts.size >= 2) {
    const [mx, my, d] = midDist(), r = svg.getBoundingClientRect(), P = ZM.pinch;
    const nw = clamp(P.w * P.d / d, 1000 / ZMAX, 1000);
    VB.w = nw; VB.x = P.px - (mx - r.left) / r.width * nw; VB.y = P.py - (my - r.top) / r.height * nw * .56;
    setVB();
  } else if (ZM.pan) {
    const r = svg.getBoundingClientRect(), k = VB.w / r.width;
    VB.x = ZM.pan.vx - (e.clientX - ZM.pan.x) * k; VB.y = ZM.pan.vy - (e.clientY - ZM.pan.y) * k;
    setVB();
  }
});
function hold() { suppress = true; setTimeout(() => { suppress = false; }, 400); }
function zUp(e) {
  if (!ZM.pts.has(e.pointerId)) return;
  ZM.pts.delete(e.pointerId);
  if (ZM.pinch) { hold(); ZM.moved = true; }
  if (ZM.pts.size < 2) ZM.pinch = null;
  if (ZM.pts.size === 0) {
    ZM.pan = null;
    if (!ZM.moved && e.type === 'pointerup') {
      const now = performance.now();
      if (now - ZM.lastTap < 320 && zoomed()) { resetZoom(); hold(); ZM.lastTap = 0; }
      else ZM.lastTap = now;
    }
  }
}
addEventListener('pointerup', zUp); addEventListener('pointercancel', zUp);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0018)));
}, { passive: false });
$('#zreset').addEventListener('click', e => { e.stopPropagation(); resetZoom(); });
$('#zreset').addEventListener('pointerdown', e => e.stopPropagation());

/* ---------- input ---------- */
let suppress = false, sx = null, sy = 0;
function onTap(e) {
  if (suppress) { suppress = false; return; }
  if (SLIDES[cur.s].interactive) return;
  if (e.target.closest('button,a,input,label,select')) return;
  if (zoomed() && stage.contains(e.target)) return;
  const sel = window.getSelection && String(window.getSelection());
  if (sel) return;
  next();
}
function pd(e) {
  if (DRAG.on || e.target.closest('input,button') || ((zoomed() || ZM.pts.size > 1) && stage.contains(e.target))) { sx = null; return; }
  sx = e.clientX; sy = e.clientY;
}
function pu(e) {
  if (sx === null || ZM.pinch) { sx = null; return; }
  const dx = e.clientX - sx, dy = e.clientY - sy;
  sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 1.4 * Math.abs(dy)) {
    suppress = true; setTimeout(() => { suppress = false; }, 450);
    dx < 0 ? next() : prev();
  }
}
[stage, cap].forEach(n => {
  n.addEventListener('click', onTap);
  n.addEventListener('pointerdown', pd);
  n.addEventListener('pointerup', pu);
  n.addEventListener('pointercancel', () => { sx = null; });
});
$('#replay').addEventListener('click', e => { e.stopPropagation(); replay(); });
$('#replay').addEventListener('pointerdown', e => e.stopPropagation());
$('#next').onclick = () => next();
$('#prev').onclick = () => prev();
addEventListener('keydown', e => {
  const t = e.target, tag = t && t.tagName;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(SLIDES.length - 1); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
  else if (e.key === 'm' || e.key === 'M') sndSet(!SND.on);
  else if (e.key === 'r' || e.key === 'R') replay();
  else if (e.key === 'p' || e.key === 'P') setPause(!PAUSED);
  else if (e.key === '+' || e.key === '=') { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.4); }
  else if (e.key === '-') { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.4); }
  else if (e.key === '0') resetZoom();
});
const fsb = $('#fs');
if (!document.fullscreenEnabled) fsb.hidden = true;
function toggleFS() {
  if (!document.fullscreenEnabled) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
}
fsb.onclick = toggleFS;
document.addEventListener('fullscreenchange', () => fsb.setAttribute('aria-label', document.fullscreenElement ? '전체 화면 끝내기' : '전체 화면'));

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, .05);
  if (PAUSED) dt = 0;
  T += dt * MOT;
  drawScene(dt);
  if (SLIDES[cur.s].lab) updateLab();
  updateBadge();
  sndUpdate();
  requestAnimationFrame(frame);
}

buildCoil(); buildCoilPaths(C.N); buildGen(); buildGsec(); buildRot(); buildPlant(); buildLife(); buildMini();
show(true, false);
requestAnimationFrame(frame);
</script>
